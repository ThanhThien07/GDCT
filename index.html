      deck: [],                // Array of { id, displayNum, optionOrder: ['C','A','D','B'] }
      answers: {}              // questionId -> chosenOriginalKey ('A'|'B'|'C'|'D')
    };

    const qMap = new Map(QUESTION_BANK.map(q => [q.id, q]));
    let filteredDeck = [];
    let visibleLimit = 20;

    // Fisher-Yates shuffle returning a new array
    function fyShuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Build a completely randomized deck: random question order + random option order A/B/C/D
    function buildRandomDeck() {
      const shuffledIds = fyShuffle(QUESTION_BANK.map(q => q.id));
      state.deck = shuffledIds.map((id, idx) => ({
        id,
        displayNum: idx + 1,
        optionOrder: fyShuffle(LETTERS)
      }));
    }

    function init() {
      // Load theme preference
      if (localStorage.getItem('gdct_theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
      syncThemeIcons();

      // Load saved state
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.deck) && parsed.deck.length === QUESTION_BANK.length) {
            state.mode = parsed.mode || 'practice';
            state.viewMode = parsed.viewMode || 'list';
            state.showOrigin = parsed.showOrigin !== undefined ? parsed.showOrigin : true;
            state.examSubmitted = !!parsed.examSubmitted;
            state.deck = parsed.deck;
            state.answers = parsed.answers || {};
          } else {
            buildRandomDeck();
          }
        } catch (e) {
          buildRandomDeck();
        }
      } else {
        buildRandomDeck();
      }

      document.getElementById('show-orig-toggle').checked = state.showOrigin;
      saveState();
      refreshAll(true);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          mode: state.mode,
          viewMode: state.viewMode,
          showOrigin: state.showOrigin,
          examSubmitted: state.examSubmitted,
          deck: state.deck,
          answers: state.answers
        }));
      } catch (e) {}
    }

    // Get status of a question by its permanent ID
    function getQStatus(qId) {
      const picked = state.answers[qId];
      if (!picked) return 'undone';
      const q = qMap.get(qId);
      return picked === q.answer ? 'correct' : 'wrong';
    }

    // Shuffle both question order and option positions immediately
    function shuffleBothNow() {
      // Pick a sample question (e.g. id=31) to show before/after in toast
      const prevItem31 = state.deck.find(d => d.id === 31);
      const q31 = qMap.get(31);
      const prevNum = prevItem31 ? prevItem31.displayNum : 31;
      const prevAnsLetter = prevItem31 ? LETTERS[prevItem31.optionOrder.indexOf(q31.answer)] : q31.answer;

      buildRandomDeck();
      state.singleIndex = 0;
      visibleLimit = 20;
      saveState();
      refreshAll(true);

      const newItem31 = state.deck.find(d => d.id === 31);
      const newNum = newItem31.displayNum;
      const newAnsLetter = LETTERS[newItem31.optionOrder.indexOf(q31.answer)];

      showToast(`Đã trộn đề! (VD: Câu ${prevNum} đ/a ${prevAnsLetter} ➔ Câu ${newNum} đ/a ${newAnsLetter})`);
    }

    function resetAllConfirm() {
      if (!confirm('Xóa toàn bộ đáp án đã chọn và trộn ngẫu nhiên lại bộ đề mới?')) return;
      state.answers = {};
      state.examSubmitted = false;
      state.singleIndex = 0;
      buildRandomDeck();
      visibleLimit = 20;
      saveState();
      refreshAll(true);
      showToast('Đã xóa tiến độ & trộn lại 296 câu hỏi và đáp án!');
    }

    function setMode(m) {
      if (state.mode === m) return;
      state.mode = m;
      if (m === 'practice') state.examSubmitted = false;
      saveState();
      refreshAll(false);
    }

    function setViewMode(vm) {
      if (state.viewMode === vm) return;
      state.viewMode = vm;
      state.singleIndex = 0;
      saveState();
      refreshAll(false);
    }

    function setFilter(f) {
      state.filter = f;
      state.singleIndex = 0;
      visibleLimit = 20;
      refreshAll(false);
    }

    function handleLessonChange() {
      state.lesson = document.getElementById('lesson-select').value;
      state.singleIndex = 0;
      visibleLimit = 20;
      refreshAll(false);
    }

    function handleSearch() {
      const val = document.getElementById('search-input').value;
      state.search = val.trim().toLowerCase();
      document.getElementById('clear-search-btn').classList.toggle('hidden', !state.search);
      state.singleIndex = 0;
      visibleLimit = 20;
      refreshAll(false);
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      state.search = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      state.singleIndex = 0;
      visibleLimit = 20;
      refreshAll(false);
    }

    function toggleShowOrigin() {
      state.showOrigin = document.getElementById('show-orig-toggle').checked;
      saveState();
      renderQuestions();
    }

    function selectAnswer(qId, chosenOriginalKey) {
      if (state.mode === 'exam' && state.examSubmitted) return;
      state.answers[qId] = chosenOriginalKey;
      saveState();

      // Update just this card and stats/grid if filter is 'all'
      if (state.filter === 'all' && state.viewMode === 'list') {
        const cardEl = document.getElementById(`qcard-${qId}`);
        const deckItem = state.deck.find(d => d.id === qId);
        if (cardEl && deckItem) {
          cardEl.outerHTML = renderCardHTML(deckItem);
        }
        updateStatsAndButtons();
        updateGridButton(qId);
      } else {
        refreshAll(false);
      }
    }

    function submitExam() {
      const doneCount = Object.keys(state.answers).length;
      if (!confirm(`Bạn đã trả lời ${doneCount}/${QUESTION_BANK.length} câu. Nộp bài và xem điểm ngay?`)) return;
      state.examSubmitted = true;
      saveState();
      refreshAll(false);
      let correct = 0;
      QUESTION_BANK.forEach(q => {
        if (state.answers[q.id] === q.answer) correct++;
      });
      const tenScore = ((correct / QUESTION_BANK.length) * 10).toFixed(2);
      showToast(`Kết quả: Đúng ${correct}/${QUESTION_BANK.length} câu (${tenScore}/10 điểm)`);
    }

    function computeFilteredDeck() {
      const qSearch = state.search;
      filteredDeck = state.deck.filter(item => {
        const q = qMap.get(item.id);
        if (state.lesson !== 'all' && String(q.lesson) !== state.lesson) return false;

        const st = getQStatus(item.id);
        if (state.filter === 'undone' && st !== 'undone') return false;
        if (state.filter === 'done' && st === 'undone') return false;
        if (state.filter === 'correct' && st !== 'correct') return false;
        if (state.filter === 'wrong' && st !== 'wrong') return false;

        if (qSearch) {
          const matchNum = String(item.displayNum) === qSearch || `câu ${item.displayNum}` === qSearch;
          const matchQ = q.question.toLowerCase().includes(qSearch);
          const matchOpt = Object.values(q.options).some(t => t.toLowerCase().includes(qSearch));
          if (!matchNum && !matchQ && !matchOpt) return false;
        }
        return true;
      });
    }

    function updateStatsAndButtons() {
      // Lesson-scoped pool for filter counts
      const scopedItems = state.deck.filter(item => {
        const q = qMap.get(item.id);
        return state.lesson === 'all' || String(q.lesson) === state.lesson;
      });

      let done = 0, correct = 0, wrong = 0;
      scopedItems.forEach(item => {
        const st = getQStatus(item.id);
        if (st !== 'undone') {
          done++;
          if (st === 'correct') correct++;
          else wrong++;
        }
      });

      const total = scopedItems.length;
      const undone = total - done;
      const pctDone = total > 0 ? Math.round((done / total) * 100) : 0;
      const accuracy = done > 0 ? Math.round((correct / done) * 100) : 0;
      const score10 = total > 0 ? ((correct / total) * 10).toFixed(1) : '0.0';

      // Navbar & Sidebar stats
      document.getElementById('nav-done').textContent = `${done}/${total}`;
      document.getElementById('nav-correct').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '?' : correct;
      document.getElementById('nav-wrong').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '?' : wrong;
      document.getElementById('nav-score').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '?' : score10;

      document.getElementById('side-percent').textContent = `${pctDone}% hoàn thành`;
      document.getElementById('progress-bar').style.width = `${pctDone}%`;
      document.getElementById('stat-total-done').textContent = `${done}/${total}`;
      document.getElementById('stat-correct').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '-' : correct;
      document.getElementById('stat-wrong').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '-' : wrong;
      document.getElementById('stat-accuracy').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '-' : `${accuracy}%`;

      // Filter pill counts
      document.getElementById('cnt-all').textContent = total;
      document.getElementById('cnt-undone').textContent = undone;
      document.getElementById('cnt-done').textContent = done;
      document.getElementById('cnt-correct').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '-' : correct;
      document.getElementById('cnt-wrong').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '-' : wrong;

      // Filter active styles
      ['all', 'undone', 'done', 'correct', 'wrong'].forEach(f => {
        const el = document.getElementById(`flt-${f}`);
        if (state.filter === f) {
          el.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-teal-600 text-white shadow-xs transition cursor-pointer';
        } else {
          el.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-300 transition cursor-pointer';
        }
      });

      // Mode & View toggles
      const activeToggle = 'py-1.5 px-2.5 rounded-lg text-xs font-bold bg-white dark:bg-slate-900 text-teal-600 dark:text-teal-400 shadow-xs transition cursor-pointer';
      const inactiveToggle = 'py-1.5 px-2.5 rounded-lg text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition cursor-pointer';
      document.getElementById('btn-mode-practice').className = state.mode === 'practice' ? activeToggle : inactiveToggle;
      document.getElementById('btn-mode-exam').className = state.mode === 'exam' ? activeToggle : inactiveToggle;
      document.getElementById('btn-view-list').className = state.viewMode === 'list' ? activeToggle : inactiveToggle;
      document.getElementById('btn-view-single').className = state.viewMode === 'single' ? activeToggle : inactiveToggle;

      document.getElementById('submit-exam-btn').classList.toggle('hidden', !(state.mode === 'exam' && !state.examSubmitted));
    }

    function renderGrid() {
      const grid = document.getElementById('question-grid');
      document.getElementById('grid-count').textContent = filteredDeck.length;
      grid.innerHTML = filteredDeck.map((item, idx) => {
        return `<button id="gbtn-${item.id}" onclick="jumpToQuestion(${item.id}, ${idx})" class="${getGridBtnClass(item.id, idx)}">${item.displayNum}</button>`;
      }).join('');
    }

    function getGridBtnClass(qId, idxInFiltered) {
      const st = getQStatus(qId);
      const isCurrentSingle = state.viewMode === 'single' && idxInFiltered === state.singleIndex;
      let base = 'h-8 rounded-lg text-xs font-bold flex items-center justify-center border transition cursor-pointer ';
      if (isCurrentSingle) base += 'ring-2 ring-teal-500 ring-offset-1 dark:ring-offset-slate-900 ';

      if (st === 'undone') {
        return base + 'bg-slate-50 hover:bg-slate-100 text-slate-600 border-slate-200 dark:bg-slate-800/70 dark:hover:bg-slate-800 dark:text-slate-400 dark:border-slate-700';
      }
      if (state.mode === 'exam' && !state.examSubmitted) {
        return base + 'bg-sky-50 text-sky-700 border-sky-300 dark:bg-sky-950/60 dark:text-sky-300 dark:border-sky-800';
      }
      if (st === 'correct') {
        return base + 'bg-emerald-500 text-white border-emerald-600 shadow-2xs';
      }
      return base + 'bg-rose-500 text-white border-rose-600 shadow-2xs';
    }

    function updateGridButton(qId) {
      const btn = document.getElementById(`gbtn-${qId}`);
      if (!btn) return;
      const idx = filteredDeck.findIndex(d => d.id === qId);
      btn.className = getGridBtnClass(qId, idx);
    }

    function jumpToQuestion(qId, idxInFiltered) {
      if (state.viewMode === 'single') {
        state.singleIndex = idxInFiltered;
        renderQuestions();
        renderGrid();
        return;
      }
      if (idxInFiltered >= visibleLimit) {
        visibleLimit = idxInFiltered + 10;
        renderQuestions();
      }
      const el = document.getElementById(`qcard-${qId}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('ring-2', 'ring-teal-500');
        setTimeout(() => el.classList.remove('ring-2', 'ring-teal-500'), 1200);
      }
    }

    function renderCardHTML(deckItem) {
      const q = qMap.get(deckItem.id);
      const pickedKey = state.answers[q.id];
      const isAnswered = pickedKey !== undefined;
      const reveal = (state.mode === 'practice' && isAnswered) || (state.mode === 'exam' && state.examSubmitted);
      const isCorrect = pickedKey === q.answer;

      let badgeHTML = '<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400">Chưa làm</span>';
      if (reveal && isAnswered) {
        badgeHTML = isCorrect
          ? '<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800">✓ Chính xác</span>'
          : '<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300 border border-rose-300 dark:border-rose-800">✕ Sai</span>';
      } else if (reveal && !isAnswered) {
        badgeHTML = '<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-700 dark:bg-amber-950/80 dark:text-amber-300">Bỏ trống</span>';
      } else if (isAnswered) {
        badgeHTML = '<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-sky-100 text-sky-700 dark:bg-sky-950/80 dark:text-sky-300">Đã chọn</span>';
      }

      const currentCorrectLetter = LETTERS[deckItem.optionOrder.indexOf(q.answer)];
      const originHTML = state.showOrigin
        ? `<span class="text-xs font-medium text-slate-400 dark:text-slate-500">• Bài ${q.lesson} (Gốc: Câu ${q.lessonQ}${reveal ? ` • Đ/A ${q.answer} ➔ ${currentCorrectLetter}` : ''})</span>`
        : `<span class="text-xs font-medium text-slate-400 dark:text-slate-500">• Bài ${q.lesson}</span>`;

      const optionsHTML = deckItem.optionOrder.map((origKey, displayIdx) => {
        const displayLetter = LETTERS[displayIdx];
        const optText = q.options[origKey];
        const isThisPicked = pickedKey === origKey;
        const isThisRight = origKey === q.answer;

        let rowCls = 'group w-full text-left p-3.5 rounded-xl border transition flex items-start gap-3 cursor-pointer ';
        let pillCls = 'w-7 h-7 rounded-lg text-xs font-extrabold flex items-center justify-center shrink-0 transition ';

        if (reveal) {
          if (isThisRight) {
            rowCls += 'bg-emerald-50/90 border-emerald-400 text-emerald-950 dark:bg-emerald-950/40 dark:border-emerald-600 dark:text-emerald-100';
            pillCls += 'bg-emerald-600 text-white';
          } else if (isThisPicked && !isThisRight) {
            rowCls += 'bg-rose-50/90 border-rose-400 text-rose-950 dark:bg-rose-950/40 dark:border-rose-600 dark:text-rose-100';
            pillCls += 'bg-rose-600 text-white';
          } else {
            rowCls += 'bg-slate-50/50 border-slate-200/70 text-slate-500 dark:bg-slate-900/40 dark:border-slate-800 dark:text-slate-500 opacity-75';
            pillCls += 'bg-slate-200/70 text-slate-500 dark:bg-slate-800 dark:text-slate-500';
          }
        } else if (isThisPicked) {
          rowCls += 'bg-teal-50/80 border-teal-500 text-teal-950 dark:bg-teal-950/40 dark:border-teal-500 dark:text-teal-100 shadow-2xs';
          pillCls += 'bg-teal-600 text-white';
        } else {
          rowCls += 'bg-slate-50/70 hover:bg-teal-50/40 border-slate-200/90 hover:border-teal-400/70 text-slate-700 dark:bg-slate-800/40 dark:hover:bg-slate-800 dark:border-slate-700/80 dark:text-slate-200';
          pillCls += 'bg-white border border-slate-300 text-slate-600 group-hover:border-teal-500 group-hover:text-teal-600 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-300';
        }

        return `
          <button type="button" onclick="selectAnswer(${q.id}, '${origKey}')" class="${rowCls}">
            <span class="${pillCls}">${displayLetter}</span>
            <span class="text-sm sm:text-[15px] leading-relaxed pt-0.5 flex-1">${escapeHtml(optText)}</span>
          </button>
        `;
      }).join('');

      return `
        <article id="qcard-${q.id}" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 shadow-xs transition">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="inline-flex items-center px-3 py-1 rounded-lg text-xs font-extrabold bg-teal-600 text-white shadow-2xs">
                Câu ${deckItem.displayNum}
              </span>
              ${originHTML}
            </div>
            ${badgeHTML}
          </div>
          <h2 class="text-base sm:text-[17px] font-semibold leading-relaxed text-slate-900 dark:text-white mb-4">
            ${escapeHtml(q.question)}
          </h2>
          <div class="grid grid-cols-1 gap-2.5">
            ${optionsHTML}
          </div>
        </article>
      `;
    }

    function renderQuestions() {
      const container = document.getElementById('questions-list');
      const loadMoreWrap = document.getElementById('load-more-wrap');

      if (filteredDeck.length === 0) {
        loadMoreWrap.classList.add('hidden');
        container.innerHTML = `
          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-10 text-center">
            <p class="text-sm font-semibold text-slate-500 dark:text-slate-400">Không tìm thấy câu hỏi nào khớp với bộ lọc hiện tại.</p>
          </div>
        `;
        return;
      }

      if (state.viewMode === 'single') {
        loadMoreWrap.classList.add('hidden');
        if (state.singleIndex >= filteredDeck.length) state.singleIndex = 0;
        const item = filteredDeck[state.singleIndex];
        container.innerHTML = `
          ${renderCardHTML(item)}
          <div class="flex items-center justify-between gap-3 pt-2">
            <button onclick="stepSingle(-1)" ${state.singleIndex === 0 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs sm:text-sm font-semibold disabled:opacity-40 hover:bg-slate-50 dark:hover:bg-slate-800 transition cursor-pointer">
              ← Câu trước
            </button>
            <span class="text-xs font-bold text-slate-500">
              Vị trí ${state.singleIndex + 1} / ${filteredDeck.length}
            </span>
            <button onclick="stepSingle(1)" ${state.singleIndex >= filteredDeck.length - 1 ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl bg-teal-600 text-white text-xs sm:text-sm font-semibold disabled:opacity-40 hover:bg-teal-700 transition cursor-pointer">
              Câu tiếp theo →
            </button>
          </div>
        `;
        return;
      }

      const slice = filteredDeck.slice(0, visibleLimit);
      container.innerHTML = slice.map(renderCardHTML).join('');
      loadMoreWrap.classList.toggle('hidden', visibleLimit >= filteredDeck.length);
    }

    function stepSingle(delta) {
      const next = state.singleIndex + delta;
      if (next < 0 || next >= filteredDeck.length) return;
      state.singleIndex = next;
      renderQuestions();
      renderGrid();
    }

    function loadMore() {
      visibleLimit = Math.min(visibleLimit + 25, filteredDeck.length);
      renderQuestions();
    }

    window.addEventListener('scroll', () => {
      if (state.viewMode !== 'list') return;
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 500) {
        if (visibleLimit < filteredDeck.length) {
          visibleLimit = Math.min(visibleLimit + 20, filteredDeck.length);
          renderQuestions();
        }
      }
    });

    function refreshAll(scrollTop = false) {
      computeFilteredDeck();
      updateStatsAndButtons();
      renderGrid();
      renderQuestions();
      if (scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('gdct_theme', isDark ? 'dark' : 'light');
      syncThemeIcons();
    }

    function syncThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('icon-sun').classList.toggle('hidden', !isDark);
      document.getElementById('icon-moon').classList.toggle('hidden', isDark);
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('translate-y-24', 'opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.classList.add('translate-y-24', 'opacity-0');
      }, 3200);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
