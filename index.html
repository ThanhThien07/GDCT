u tin theo Lênin?","options":{"A":"Tuyên ngôn của Đảng Cộng sản.","B":"Tư bản.","C":"Đường kách mệnh.","D":"Sơ thảo lần thứ nhất Luận cương về vấn đề dân tộc và vấn đề thuộc địa."},"answer":"D"},{"id":151,"lesson":3,"lessonTitle":"Bài 3","lessonQ":34,"question":"Tác phẩm Đường kách mệnh được xuất bản năm 1927 có ý nghĩa chủ yếu nào sau đây?","options":{"A":"Tổng kết thắng lợi của Cách mạng tháng Tám.","B":"Chuẩn bị tư tưởng chính trị cho việc thành lập Đảng Cộng sản Việt Nam.","C":"Đề ra đường lối kháng chiến chống thực dân Pháp.","D":"Tổng kết công cuộc đổi mới đất nước."},"answer":"B"},{"id":152,"lesson":3,"lessonTitle":"Bài 3","lessonQ":35,"question":"Hội nghị hợp nhất các tổ chức cộng sản đầu năm 1930 diễn ra tại địa điểm nào?","options":{"A":"Hà Nội, Việt Nam.","B":"Quảng Châu, Trung Quốc.","C":"Xiêm, Thái Lan.","D":"Hương Cảng, Trung Quốc."},"answer":"D"},{"id":153,"lesson":3,"lessonTitle":"Bài 3","lessonQ":36,"question":"Theo Cương lĩnh chính trị đầu tiên, giai cấp nào giữ vai trò lãnh đạo cách mạng Việt Nam?","options":{"A":"Giai cấp nông dân.","B":"Giai cấp tư sản dân tộc.","C":"Giai cấp vô sản.","D":"Tầng lớp trí thức."},"answer":"C"},{"id":154,"lesson":3,"lessonTitle":"Bài 3","lessonQ":37,"question":"Vào ngày 2-9-1945, Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập tại đâu?","options":{"A":"Quảng trường Ba Đình, Hà Nội.","B":"Quảng trường Nhà hát Lớn, Hà Nội.","C":"Chiến khu Việt Bắc.","D":"Dinh Độc Lập, Sài Gòn."},"answer":"A"},{"id":155,"lesson":3,"lessonTitle":"Bài 3","lessonQ":38,"question":"Vì sao vào cuối thế kỷ XIX, đầu thế kỷ XX, cách mạng Việt Nam rơi vào tình trạng khủng hoảng, bế tắc về đường lối cứu nước và giai cấp lãnh đạo?","options":{"A":"Phong trào yêu nước chưa thể hiện tinh thần dân tộc.","B":"Các phong trào yêu nước theo khuynh hướng phong kiến và tư sản đều thất bại, chưa tìm được con đường cứu nước phù hợp.","C":"Giai cấp công nhân Việt Nam đã nắm chính quyền nhưng không tổ chức được bộ máy nhà nước.","D":"Thực dân Pháp không thực hiện chính sách khai thác thuộc địa."},"answer":"B"},{"id":156,"lesson":3,"lessonTitle":"Bài 3","lessonQ":39,"question":"Sự kiện Nguyễn Ái Quốc bỏ phiếu tán thành Quốc tế Cộng sản tại Đại hội XVIII của Đảng Xã hội Pháp tháng 12-1920 thể hiện điều gì?","options":{"A":"Người đã hoàn thành việc thành lập Đảng Cộng sản Việt Nam.","B":"Người chuyển sang khuynh hướng cứu nước theo con đường tư sản.","C":"Bước chuyển về chất trong lập trường chính trị của Nguyễn Ái Quốc.","D":"Phong trào công nhân Việt Nam đã giành được chính quyền."},"answer":"C"},{"id":157,"lesson":3,"lessonTitle":"Bài 3","lessonQ":40,"question":"Nội dung nào sau đây phản ánh đúng phương hướng chiến lược của cách mạng Việt Nam được nêu trong Cương lĩnh chính trị đầu tiên của Đảng?","options":{"A":"Tiến hành cải cách dân chủ để xây dựng chủ nghĩa tư bản.","B":"Làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản.","C":"Tập trung phát triển kinh tế tư nhân, lấy công nghiệp làm trọng tâm.","D":"Hoàn thành cách mạng xã hội chủ nghĩa trước khi giải quyết vấn đề dân tộc."},"answer":"B"},{"id":158,"lesson":3,"lessonTitle":"Bài 3","lessonQ":41,"question":"Theo Cương lĩnh chính trị đầu tiên, quan hệ giữa cách mạng Việt Nam và cách mạng thế giới được xác định như thế nào?","options":{"A":"Cách mạng Việt Nam tách biệt với phong trào cách mạng thế giới.","B":"Cách mạng Việt Nam chỉ có nhiệm vụ giải quyết vấn đề ruộng đất.","C":"Cách mạng Việt Nam phụ thuộc hoàn toàn vào cách mạng ở một nước khác.","D":"Cách mạng Việt Nam là bộ phận của cách mạng thế giới, cần liên lạc với các dân tộc bị áp bức và giai cấp vô sản thế giới."},"answer":"D"},{"id":159,"lesson":3,"lessonTitle":"Bài 3","lessonQ":42,"question":"Hội nghị Trung ương 8 tháng 5-1941 có ý nghĩa quan trọng đối với thắng lợi Cách mạng tháng Tám năm 1945 vì đã","options":{"A":"đặt nhiệm vụ giải phóng dân tộc lên hàng đầu, thành lập Mặt trận Việt Minh và xây dựng lực lượng cách mạng.","B":"quyết định ký Hiệp định Sơ bộ với thực dân Pháp.","C":"đề ra đường lối đổi mới toàn diện đất nước.","D":"quyết định mở cuộc Tổng tiến công và nổi dậy mùa Xuân năm 1975."},"answer":"A"},{"id":160,"lesson":3,"lessonTitle":"Bài 3","lessonQ":43,"question":"Việc ký Hiệp định Sơ bộ ngày 6-3-1946 với đại diện Chính phủ Pháp nhằm mục đích chủ yếu nào?","options":{"A":"Từ bỏ mục tiêu độc lập dân tộc.","B":"Tranh thủ thời gian hòa bình, củng cố lực lượng và tránh phải đối phó với nhiều kẻ thù cùng lúc.","C":"Chuyển toàn bộ chính quyền cách mạng cho thực dân Pháp.","D":"Chấm dứt hoàn toàn cuộc đấu tranh chống thực dân Pháp."},"answer":"B"},{"id":161,"lesson":3,"lessonTitle":"Bài 3","lessonQ":44,"question":"Nội dung nào phản ánh đúng cốt lõi đường lối kháng chiến chống thực dân Pháp của Đảng?","options":{"A":"Đánh nhanh, thắng nhanh, dựa hoàn toàn vào viện trợ bên ngoài.","B":"Chỉ đấu tranh quân sự, không kết hợp các mặt trận khác.","C":"Chiến tranh nhân dân chính nghĩa, toàn dân, toàn diện, lâu dài, dựa vào sức mình là chính.","D":"Chỉ tiến hành đấu tranh chính trị tại các đô thị."},"answer":"C"},{"id":162,"lesson":3,"lessonTitle":"Bài 3","lessonQ":45,"question":"Ý nghĩa quan trọng của thắng lợi cuộc kháng chiến chống Mỹ, cứu nước giai đoạn 1954–1975 đối với Việt Nam là gì?","options":{"A":"Mở đầu quá trình thực dân Pháp xâm lược Việt Nam.","B":"Đánh dấu sự ra đời của Đảng Cộng sản Việt Nam.","C":"Chấm dứt thời kỳ khủng hoảng đường lối cứu nước đầu thế kỷ XX.","D":"Giải phóng miền Nam, thống nhất đất nước và mở ra kỷ nguyên cả nước hòa bình, thống nhất, đi lên chủ nghĩa xã hội."},"answer":"D"},{"id":163,"lesson":3,"lessonTitle":"Bài 3","lessonQ":46,"question":"Cuối thế kỷ XIX, các cuộc khởi nghĩa chống Pháp theo khuynh hướng phong kiến thể hiện tinh thần yêu nước nhưng cuối cùng đều thất bại. Từ thực tiễn này, vấn đề nổi bật của cách mạng Việt Nam lúc bấy giờ là","options":{"A":"thiếu tinh thần đấu tranh của nhân dân.","B":"chưa giải quyết được khủng hoảng về đường lối cứu nước và giai cấp lãnh đạo.","C":"chưa xuất hiện mâu thuẫn giữa dân tộc Việt Nam với thực dân Pháp.","D":"phong trào yêu nước đã hoàn toàn chấm dứt."},"answer":"B"},{"id":164,"lesson":3,"lessonTitle":"Bài 3","lessonQ":47,"question":"Từ năm 1928, Hội Việt Nam Cách mạng Thanh niên chủ trương “Vô sản hóa”, đưa hội viên vào nhà máy, hầm mỏ và đồn điền. Xét về lý luận cách mạng, chủ trương này trực tiếp hướng đến mục tiêu nào?","options":{"A":"Truyền bá chủ nghĩa Mác–Lênin, gắn hoạt động cách mạng với phong trào công nhân và thúc đẩy giải phóng dân tộc theo con đường cách mạng vô sản.","B":"Xây dựng lực lượng tư sản để lãnh đạo cách mạng theo con đường tư bản chủ nghĩa.","C":"Thay thế hoàn toàn phong trào công nhân bằng hoạt động nghị trường.","D":"Tập trung xây dựng chính quyền cách mạng sau khi giành được độc lập."},"answer":"A"},{"id":165,"lesson":3,"lessonTitle":"Bài 3","lessonQ":48,"question":"Cuối năm 1929, ba tổ chức cộng sản ở Việt Nam hoạt động riêng rẽ, có nguy cơ dẫn đến chia rẽ. Việc Nguyễn Ái Quốc chủ động triệu tập Hội nghị hợp nhất phản ánh vai trò nào của Người?","options":{"A":"Trực tiếp lãnh đạo cuộc kháng chiến chống thực dân Pháp.","B":"Tổ chức công cuộc đổi mới kinh tế đất nước.","C":"Chuẩn bị về chính trị, tư tưởng, tổ chức và thúc đẩy thống nhất các tổ chức cộng sản để thành lập Đảng.","D":"Thay mặt Chính phủ ký Hiệp định Sơ bộ năm 1946."},"answer":"C"},{"id":166,"lesson":3,"lessonTitle":"Bài 3","lessonQ":49,"question":"Trong giai đoạn 1930–1945, Đảng tổ chức và lãnh đạo các cao trào cách mạng 1930–1931, 1936–1939 và cao trào kháng Nhật cứu nước năm 1945. Nhận định nào khái quát đúng vai trò của các cao trào này?","options":{"A":"Các cao trào chỉ có ý nghĩa kinh tế, không liên quan đến đấu tranh giành chính quyền.","B":"Các cao trào thay thế hoàn toàn vai trò của đường lối cách mạng.","C":"Các cao trào chỉ diễn ra ở một số đô thị lớn.","D":"Các cao trào góp phần chuẩn bị lực lượng và điều kiện, tiến tới thắng lợi của Cách mạng tháng Tám năm 1945."},"answer":"D"},{"id":167,"lesson":3,"lessonTitle":"Bài 3","lessonQ":50,"question":"Tháng 3-1945, khi Nhật đảo chính Pháp ở Đông Dương, Thường vụ Trung ương Đảng ban hành chỉ thị “Nhật Pháp bắn nhau và hành động của chúng ta”. Xét trong tiến trình cách mạng, chỉ thị này thể hiện nội dung nào?","options":{"A":"Sự chủ động đánh giá tình hình và đề ra chủ trương phù hợp để thúc đẩy cao trào kháng Nhật cứu nước.","B":"Chủ trương ngừng toàn bộ hoạt động đấu tranh giành độc lập.","C":"Quyết định chuyển sang xây dựng chủ nghĩa xã hội trên phạm vi cả nước.","D":"Chủ trương hòa hoãn lâu dài với cả Nhật và Pháp."},"answer":"A"},{"id":168,"lesson":3,"lessonTitle":"Bài 3","lessonQ":51,"question":"Sau Cách mạng tháng Tám năm 1945, chính quyền cách mạng phải đối phó với nhiều khó khăn và các thế lực đe dọa. Việc ký Hiệp định Sơ bộ ngày 6-3-1946 phù hợp với nguyên tắc chỉ đạo nào?","options":{"A":"Chỉ sử dụng đấu tranh quân sự trong mọi hoàn cảnh.","B":"Từ bỏ mục tiêu độc lập để đổi lấy sự ổn định trước mắt.","C":"Linh hoạt về sách lược, tranh thủ thời gian và tập trung củng cố lực lượng.","D":"Không cần tính đến tương quan lực lượng và tình hình quốc tế."},"answer":"C"},{"id":169,"lesson":3,"lessonTitle":"Bài 3","lessonQ":52,"question":"Trong thắng lợi chống Mỹ, cứu nước giai đoạn 1954–1975 là sự kiện giải phóng miền Nam, thống nhất đất nước, hoàn thành cách mạng dân tộc dân chủ trên phạm vi cả nước. Nhận định nào thể hiện đúng nhất ý nghĩa lịch sử của thắng lợi này?","options":{"A":"Đưa Việt Nam trở thành thuộc địa của một cường quốc khác.","B":"Mở ra kỷ nguyên cả nước hòa bình, thống nhất, cùng thực hiện nhiệm vụ đi lên chủ nghĩa xã hội.","C":"Chấm dứt vai trò lãnh đạo của Đảng trong cách mạng Việt Nam.","D":"Đánh dấu sự bắt đầu của phong trào đấu tranh chống thực dân Pháp."},"answer":"B"},{"id":170,"lesson":3,"lessonTitle":"Bài 3","lessonQ":53,"question":"Cương lĩnh chính trị đầu tiên xác định nhiệm vụ đánh đổ đế quốc Pháp và phong kiến, đồng thời nêu các nhiệm vụ về kinh tế, văn hóa – xã hội. Cách xác định này cho thấy Cương lĩnh đã","options":{"A":"chỉ tập trung giải quyết vấn đề ruộng đất, không đặt ra nhiệm vụ độc lập dân tộc.","B":"đặt nhiệm vụ phát triển kinh tế lên trên tất cả các nhiệm vụ chính trị.","C":"tách rời nhiệm vụ dân tộc khỏi nhiệm vụ giai cấp.","D":"kết hợp các nhiệm vụ chính trị, kinh tế, văn hóa – xã hội trong đường lối cách mạng."},"answer":"D"},{"id":171,"lesson":3,"lessonTitle":"Bài 3","lessonQ":54,"question":"Cương lĩnh chính trị đầu tiên xác định lực lượng cách mạng gồm công nhân, nông dân và các tầng lớp yêu nước khác; đồng thời đề cập cách ứng xử với những lực lượng chưa phản cách mạng. Nội dung này thể hiện tư tưởng nào?","options":{"A":"Chỉ dựa vào một giai cấp, không cần liên minh với các lực lượng khác.","B":"Xây dựng lực lượng cách mạng trên cơ sở liên minh, đoàn kết và phân hóa các lực lượng xã hội theo thái độ chính trị.","C":"Xem tất cả các giai cấp và tầng lớp đều có vai trò lãnh đạo ngang nhau.","D":"Loại bỏ toàn bộ các tầng lớp ngoài giai cấp công nhân khỏi phong trào cách mạng."},"answer":"B"},{"id":172,"lesson":3,"lessonTitle":"Bài 3","lessonQ":55,"question":"Thắng lợi Cách mạng tháng Tám năm 1945 được lý giải bằng đường lối đúng đắn, sự chuẩn bị lực lượng, phương pháp cách mạng và nghệ thuật chớp thời cơ. Trong đó, việc phát động Tổng khởi nghĩa khi Nhật đầu hàng Đồng minh thể hiện rõ nhất yếu tố nào?","options":{"A":"Chỉ dựa vào điều kiện khách quan mà không cần chuẩn bị lực lượng.","B":"Chờ quân Đồng minh vào Đông Dương rồi mới tổ chức khởi nghĩa.","C":"Kết hợp sự chuẩn bị từ trước với khả năng nhận định và chớp thời cơ cách mạng.","D":"Thực hiện khởi nghĩa trong điều kiện bộ máy thống trị của đối phương hoàn toàn ổn định."},"answer":"C"},{"id":173,"lesson":3,"lessonTitle":"Bài 3","lessonQ":56,"question":"Thắng lợi chống thực dân Pháp (1945–1954), nhận định nào giải thích đúng nhất vì sao đường lối kháng chiến có ý nghĩa quyết định đối với quá trình đi đến thắng lợi?","options":{"A":"Đường lối xác định tính chất chính nghĩa, huy động sức mạnh toàn dân, kết hợp các mặt trận và kiên trì kháng chiến lâu dài.","B":"Đường lối chủ trương chỉ bảo vệ các đô thị, không mở rộng căn cứ địa.","C":"Đường lối đặt toàn bộ trách nhiệm kháng chiến vào lực lượng quân đội chính quy.","D":"Đường lối coi viện trợ bên ngoài là nguồn lực duy nhất quyết định thắng lợi."},"answer":"A"},{"id":174,"lesson":3,"lessonTitle":"Bài 3","lessonQ":57,"question":"Đảng Cộng sản Việt Nam ra đời năm 1930 là kết quả của sự kết hợp chủ nghĩa Mác–Lênin với phong trào công nhân và phong trào yêu nước Việt Nam. Cách lý giải này khẳng định điều gì?","options":{"A":"Đảng ra đời chỉ do tác động từ bên ngoài, không liên quan đến thực tiễn Việt Nam.","B":"Phong trào yêu nước không có vai trò trong quá trình thành lập Đảng.","C":"Sự ra đời của Đảng là kết quả ngẫu nhiên, không có cơ sở lịch sử.","D":"Sự ra đời của Đảng là tất yếu lịch sử, đáp ứng yêu cầu của cách mạng Việt Nam trong bối cảnh mới."},"answer":"D"},{"id":175,"lesson":3,"lessonTitle":"Bài 3","lessonQ":58,"question":"Khi đánh giá vai trò lãnh đạo của Đảng đối với Cách mạng tháng Tám năm 1945, nhấn mạnh cả đường lối, công tác chuẩn bị lực lượng, phương pháp cách mạng và nghệ thuật chớp thời cơ. Cách đánh giá nào phù hợp nhất với những nội dung đó?","options":{"A":"Thắng lợi chỉ bắt nguồn từ sự suy yếu nhất thời của đối phương.","B":"Thắng lợi là kết quả tổng hợp của nhiều nhân tố, trong đó sự lãnh đạo đúng đắn của Đảng giữ vai trò chủ yếu, hàng đầu.","C":"Thắng lợi chỉ do hoạt động ngoại giao quyết định.","D":"Thắng lợi không liên quan đến quá trình chuẩn bị lực lượng cách mạng trước đó."},"answer":"B"},{"id":176,"lesson":3,"lessonTitle":"Bài 3","lessonQ":59,"question":"Sau gần 90 năm dưới sự lãnh đạo của Đảng, Việt Nam đã từ một nước thuộc địa nửa phong kiến trở thành quốc gia độc lập, phát triển theo con đường xã hội chủ nghĩa, có quan hệ quốc tế rộng rãi. Đồng thời, cũng thừa nhận Đảng có lúc phạm sai lầm, khuyết điểm. Cách đánh giá nào phản ánh đầy đủ nhất nội dung này?","options":{"A":"Mọi thành tựu đều tự phát, không có mối liên hệ với đường lối lãnh đạo.","B":"Việc thừa nhận sai lầm đồng nghĩa với phủ nhận toàn bộ thành tựu cách mạng.","C":"Đánh giá lịch sử cần ghi nhận thành tựu, vai trò lãnh đạo và đồng thời nhìn nhận những hạn chế, sai lầm trong quá trình lãnh đạo.","D":"Chỉ cần nêu thành tựu, không cần xem xét những hạn chế trong thực tiễn."},"answer":"C"},{"id":177,"lesson":4,"lessonTitle":"Bài 4","lessonQ":1,"question":"Khi phân biệt đặc trưng với phương hướng xây dựng xã hội xã hội chủ nghĩa, tiêu chí nào phù hợp?","options":{"A":"Đặc trưng là biện pháp ngắn hạn; phương hướng là kết quả đã hoàn tất.","B":"Đặc trưng áp dụng ở địa phương; phương hướng áp dụng ở trung ương.","C":"Đặc trưng chỉ thuộc kinh tế; phương hướng chỉ thuộc hệ thống chính trị.","D":"Đặc trưng nêu xã hội hướng tới; phương hướng nêu định hướng thực hiện."},"answer":"D"},{"id":178,"lesson":4,"lessonTitle":"Bài 4","lessonQ":2,"question":"Nội dung nào là đặc trưng kinh tế trong Cương lĩnh bổ sung, phát triển năm 2011?","options":{"A":"Chủ động hội nhập quốc tế, kết hợp nội lực với nguồn lực bên ngoài để phát triển.","B":"Phát triển kinh tế thị trường định hướng xã hội chủ nghĩa trong quá trình đổi mới.","C":"Kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và quan hệ sản xuất tiến bộ, phù hợp.","D":"Đẩy mạnh công nghiệp hóa gắn phát triển kinh tế tri thức, bảo vệ tài nguyên và môi trường."},"answer":"C"},{"id":179,"lesson":4,"lessonTitle":"Bài 4","lessonQ":3,"question":"Trong báo cáo, nội dung do nhân dân làm chủ được xếp cùng nhóm với đẩy mạnh công nghiệp hóa. Cần điều chỉnh thế nào?","options":{"A":"Xếp cả hai vào nhóm phương hướng về chính trị.","B":"Xếp nội dung đầu vào đặc trưng, nội dung sau vào phương hướng.","C":"Xếp nội dung đầu vào phương hướng, nội dung sau vào đặc trưng.","D":"Xếp cả hai vào nhóm đặc trưng về kinh tế."},"answer":"B"},{"id":180,"lesson":4,"lessonTitle":"Bài 4","lessonQ":4,"question":"Mục tiêu tổng quát của xã hội xã hội chủ nghĩa ở Việt Nam được nêu thế nào?","options":{"A":"Dân giàu, nước mạnh, chỉ tập trung phát triển kinh tế.","B":"Dân giàu, nước mạnh, tăng trưởng thay cho công bằng.","C":"Dân giàu, nước mạnh, ưu tiên đồng nhất mọi khác biệt.","D":"Dân giàu, nước mạnh, dân chủ, công bằng, văn minh."},"answer":"D"},{"id":181,"lesson":4,"lessonTitle":"Bài 4","lessonQ":5,"question":"Đặc trưng về văn hóa của xã hội xã hội chủ nghĩa ở Việt Nam là gì?","options":{"A":"Có nền văn hóa đồng nhất về phong tục giữa mọi vùng.","B":"Có nền văn hóa tiên tiến, đậm đà bản sắc dân tộc.","C":"Có nền văn hóa phát triển dựa chủ yếu trên thương mại giải trí.","D":"Có nền văn hóa giữ nguyên mọi tập quán hình thành trong lịch sử."},"answer":"B"},{"id":182,"lesson":4,"lessonTitle":"Bài 4","lessonQ":6,"question":"Chương trình phát triển tập trung đào tạo nghề, chăm sóc sức khỏe và tạo điều kiện tham gia đời sống xã hội. Đặc trưng nào được thể hiện trực tiếp nhất?","options":{"A":"Có quan hệ hữu nghị và hợp tác với các nước.","B":"Con người có điều kiện phát triển toàn diện.","C":"Có Nhà nước pháp quyền do Đảng lãnh đạo.","D":"Có quan hệ sản xuất tiến bộ, phù hợp."},"answer":"B"},{"id":183,"lesson":4,"lessonTitle":"Bài 4","lessonQ":7,"question":"Nội dung nào thể hiện đúng đặc trưng quan hệ dân tộc được nêu trong giáo trình?","options":{"A":"Bình đẳng, đoàn kết, tôn trọng và giúp nhau cùng phát triển.","B":"Tách quá trình phát triển của mỗi dân tộc khỏi cộng đồng chung.","C":"Phân chia quyền chính trị theo quy mô dân số mỗi dân tộc.","D":"Thống nhất phong tục để giảm khác biệt giữa các dân tộc."},"answer":"A"},{"id":184,"lesson":4,"lessonTitle":"Bài 4","lessonQ":8,"question":"Một đề án coi công nghiệp hóa hoàn tất khi tăng số máy, dù công nghệ lạc hậu và tiêu hao tài nguyên. Nội dung nào của phương hướng xây dựng cần bổ sung trực tiếp?","options":{"A":"Chuyển lao động từ nông nghiệp sang công nghiệp theo chỉ tiêu số lượng.","B":"Gắn hiện đại hóa, kinh tế tri thức với bảo vệ tài nguyên, môi trường.","C":"Tăng quy mô thiết bị tương ứng tốc độ tăng dân số.","D":"Mở rộng khai thác để sử dụng tối đa công suất máy cũ."},"answer":"B"},{"id":185,"lesson":4,"lessonTitle":"Bài 4","lessonQ":9,"question":"Vì sao phát triển kinh tế thị trường được xác định là phương hướng xây dựng chủ nghĩa xã hội?","options":{"A":"Là cách tổ chức, phát triển kinh tế để thực hiện mục tiêu xã hội chủ nghĩa.","B":"Là cơ chế tự bảo đảm mọi mục tiêu xã hội không cần định hướng.","C":"Là dấu hiệu cho thấy mục tiêu xã hội chủ nghĩa đã được hoàn thành.","D":"Là quá trình chuyển quyền quản lý xã hội sang các doanh nghiệp."},"answer":"A"},{"id":186,"lesson":4,"lessonTitle":"Bài 4","lessonQ":10,"question":"Trong nền kinh tế thị trường định hướng xã hội chủ nghĩa, Nhà nước có vai trò nào?","options":{"A":"Trực tiếp ấn định mọi giao dịch mua bán của người dân.","B":"Quản lý, định hướng phát triển bằng pháp luật và chính sách.","C":"Để các doanh nghiệp thực hiện thay quyền lực công.","D":"Không tham gia giải quyết các vấn đề xã hội."},"answer":"B"},{"id":187,"lesson":4,"lessonTitle":"Bài 4","lessonQ":11,"question":"Một nhóm xếp có quan hệ hữu nghị, hợp tác với các nước và thực hiện đường lối đối ngoại độc lập, tự chủ vào cùng loại nội dung. Phân loại nào đúng?","options":{"A":"Nội dung đầu là đặc trưng; nội dung sau là phương hướng.","B":"Nội dung đầu là phương hướng; nội dung sau là đặc trưng.","C":"Cả hai là phương hướng vì đều cần hành động đối ngoại.","D":"Cả hai là đặc trưng vì cùng đề cập quan hệ quốc tế."},"answer":"A"},{"id":188,"lesson":4,"lessonTitle":"Bài 4","lessonQ":12,"question":"Xây dựng nền dân chủ xã hội chủ nghĩa được gắn trực tiếp với nội dung nào trong các phương hướng?","options":{"A":"Đồng nhất ý kiến của các tầng lớp trước khi thực hành dân chủ.","B":"Thay cơ chế đại diện bằng các hoạt động phong trào tự nguyện.","C":"Thực hiện đại đoàn kết dân tộc, tăng cường và mở rộng Mặt trận.","D":"Chuyển trách nhiệm quản lý nhà nước cho các đoàn thể xã hội."},"answer":"C"},{"id":189,"lesson":4,"lessonTitle":"Bài 4","lessonQ":13,"question":"Theo đặc trưng xã hội xã hội chủ nghĩa ở Việt Nam, Nhà nước pháp quyền thuộc về ai?","options":{"A":"Riêng đội ngũ cán bộ.","B":"Riêng một nhóm nghề nghiệp.","C":"Các tổ chức kinh doanh.","D":"Nhân dân."},"answer":"D"},{"id":190,"lesson":4,"lessonTitle":"Bài 4","lessonQ":14,"question":"Kế hoạch phát triển chỉ chú trọng kinh tế, cho rằng quốc phòng, an ninh sẽ tự được bảo đảm khi thu nhập tăng. Hạn chế chính là gì?","options":{"A":"Chưa kết hợp nhiệm vụ xây dựng với bảo vệ Tổ quốc.","B":"Chưa chọn tăng trưởng kinh tế làm nhiệm vụ phát triển.","C":"Đã đặt quốc phòng, an ninh lên trước mọi nhiệm vụ khác.","D":"Đã mở rộng quá mức nội dung bảo vệ tài nguyên."},"answer":"A"},{"id":191,"lesson":4,"lessonTitle":"Bài 4","lessonQ":15,"question":"Một xưởng muốn tăng sản lượng đồng thời giảm ô nhiễm. Giải pháp nào phù hợp phương hướng phát triển?","options":{"A":"Tính sản lượng mà không tính chi phí môi trường.","B":"Đổi mới công nghệ và xử lý chất thải trong quá trình sản xuất.","C":"Giữ công nghệ cũ, chỉ thay tên sản phẩm.","D":"Tăng ca và chuyển chất thải sang khu dân cư khác."},"answer":"B"},{"id":192,"lesson":4,"lessonTitle":"Bài 4","lessonQ":16,"question":"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) xác định xã hội xã hội chủ nghĩa ở Việt Nam có bao nhiêu đặc trưng cơ bản?","options":{"A":"6 đặc trưng.","B":"7 đặc trưng.","C":"8 đặc trưng.","D":"9 đặc trưng."},"answer":"C"},{"id":193,"lesson":4,"lessonTitle":"Bài 4","lessonQ":17,"question":"Nội dung nào sau đây thể hiện đặc trưng tổng quát của xã hội xã hội chủ nghĩa ở Việt Nam?","options":{"A":"Dân giàu, nước mạnh, dân chủ, công bằng, văn minh.","B":"Công nghiệp hóa, hiện đại hóa và hội nhập quốc tế.","C":"Phát triển kinh tế thị trường và mở rộng quan hệ đối ngoại.","D":"Xây dựng hệ thống chính trị tinh gọn, hoạt động hiệu lực, hiệu quả."},"answer":"A"},{"id":194,"lesson":4,"lessonTitle":"Bài 4","lessonQ":18,"question":"Dân chủ xã hội chủ nghĩa có vị trí như thế nào đối với sự phát triển đất nước?","options":{"A":"Chỉ là mục tiêu của sự phát triển đất nước.","B":"Chỉ là phương tiện quản lý xã hội.","C":"Là một hình thức tổ chức kinh tế.","D":"Vừa là bản chất của chế độ, vừa là mục tiêu và động lực của sự phát triển đất nước."},"answer":"D"},{"id":195,"lesson":4,"lessonTitle":"Bài 4","lessonQ":19,"question":"Nền kinh tế phát triển cao trong xã hội xã hội chủ nghĩa ở Việt Nam dựa trên cơ sở nào?","options":{"A":"Lực lượng lao động phổ thông và quan hệ sản xuất truyền thống.","B":"Lực lượng sản xuất hiện đại và quan hệ sản xuất tiến bộ, phù hợp.","C":"Kinh tế nhà nước và việc hạn chế các thành phần kinh tế khác.","D":"Quan hệ sản xuất thống nhất, không có nhiều hình thức sở hữu."},"answer":"B"},{"id":196,"lesson":4,"lessonTitle":"Bài 4","lessonQ":20,"question":"Nền văn hóa mà Việt Nam xây dựng trong thời kỳ quá độ lên chủ nghĩa xã hội có đặc trưng nào?","options":{"A":"Tiên tiến, đậm đà bản sắc dân tộc.","B":"Hiện đại, tiếp thu toàn bộ văn hóa nước ngoài.","C":"Truyền thống, hạn chế giao lưu quốc tế.","D":"Phát triển chủ yếu về vật chất, không chú trọng đời sống tinh thần."},"answer":"A"},{"id":197,"lesson":4,"lessonTitle":"Bài 4","lessonQ":21,"question":"Một trong những đặc trưng về con người trong xã hội xã hội chủ nghĩa ở Việt Nam là gì?","options":{"A":"Chỉ được bảo đảm về việc làm và thu nhập.","B":"Chỉ được chú trọng phát triển tri thức và kỹ năng nghề nghiệp.","C":"Có cuộc sống ấm no, tự do, hạnh phúc và điều kiện phát triển toàn diện.","D":"Được phát triển chủ yếu thông qua hoạt động kinh tế."},"answer":"C"},{"id":198,"lesson":4,"lessonTitle":"Bài 4","lessonQ":22,"question":"Quan hệ giữa các dân tộc trong cộng đồng Việt Nam được xác định như thế nào?","options":{"A":"Ưu tiên phát triển một số dân tộc có điều kiện kinh tế thuận lợi.","B":"Bình đẳng, đoàn kết, tôn trọng và giúp đỡ nhau cùng phát triển.","C":"Tách biệt các dân tộc để bảo tồn bản sắc riêng.","D":"Thực hiện bình đẳng nhưng không cần sự tương trợ giữa các dân tộc."},"answer":"B"},{"id":199,"lesson":4,"lessonTitle":"Bài 4","lessonQ":23,"question":"Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là Nhà nước như thế nào?","options":{"A":"Nhà nước quản lý xã hội chủ yếu bằng các quy tắc đạo đức.","B":"Nhà nước có quyền lực không chịu sự điều chỉnh của Hiến pháp.","C":"Nhà nước của các tổ chức kinh tế, do các tổ chức kinh tế quản lý.","D":"Nhà nước của nhân dân, do nhân dân, vì nhân dân, do Đảng Cộng sản lãnh đạo."},"answer":"D"},{"id":200,"lesson":4,"lessonTitle":"Bài 4","lessonQ":24,"question":"Đường lối đối ngoại của Việt Nam được xác định như thế nào?","options":{"A":"Độc lập, tự chủ, hòa bình, hợp tác và phát triển; đa phương hóa, đa dạng hóa quan hệ.","B":"Ưu tiên quan hệ với một số quốc gia và hạn chế hội nhập quốc tế.","C":"Chỉ tập trung hợp tác kinh tế, không mở rộng quan hệ trên các lĩnh vực khác.","D":"Phụ thuộc vào đường lối đối ngoại của các nước có tiềm lực kinh tế lớn."},"answer":"A"},{"id":201,"lesson":4,"lessonTitle":"Bài 4","lessonQ":25,"question":"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) đề ra bao nhiêu phương hướng cơ bản xây dựng chủ nghĩa xã hội ở Việt Nam?","options":{"A":"5 phương hướng.","B":"6 phương hướng.","C":"8 phương hướng.","D":"10 phương hướng."},"answer":"C"},{"id":202,"lesson":4,"lessonTitle":"Bài 4","lessonQ":26,"question":"Phương hướng đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước gắn với những nội dung nào?","options":{"A":"Phát triển kinh tế tư nhân và mở rộng xuất khẩu.","B":"Phát triển kinh tế tri thức, bảo vệ tài nguyên và môi trường.","C":"Phát triển công nghiệp, không cần chú trọng nông nghiệp và dịch vụ.","D":"Tập trung phát triển các vùng kinh tế trọng điểm, không quan tâm vùng khó khăn."},"answer":"B"},{"id":203,"lesson":4,"lessonTitle":"Bài 4","lessonQ":27,"question":"Trong nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam, thành phần kinh tế nào giữ vai trò chủ đạo?","options":{"A":"Kinh tế tư nhân.","B":"Kinh tế có vốn đầu tư nước ngoài.","C":"Kinh tế tập thể.","D":"Kinh tế nhà nước."},"answer":"D"},{"id":204,"lesson":4,"lessonTitle":"Bài 4","lessonQ":28,"question":"Đại đoàn kết toàn dân tộc được xây dựng trên nền tảng liên minh nào dưới sự lãnh đạo của Đảng?","options":{"A":"Liên minh giữa các doanh nghiệp trong nước và doanh nghiệp nước ngoài.","B":"Liên minh giữa các cơ quan nhà nước và các tổ chức kinh tế.","C":"Liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức.","D":"Liên minh giữa các tầng lớp có cùng điều kiện kinh tế."},"answer":"C"},{"id":205,"lesson":4,"lessonTitle":"Bài 4","lessonQ":29,"question":"Quyền lực nhà nước trong Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam được tổ chức như thế nào?","options":{"A":"Thống nhất, có sự phân công, phối hợp và kiểm soát giữa các cơ quan thực hiện quyền lập pháp, hành pháp, tư pháp.","B":"Phân chia hoàn toàn độc lập giữa các cơ quan, không có sự phối hợp.","C":"Tập trung toàn bộ quyền lập pháp, hành pháp và tư pháp vào một cơ quan.","D":"Giao quyền quản lý nhà nước chủ yếu cho các tổ chức xã hội."},"answer":"A"},{"id":206,"lesson":4,"lessonTitle":"Bài 4","lessonQ":30,"question":"Công tác xây dựng Đảng Cộng sản Việt Nam cần hướng đến mục tiêu nào?","options":{"A":"Chỉ chú trọng mở rộng số lượng đảng viên.","B":"Xây dựng Đảng trong sạch, vững mạnh; thường xuyên tự đổi mới, tự chỉnh đốn, nâng cao năng lực lãnh đạo.","C":"Tách hoạt động của Đảng khỏi hệ thống chính trị.","D":"Chỉ tập trung vào công tác cán bộ, không cần quan tâm công tác tư tưởng và tổ chức."},"answer":"B"},{"id":207,"lesson":5,"lessonTitle":"Bài 5","lessonQ":1,"question":"Quan điểm đầu tiên trong Chiến lược phát triển kinh tế - xã hội giai đoạn 2021–2030 là gì?","options":{"A":"Phát triển kinh tế thị trường gắn với mở rộng hội nhập quốc tế.","B":"Phát triển nhanh và bền vững dựa chủ yếu vào khoa học công nghệ, đổi mới sáng tạo và chuyển đổi số.","C":"Phát triển kinh tế gắn với ưu tiên công nghiệp hóa.","D":"Phát triển kinh tế nhà nước giữ vai trò chủ đạo."},"answer":"B"},{"id":208,"lesson":5,"lessonTitle":"Bài 5","lessonQ":2,"question":"Trong quan điểm phát triển kinh tế - xã hội, con người được xác định như thế nào?","options":{"A":"Là đối tượng chủ yếu của hoạt động quản lý nhà nước.","B":"Là nguồn lực bổ sung cho quá trình phát triển kinh tế.","C":"Là chủ thể, nguồn lực chủ yếu và mục tiêu của sự phát triển.","D":"Là nhân tố chỉ quyết định sự phát triển văn hóa, xã hội."},"answer":"C"},{"id":209,"lesson":5,"lessonTitle":"Bài 5","lessonQ":3,"question":"Trong nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam, thành phần kinh tế nào giữ vai trò động lực của nền kinh tế?","options":{"A":"Kinh tế tư nhân.","B":"Kinh tế tập thể.","C":"Kinh tế có vốn đầu tư nước ngoài.","D":"Kinh tế nhà nước."},"answer":"A"},{"id":210,"lesson":5,"lessonTitle":"Bài 5","lessonQ":4,"question":"Nội dung nào sau đây thể hiện một trong những đột phá chiến lược được xác định trong Chiến lược phát triển kinh tế - xã hội giai đoạn 2021–2030 của Việt Nam?","options":{"A":"Tiếp tục hoàn thiện và nâng cao chất lượng thể chế kinh tế thị trường định hướng xã hội chủ nghĩa.","B":"Thu hẹp sự tham gia của các thành phần kinh tế ngoài nhà nước.","C":"Ưu tiên phát triển kinh tế dựa chủ yếu vào khai thác tài nguyên thiên nhiên.","D":"Hạn chế hội nhập kinh tế quốc tế để bảo đảm tính tự chủ của nền kinh tế."},"answer":"A"},{"id":211,"lesson":5,"lessonTitle":"Bài 5","lessonQ":5,"question":"Theo quan điểm phát triển văn hóa, văn hóa có vai trò như thế nào đối với sự phát triển đất nước?","options":{"A":"Là lĩnh vực phục vụ chủ yếu cho nhu cầu giải trí của xã hội.","B":"Là nền tảng tinh thần của xã hội, là mục tiêu và động lực phát triển bền vững đất nước.","C":"Là yếu tố phụ thuộc hoàn toàn vào sự phát triển kinh tế.","D":"Là lĩnh vực chỉ cần được chú trọng khi kinh tế đã phát triển."},"answer":"B"},{"id":212,"lesson":5,"lessonTitle":"Bài 5","lessonQ":6,"question":"Đặc trưng của nền văn hóa Việt Nam được xác định trong chủ trương phát triển văn hóa, con người là gì?","options":{"A":"Hiện đại, thống nhất và tiếp thu toàn bộ văn hóa nước ngoài.","B":"Truyền thống, khép kín và hạn chế giao lưu quốc tế.","C":"Tiên tiến, đậm đà bản sắc dân tộc, thống nhất trong đa dạng.","D":"Phát triển chủ yếu dựa trên các giá trị văn hóa hiện đại."},"answer":"C"},{"id":213,"lesson":5,"lessonTitle":"Bài 5","lessonQ":7,"question":"Giáo dục và đào tạo có sứ mệnh chủ yếu nào trong phát triển văn hóa, con người Việt Nam?","options":{"A":"Nâng cao dân trí, phát triển nguồn nhân lực, bồi dưỡng nhân tài.","B":"Tập trung đào tạo lao động cho khu vực công nghiệp.","C":"Chỉ cung cấp kiến thức chuyên môn phục vụ thị trường lao động.","D":"Ưu tiên đào tạo nhân lực có trình độ cao, hạn chế giáo dục phổ cập."},"answer":"A"},{"id":214,"lesson":5,"lessonTitle":"Bài 5","lessonQ":8,"question":"Khoa học và công nghệ giữ vai trò như thế nào trong phát triển kinh tế - xã hội?","options":{"A":"Chủ yếu phục vụ hoạt động nghiên cứu trong các cơ sở khoa học.","B":"Chỉ góp phần cải thiện điều kiện sinh hoạt của người dân.","C":"Là yếu tố hỗ trợ, không ảnh hưởng đáng kể đến năng suất lao động.","D":"Giữ vai trò then chốt trong phát triển lực lượng sản xuất hiện đại, nâng cao năng suất, chất lượng, hiệu quả và sức cạnh tranh của nền kinh tế."},"answer":"D"},{"id":215,"lesson":5,"lessonTitle":"Bài 5","lessonQ":9,"question":"Một trong những định hướng đổi mới mô hình tăng trưởng kinh tế ở Việt Nam là gì?","options":{"A":"Chủ yếu dựa vào vốn đầu tư nước ngoài và khai thác tài nguyên.","B":"Kết hợp hiệu quả phát triển theo chiều rộng với chiều sâu, chú trọng nâng cao chất lượng tăng trưởng và sức cạnh tranh.","C":"Ưu tiên tăng trưởng kinh tế, tách biệt với bảo vệ môi trường và công bằng xã hội.","D":"Chuyển toàn bộ nguồn lực sang phát triển công nghiệp, giảm đầu tư cho nông nghiệp và dịch vụ."},"answer":"B"},{"id":216,"lesson":5,"lessonTitle":"Bài 5","lessonQ":10,"question":"Trách nhiệm bảo vệ môi trường được xác định","options":{"A":"Là trách nhiệm chủ yếu của các cơ quan quản lý nhà nước.","B":"Là trách nhiệm riêng của doanh nghiệp hoạt động trong lĩnh vực sản xuất.","C":"Là trách nhiệm của cả hệ thống chính trị, toàn xã hội và nghĩa vụ của mọi công dân.","D":"Là trách nhiệm của các tổ chức hoạt động trong lĩnh vực môi trường."},"answer":"C"},{"id":217,"lesson":5,"lessonTitle":"Bài 5","lessonQ":11,"question":"Quan điểm phát triển trong giáo trình, quan hệ giữa phát triển nhanh và bền vững là gì?","options":{"A":"Phát triển nhanh và bền vững là lựa chọn riêng cho từng địa phương.","B":"Bền vững được xác định bằng giữ nguyên tốc độ tăng trưởng.","C":"Phát triển nhanh gắn với bền vững trong quá trình thực hiện.","D":"Hoàn thành phát triển nhanh rồi mới chuyển sang bền vững."},"answer":"C"},{"id":218,"lesson":5,"lessonTitle":"Bài 5","lessonQ":12,"question":"Cùng tăng sản lượng 10%, cơ sở A tăng chủ yếu số lao động; cơ sở B cải tiến công nghệ để tăng năng suất. Hướng chuyển đổi mô hình tăng trưởng được thể hiện rõ hơn ở đâu?","options":{"A":"Cơ sở B vì chú trọng chất lượng và hiệu quả sử dụng nguồn lực.","B":"Cơ sở A vì số lao động tăng phản ánh trình độ công nghệ tăng.","C":"Hai cơ sở như nhau vì mức tăng sản lượng bằng nhau.","D":"Chưa thể phân biệt vì đổi mới công nghệ không liên quan mô hình tăng trưởng."},"answer":"A"},{"id":219,"lesson":5,"lessonTitle":"Bài 5","lessonQ":13,"question":"Ba đột phá chiến lược trong phát triển kinh tế xã hội được giáo trình trình bày là gì?","options":{"A":"Thể chế kinh tế thị trường, nguồn nhân lực và hệ thống kết cấu hạ tầng.","B":"Mở rộng hành chính, tăng biên chế và phát triển khu dân cư.","C":"Sản lượng công nghiệp, số lượng đô thị và quy mô xuất khẩu.","D":"Nguồn tài nguyên, lao động giản đơn và vốn vay nước ngoài."},"answer":"A"},{"id":220,"lesson":5,"lessonTitle":"Bài 5","lessonQ":14,"question":"Nguồn nhân lực chất lượng cao có ý nghĩa gì đối với công nghiệp hóa, hiện đại hóa?","options":{"A":"Giúp tiếp thu, vận hành và sáng tạo công nghệ.","B":"Làm giảm yêu cầu học tập thường xuyên của người lao động.","C":"Thay thế hoàn toàn nhu cầu đầu tư kết cấu hạ tầng.","D":"Chỉ cần cho ngành giáo dục, không cần cho sản xuất."},"answer":"A"},{"id":221,"lesson":5,"lessonTitle":"Bài 5","lessonQ":15,"question":"Kế hoạch giảm nghèo chỉ trợ cấp ngắn hạn, chưa hỗ trợ kỹ năng và sinh kế. Giải pháp bổ sung nào hướng tới hiệu quả bền vững?","options":{"A":"Tăng số đợt trao quà nhưng giữ nguyên cách xác định nhu cầu.","B":"Chia trợ cấp bằng nhau mà không xét điều kiện từng hộ.","C":"Đánh giá thành công bằng tổng kinh phí đã giải ngân.","D":"Đào tạo nghề và tạo cơ hội việc làm phù hợp người thụ hưởng."},"answer":"D"},{"id":222,"lesson":5,"lessonTitle":"Bài 5","lessonQ":16,"question":"Trong quan điểm của Đảng nêu ở giáo trình, văn hóa có vị trí nào đối với phát triển?","options":{"A":"Hệ thống phong tục giữ nguyên độc lập với biến đổi xã hội.","B":"Nguồn thu thương mại dùng để thay thế các ngành sản xuất.","C":"Nền tảng tinh thần, mục tiêu và động lực phát triển bền vững.","D":"Lĩnh vực tiêu dùng tinh thần hình thành sau khi kinh tế hoàn tất."},"answer":"C"},{"id":223,"lesson":5,"lessonTitle":"Bài 5","lessonQ":17,"question":"Khai thác lễ hội làm du lịch, phương án nào cân bằng hợp lý phát huy và bảo tồn?","options":{"A":"Chỉ đo hiệu quả bảo tồn bằng doanh thu bán vé mỗi mùa lễ hội.","B":"Xây dựng sản phẩm du lịch có cộng đồng tham gia và giữ giá trị cốt lõi.","C":"Giữ nguyên mọi tập tục kể cả yếu tố không còn phù hợp đời sống.","D":"Tái dựng mọi nghi thức theo thị hiếu du khách để tăng lượng khách."},"answer":"B"},{"id":224,"lesson":5,"lessonTitle":"Bài 5","lessonQ":18,"question":"Muốn sử dụng tốt thiết bị thực hành mới, sinh viên cần ưu tiên việc gì?","options":{"A":"Chỉ quan sát mà không cần thực hành.","B":"Chỉ ghi nhớ tên hãng chế tạo thiết bị.","C":"Dựa vào kinh nghiệm máy cũ cho mọi thao tác.","D":"Học nguyên lý và rèn kỹ năng vận hành đúng quy trình."},"answer":"D"},{"id":225,"lesson":5,"lessonTitle":"Bài 5","lessonQ":19,"question":"Cụm nội dung nào phản ánh định hướng xây dựng con người phát triển toàn diện?","options":{"A":"Nhân cách, đạo đức, trí tuệ, năng lực sáng tạo, thể chất và trách nhiệm xã hội.","B":"Kỹ thuật chuyên môn, tốc độ thao tác và số sản phẩm hoàn thành.","C":"Thu nhập, mức tiêu dùng, sở hữu tài sản và khả năng cạnh tranh cá nhân.","D":"Bằng cấp, danh hiệu thi đua, vị trí việc làm và số chứng chỉ tích lũy."},"answer":"A"},{"id":226,"lesson":5,"lessonTitle":"Bài 5","lessonQ":20,"question":"Phát triển bền vững cần kết hợp những mặt nào?","options":{"A":"Sản lượng, doanh thu và số máy.","B":"Kinh tế, quảng cáo và thị hiếu.","C":"Kinh tế, xã hội và môi trường.","D":"Đầu tư, vay vốn và giá bán."},"answer":"C"},{"id":227,"lesson":6,"lessonTitle":"Bài 6","lessonQ":1,"question":"Mối quan hệ giữa xây dựng và bảo vệ Tổ quốc được xác định thế nào?","options":{"A":"Hai nhiệm vụ chia riêng cho dân sự và lực lượng vũ trang.","B":"Hai giai đoạn kế tiếp, xây dựng hoàn tất rồi mới bảo vệ.","C":"Hai nhiệm vụ chiến lược gắn bó, tác động qua lại.","D":"Hai lựa chọn ưu tiên loại trừ nhau trong thời bình."},"answer":"C"},{"id":228,"lesson":6,"lessonTitle":"Bài 6","lessonQ":2,"question":"Trong nhiệm vụ quốc phòng, an ninh, phân biệt nào đúng về chủ thể và lực lượng nòng cốt?","options":{"A":"Quân đội và công an thực hiện; nhân dân chỉ hỗ trợ khi có chiến tranh.","B":"Toàn Đảng, toàn dân, toàn quân thực hiện; quân đội và công an là nòng cốt.","C":"Lực lượng chuyên trách thực hiện; cơ sở kinh tế đứng ngoài nhiệm vụ.","D":"Nhà nước thực hiện; tổ chức xã hội thay thế lực lượng chuyên trách."},"answer":"B"},{"id":229,"lesson":6,"lessonTitle":"Bài 6","lessonQ":3,"question":"Quy hoạch vùng biên giới bố trí dân cư, phát triển giao thông và bảo đảm khả năng phòng thủ. Cách làm này thể hiện nội dung nào?","options":{"A":"Chuyển mọi hoạt động dân sinh sang nhiệm vụ chiến đấu.","B":"Tách nhiệm vụ an ninh khỏi kế hoạch phát triển lãnh thổ.","C":"Kết hợp phát triển kinh tế xã hội với quốc phòng, an ninh.","D":"Đồng nhất đầu tư kinh tế với chi tiêu quân sự."},"answer":"C"},{"id":230,"lesson":6,"lessonTitle":"Bài 6","lessonQ":4,"question":"Kết hợp kinh tế với quốc phòng, an ninh cần thực hiện vào thời điểm nào?","options":{"A":"Chỉ sau khi dự án kinh tế ngừng hoạt động.","B":"Chỉ khi có yêu cầu từ doanh nghiệp.","C":"Chỉ sau khi đã xảy ra xung đột vũ trang.","D":"Ngay từ xây dựng chiến lược, quy hoạch và kế hoạch phát triển."},"answer":"D"},{"id":231,"lesson":6,"lessonTitle":"Bài 6","lessonQ":5,"question":"Mục tiêu giữ vững môi trường hòa bình trong công tác đối ngoại gắn trực tiếp với yêu cầu nào?","options":{"A":"Chỉ mở rộng quan hệ với nước có cùng chế độ chính trị.","B":"Giảm hợp tác đa phương để hạn chế khác biệt chính sách.","C":"Tạo điều kiện phát triển đất nước và bảo vệ lợi ích quốc gia dân tộc.","D":"Duy trì quan hệ hiện có bất kể thay đổi lợi ích quốc gia."},"answer":"C"},{"id":232,"lesson":6,"lessonTitle":"Bài 6","lessonQ":6,"question":"Theo định hướng hội nhập được nêu trong giáo trình, lĩnh vực nào là trọng tâm?","options":{"A":"Hội nhập quốc phòng.","B":"Hội nhập giáo dục.","C":"Hội nhập văn hóa.","D":"Hội nhập kinh tế."},"answer":"D"},{"id":233,"lesson":6,"lessonTitle":"Bài 6","lessonQ":7,"question":"Khi xảy ra bất đồng thương mại, hai nước vẫn hợp tác về giáo dục và tiếp tục đàm phán. Cách ứng xử này thể hiện quan điểm nào?","options":{"A":"Đồng nhất bất đồng một lĩnh vực với đối đầu chiến lược.","B":"Vừa hợp tác vừa đấu tranh trong quan hệ quốc tế.","C":"Giải quyết bất đồng bằng chấm dứt quan hệ mọi lĩnh vực.","D":"Dùng hợp tác giáo dục để thay việc bảo vệ lợi ích thương mại."},"answer":"B"},{"id":234,"lesson":6,"lessonTitle":"Bài 6","lessonQ":8,"question":"Nguyên tắc nào cần giữ vững trong quá trình hội nhập quốc tế?","options":{"A":"Chỉ hợp tác với nước cùng chế độ chính trị.","B":"Phụ thuộc một đối tác để có thị trường ổn định.","C":"Đánh đổi chủ quyền lấy lợi ích thương mại.","D":"Độc lập, tự chủ và lợi ích quốc gia dân tộc."},"answer":"D"},{"id":235,"lesson":6,"lessonTitle":"Bài 6","lessonQ":9,"question":"Doanh nghiệp xuất khẩu gặp tiêu chuẩn kỹ thuật mới. Hướng nào tăng năng lực hội nhập lâu dài?","options":{"A":"Chờ hỗ trợ thuế để bù chi phí hàng bị trả lại.","B":"Nâng công nghệ, kỹ năng và chất lượng để đáp ứng cam kết.","C":"Tăng sản lượng nhằm bù tổn thất do không đạt chuẩn.","D":"Chuyển sang thị trường dễ tính mà giữ nguyên mọi quy trình."},"answer":"B"},{"id":236,"lesson":6,"lessonTitle":"Bài 6","lessonQ":10,"question":"Trong quan hệ quốc tế, hợp tác và đấu tranh có quan hệ thế nào?","options":{"A":"Có hợp tác thì không còn bất đồng lợi ích.","B":"Chỉ đấu tranh sau khi cắt mọi quan hệ ngoại giao.","C":"Vừa hợp tác vừa đấu tranh phù hợp từng vấn đề.","D":"Có bất đồng thì chấm dứt hợp tác mọi lĩnh vực."},"answer":"C"},{"id":237,"lesson":6,"lessonTitle":"Bài 6","lessonQ":11,"question":"Xu thế lớn của tình hình chính trị, kinh tế, an ninh thế giới và khu vực hiện nay là gì?","options":{"A":"Cạnh tranh và đối đầu giữa các quốc gia hoàn toàn chấm dứt.","B":"Hòa bình, độc lập dân tộc, dân chủ, hợp tác và phát triển.","C":"Các quốc gia thu hẹp quan hệ hợp tác quốc tế.","D":"Chiến tranh trở thành xu thế chủ đạo trong quan hệ quốc tế."},"answer":"B"},{"id":238,"lesson":6,"lessonTitle":"Bài 6","lessonQ":12,"question":"Một trong những thành tựu nổi bật của Việt Nam sau gần 40 năm đổi mới là gì?","options":{"A":"Chấm dứt hoàn toàn những khó khăn trong phát triển kinh tế.","B":"Không còn chịu tác động từ tình hình quốc tế.","C":"Uy tín quốc tế của đất nước ngày càng được nâng cao.","D":"Không còn nguy cơ về an ninh và chủ quyền lãnh thổ."},"answer":"C"},{"id":239,"lesson":6,"lessonTitle":"Bài 6","lessonQ":13,"question":"Mục tiêu, nhiệm vụ của quốc phòng, an ninh Việt Nam là gì?","options":{"A":"Bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc.","B":"Ưu tiên phát triển kinh tế và giảm các hoạt động bảo vệ an ninh.","C":"Chỉ tập trung bảo vệ các cơ quan nhà nước và lực lượng vũ trang.","D":"Giải quyết mọi tranh chấp quốc tế bằng biện pháp quân sự."},"answer":"A"},{"id":240,"lesson":6,"lessonTitle":"Bài 6","lessonQ":14,"question":"Lực lượng nào giữ vai trò nòng cốt trong thực hiện nhiệm vụ quốc phòng, an ninh?","options":{"A":"Các tổ chức kinh tế và doanh nghiệp.","B":"Các tổ chức xã hội và tổ chức nghề nghiệp.","C":"Các cơ quan thông tin, truyền thông.","D":"Quân đội nhân dân và Công an nhân dân."},"answer":"D"},{"id":241,"lesson":6,"lessonTitle":"Bài 6","lessonQ":15,"question":"Theo quan điểm của Đảng, nền tảng vững chắc của quốc phòng, an ninh là gì?","options":{"A":"Sự gia tăng hoạt động cạnh tranh kinh tế giữa các quốc gia.","B":"Sự ổn định và phát triển bền vững mọi mặt đời sống kinh tế – xã hội.","C":"Việc tập trung toàn bộ nguồn lực cho quốc phòng.","D":"Việc hạn chế hợp tác kinh tế với các nước khác."},"answer":"B"},{"id":242,"lesson":6,"lessonTitle":"Bài 6","lessonQ":16,"question":"Quan điểm nào sau đây thể hiện đúng chủ trương giải quyết tranh chấp, bất đồng với các nước liên quan?","options":{"A":"Sử dụng biện pháp quân sự trong mọi trường hợp.","B":"Tránh tham gia các hoạt động hợp tác quốc tế.","C":"Kiên trì giải quyết bằng biện pháp hòa bình, trên cơ sở luật pháp quốc tế.","D":"Chấp nhận từ bỏ lợi ích quốc gia để duy trì quan hệ hữu nghị."},"answer":"C"},{"id":243,"lesson":6,"lessonTitle":"Bài 6","lessonQ":17,"question":"Đường lối đối ngoại của Việt Nam được xác định như thế nào?","options":{"A":"Độc lập, tự chủ, hòa bình, hợp tác và phát triển; đa phương hóa, đa dạng hóa quan hệ.","B":"Chỉ mở rộng quan hệ với các quốc gia có cùng trình độ phát triển.","C":"Ưu tiên quan hệ với một quốc gia và hạn chế quan hệ với các quốc gia khác.","D":"Tách biệt hoạt động đối ngoại với nhiệm vụ xây dựng và bảo vệ Tổ quốc."},"answer":"A"},{"id":244,"lesson":6,"lessonTitle":"Bài 6","lessonQ":18,"question":"Theo quan điểm chỉ đạo của Đảng, hội nhập kinh tế quốc tế có vị trí như thế nào trong hội nhập quốc tế?","options":{"A":"Là lĩnh vực không liên quan đến các lĩnh vực hội nhập khác.","B":"Là lĩnh vực chỉ được thực hiện sau khi hoàn thành hội nhập chính trị.","C":"Là lĩnh vực có thể thay thế hoàn toàn các lĩnh vực hội nhập khác.","D":"Là trọng tâm; hội nhập trong các lĩnh vực khác phải tạo thuận lợi cho hội nhập kinh tế."},"answer":"D"},{"id":245,"lesson":6,"lessonTitle":"Bài 6","lessonQ":19,"question":"Hội nhập quốc tế của Việt Nam là quá trình như thế nào?","options":{"A":"Chỉ hợp tác, không có đấu tranh để bảo vệ lợi ích quốc gia.","B":"Vừa hợp tác, vừa đấu tranh; kiên định lợi ích quốc gia, dân tộc.","C":"Chỉ tập trung vào lợi ích kinh tế trước mắt.","D":"Tham gia các liên minh của bên này để chống bên kia."},"answer":"B"},{"id":246,"lesson":6,"lessonTitle":"Bài 6","lessonQ":20,"question":"Nội dung nào sau đây thể hiện đúng nhiệm vụ đối ngoại của Việt Nam trong quan hệ với các nước ASEAN?","options":{"A":"Hạn chế hợp tác để tránh phụ thuộc vào khu vực.","B":"Chỉ tập trung phát triển quan hệ song phương, không tham gia hợp tác khu vực.","C":"Chủ động, tích cực và có trách nhiệm cùng các nước ASEAN xây dựng Cộng đồng vững mạnh.","D":"Ưu tiên cạnh tranh, hạn chế liên kết kinh tế giữa các nước thành viên."},"answer":"C"},{"id":247,"lesson":7,"lessonTitle":"Bài 7","lessonQ":1,"question":"Dấu hiệu nào phân biệt xây dựng Nhà nước pháp quyền với việc chỉ gia tăng số lượng văn bản?","options":{"A":"Tổ chức, hoạt động theo Hiến pháp, pháp luật và bảo đảm thực thi.","B":"Thường xuyên tăng số thủ tục để kiểm soát hoạt động xã hội.","C":"Có nhiều cơ quan cùng tham gia ban hành quy định quản lý.","D":"Dùng mệnh lệnh hành chính làm căn cứ thay tính hợp hiến."},"answer":"A"},{"id":248,"lesson":7,"lessonTitle":"Bài 7","lessonQ":2,"question":"Theo nội dung giáo trình, quyền lực nhà nước ở Việt Nam được tổ chức theo nguyên tắc nào?","options":{"A":"Thống nhất, có phân công, phối hợp và kiểm soát giữa các cơ quan.","B":"Phân chia theo địa phương mà không cần cơ chế thống nhất.","C":"Tập trung vào một cơ quan trực tiếp thực hiện mọi quyền.","D":"Chia thành các quyền độc lập không có quan hệ phối hợp."},"answer":"A"},{"id":249,"lesson":7,"lessonTitle":"Bài 7","lessonQ":3,"question":"Hai người có cùng điều kiện và hồ sơ nhưng được xử lý khác nhau chỉ vì quan hệ quen biết. Yêu cầu nào bị vi phạm trực tiếp?","options":{"A":"Bình đẳng trước pháp luật.","B":"Bảo đảm tính liên tục của bộ máy.","C":"Phân cấp quản lý theo địa bàn.","D":"Phân công nhiệm vụ giữa các bộ phận."},"answer":"A"},{"id":250,"lesson":7,"lessonTitle":"Bài 7","lessonQ":4,"question":"Để pháp luật đi vào đời sống, sau khi ban hành cần chú trọng việc gì?","options":{"A":"Thay quy định bằng thỏa thuận cá nhân.","B":"Tổ chức thực hiện, kiểm tra và xử lý vi phạm.","C":"Chỉ lưu giữ văn bản tại cơ quan ban hành.","D":"Chỉ đếm số văn bản đã được ký."},"answer":"B"},{"id":251,"lesson":7,"lessonTitle":"Bài 7","lessonQ":5,"question":"Quan hệ giữa sự lãnh đạo của Đảng và quản lý của Nhà nước được hiểu thế nào theo giáo trình?","options":{"A":"Nhà nước quản lý bằng pháp luật nên không cần định hướng chính trị.","B":"Các tổ chức Đảng hoạt động ngoài giới hạn Hiến pháp và pháp luật.","C":"Đảng lãnh đạo bằng cách trực tiếp làm thay mọi cơ quan hành chính.","D":"Đảng lãnh đạo; Nhà nước thể chế hóa và quản lý bằng pháp luật."},"answer":"D"},{"id":252,"lesson":7,"lessonTitle":"Bài 7","lessonQ":6,"question":"Phòng, chống tham nhũng cần kết hợp những biện pháp nào?","options":{"A":"Phòng ngừa, giám sát và xử lý nghiêm vi phạm.","B":"Chỉ giáo dục đạo đức, không cần kiểm tra.","C":"Chỉ xử lý cá nhân, giữ nguyên cơ chế thiếu minh bạch.","D":"Chỉ khen thưởng, không yêu cầu giải trình."},"answer":"A"},{"id":253,"lesson":7,"lessonTitle":"Bài 7","lessonQ":7,"question":"Hai phòng cùng được giao giải quyết một việc nhưng không rõ ai chịu trách nhiệm cuối cùng, hồ sơ bị chuyển qua lại. Cải cách nào xử lý đúng nguyên nhân?","options":{"A":"Tăng số đầu mối kiểm tra mà giữ nguyên phân công hiện tại.","B":"Kéo dài thời hạn giải quyết để phù hợp cách phối hợp cũ.","C":"Phân định rõ chức năng, thẩm quyền và trách nhiệm từng bộ phận.","D":"Bổ sung giấy tờ để mỗi phòng có thêm căn cứ chuyển hồ sơ."},"answer":"C"},{"id":254,"lesson":7,"lessonTitle":"Bài 7","lessonQ":8,"question":"Mục tiêu của cải cách bộ máy nhà nước là gì?","options":{"A":"Giảm trách nhiệm cá nhân trong giải quyết công việc.","B":"Tinh gọn, hoạt động hiệu lực, hiệu quả, phục vụ nhân dân.","C":"Tăng số đầu mối để kéo dài quy trình xử lý.","D":"Tăng thủ tục để người dân khó tiếp cận dịch vụ."},"answer":"B"},{"id":255,"lesson":7,"lessonTitle":"Bài 7","lessonQ":9,"question":"Biện pháp nào tác động trực tiếp đến khả năng nhân dân giám sát hoạt động công quyền?","options":{"A":"Tập trung báo cáo nội bộ mà không tạo kênh phản hồi.","B":"Công bố thêm khẩu hiệu về trách nhiệm phục vụ tại trụ sở.","C":"Đánh giá cán bộ chỉ bằng nhận xét của người quản lý trực tiếp.","D":"Công khai thông tin theo quy định và tổ chức tiếp nhận, xử lý phản ánh."},"answer":"D"},{"id":256,"lesson":7,"lessonTitle":"Bài 7","lessonQ":10,"question":"Phát hiện hồ sơ xử lý có dấu hiệu không đúng quy định, sinh viên muốn bảo vệ quyền của mình. Hướng nào phù hợp nguyên tắc pháp quyền?","options":{"A":"Nhờ người quen can thiệp để bỏ qua quy trình giải quyết.","B":"Tự đặt biện pháp xử lý người thụ lý theo đánh giá cá nhân.","C":"Sử dụng cơ chế kiến nghị, khiếu nại đúng trình tự và căn cứ.","D":"Coi quyền giám sát là quyền quyết định thay cơ quan có thẩm quyền."},"answer":"C"},{"id":257,"lesson":7,"lessonTitle":"Bài 7","lessonQ":11,"question":"Theo Hiến pháp năm 2013, Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là nhà nước như thế nào?","options":{"A":"Nhà nước của Nhân dân, do Nhân dân, vì Nhân dân.","B":"Nhà nước do các tổ chức xã hội thành lập và điều hành.","C":"Nhà nước chỉ bảo vệ quyền lợi của giai cấp công nhân.","D":"Nhà nước hoạt động độc lập với sự tham gia của Nhân dân."},"answer":"A"},{"id":258,"lesson":7,"lessonTitle":"Bài 7","lessonQ":12,"question":"Theo Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011), nền tảng của quyền lực nhà nước thuộc về Nhân dân là liên minh nào?","options":{"A":"Giai cấp công nhân với đội ngũ doanh nhân.","B":"Giai cấp nông dân với đội ngũ doanh nhân.","C":"Giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức.","D":"Đội ngũ trí thức với các tổ chức xã hội."},"answer":"C"},{"id":259,"lesson":7,"lessonTitle":"Bài 7","lessonQ":13,"question":"Nhân dân thực hiện quyền lực nhà nước thông qua hình thức cơ bản nào?","options":{"A":"Tự mình trực tiếp điều hành mọi hoạt động của bộ máy nhà nước.","B":"Thông qua bầu cử để lập ra các cơ quan đại diện quyền lực của mình.","C":"Thông qua các doanh nghiệp để quyết định chính sách nhà nước.","D":"Chỉ thông qua các cơ quan hành chính nhà nước."},"answer":"B"},{"id":260,"lesson":7,"lessonTitle":"Bài 7","lessonQ":14,"question":"Điều 5 Hiến pháp năm 2013 quy định các dân tộc ở Việt Nam có quyền và nghĩa vụ như thế nào?","options":{"A":"Các dân tộc phải sử dụng tiếng Việt và không được giữ gìn tiếng nói riêng.","B":"Các dân tộc được quyền phát triển độc lập, không phụ thuộc vào quốc gia thống nhất.","C":"Các dân tộc chỉ bình đẳng trong lĩnh vực kinh tế.","D":"Các dân tộc bình đẳng, đoàn kết, tôn trọng, giúp nhau cùng phát triển."},"answer":"D"},{"id":261,"lesson":7,"lessonTitle":"Bài 7","lessonQ":15,"question":"Theo Điều 14 Hiến pháp năm 2013, quyền con người và quyền công dân được thực hiện như thế nào?","options":{"A":"Được công nhận, tôn trọng, bảo vệ, bảo đảm theo Hiến pháp và pháp luật.","B":"Chỉ được bảo đảm khi phù hợp với yêu cầu của cơ quan hành chính.","C":"Chỉ bao gồm các quyền về chính trị và dân sự.","D":"Do từng địa phương tự quy định và thực hiện."},"answer":"A"},{"id":262,"lesson":7,"lessonTitle":"Bài 7","lessonQ":16,"question":"Đặc trưng nào sau đây thể hiện nguyên tắc tổ chức và hoạt động của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam?","options":{"A":"Các cơ quan nhà nước được tự quyết định việc áp dụng pháp luật.","B":"Hoạt động quản lý xã hội chủ yếu dựa vào tập quán, không cần pháp luật.","C":"Nhà nước được tổ chức và hoạt động trên cơ sở Hiến pháp, pháp luật.","D":"Hiến pháp và pháp luật chỉ áp dụng đối với công dân."},"answer":"C"},{"id":263,"lesson":7,"lessonTitle":"Bài 7","lessonQ":17,"question":"Theo Hiến pháp năm 2013, quyền lực nhà nước ở Việt Nam được tổ chức như thế nào?","options":{"A":"Quyền lập pháp giữ vị trí cao nhất và độc lập hoàn toàn với các quyền khác.","B":"Quyền lực nhà nước thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan trong việc thực hiện quyền lập pháp, hành pháp, tư pháp.","C":"Quyền hành pháp quyết định toàn bộ hoạt động của các cơ quan nhà nước.","D":"Ba quyền lập pháp, hành pháp, tư pháp hoạt động hoàn toàn tách biệt, không phối hợp."},"answer":"B"},{"id":264,"lesson":7,"lessonTitle":"Bài 7","lessonQ":18,"question":"Nội dung nào sau đây thể hiện đúng vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với Nhà nước?","options":{"A":"Đảng trực tiếp thay thế Nhà nước thực hiện mọi hoạt động quản lý hành chính.","B":"Đảng hoạt động ngoài khuôn khổ Hiến pháp và pháp luật.","C":"Đảng không tham gia định hướng xây dựng chính sách phát triển đất nước.","D":"Đảng đề ra đường lối, chủ trương và lãnh đạo Nhà nước thể chế hóa thành Hiến pháp, pháp luật, chính sách cụ thể."},"answer":"D"},{"id":265,"lesson":7,"lessonTitle":"Bài 7","lessonQ":19,"question":"Một trong những nhiệm vụ quan trọng trong xây dựng và hoàn thiện Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là gì?","options":{"A":"Hoàn thiện thể chế, chức năng, nhiệm vụ và cơ chế vận hành, nâng cao hiệu lực, hiệu quả của Nhà nước.","B":"Hạn chế hoạt động giám sát của Nhân dân đối với cơ quan nhà nước.","C":"Giảm trách nhiệm giải trình của các cơ quan hành chính.","D":"Tách việc hoàn thiện pháp luật khỏi tổ chức thi hành pháp luật."},"answer":"A"},{"id":266,"lesson":7,"lessonTitle":"Bài 7","lessonQ":20,"question":"Biện pháp nào sau đây góp phần đẩy mạnh phòng, chống tham nhũng, lãng phí trong bộ máy nhà nước?","options":{"A":"Giảm hoạt động thanh tra, kiểm tra và giám sát.","B":"Chỉ xử lý người trực tiếp thực hiện hành vi tham nhũng, không xem xét trách nhiệm người đứng đầu.","C":"Tăng cường kiểm tra, giám sát, thanh tra, kiểm toán và xử lý nghiêm hành vi tham nhũng, lãng phí.","D":"Hạn chế vai trò giám sát của Mặt trận Tổ quốc và Nhân dân."},"answer":"C"},{"id":267,"lesson":8,"lessonTitle":"Bài 8","lessonQ":1,"question":"Đại đoàn kết toàn dân tộc được xác định ở vị trí nào trong xây dựng, bảo vệ Tổ quốc?","options":{"A":"Hoạt động vận động riêng của các hội tự nguyện.","B":"Biện pháp huy động tạm thời khi phát sinh thiên tai.","C":"Chính sách chỉ áp dụng ở địa bàn nhiều tôn giáo.","D":"Đường lối chiến lược, động lực và nguồn lực to lớn."},"answer":"D"},{"id":268,"lesson":8,"lessonTitle":"Bài 8","lessonQ":2,"question":"Phân biệt nào đúng giữa nền tảng và lực lượng của khối đại đoàn kết?","options":{"A":"Nền tảng gồm mọi thành phần; lực lượng chỉ gồm công nhân và nông dân.","B":"Nền tảng là các doanh nghiệp; lực lượng là người hưởng lương trong doanh nghiệp.","C":"Nền tảng là liên minh công nhân, nông dân, trí thức; lực lượng là cộng đồng dân tộc rộng rãi.","D":"Nền tảng và lực lượng đều giới hạn ở thành viên các cơ quan nhà nước."},"answer":"C"},{"id":269,"lesson":8,"lessonTitle":"Bài 8","lessonQ":3,"question":"Khu dân cư gồm nhiều tín ngưỡng cùng xây dựng môi trường sống. Cơ sở tập hợp phù hợp nhất là gì?","options":{"A":"Yêu cầu cùng tín ngưỡng rồi mới phân công hoạt động chung.","B":"Lợi ích chung chính đáng, tôn trọng khác biệt không trái lợi ích dân tộc.","C":"Phân bổ quyền tham gia theo mức đóng góp tài chính.","D":"Để từng nhóm tự giải quyết môi trường trong phạm vi riêng."},"answer":"B"},{"id":270,"lesson":8,"lessonTitle":"Bài 8","lessonQ":4,"question":"Cơ sở lợi ích nào giúp tăng cường khối đại đoàn kết toàn dân tộc?","options":{"A":"Giải quyết hài hòa lợi ích hợp pháp, chính đáng của các tầng lớp.","B":"Chỉ quan tâm nhóm đóng góp tài chính nhiều.","C":"Ưu tiên mọi yêu cầu riêng của nhóm đông người nhất.","D":"Đồng nhất lợi ích cá nhân với lợi ích dân tộc trong mọi việc."},"answer":"A"},{"id":271,"lesson":8,"lessonTitle":"Bài 8","lessonQ":5,"question":"Phạm vi khối đại đoàn kết theo giáo trình bao gồm đối tượng nào?","options":{"A":"Các tầng lớp trong nước và đồng bào Việt Nam ở nước ngoài.","B":"Các nhóm có cùng quan điểm về mọi vấn đề xã hội.","C":"Các thành viên có cùng nghề nghiệp và nguồn thu nhập.","D":"Người đang cư trú trong nước, không gồm kiều bào."},"answer":"A"},{"id":272,"lesson":8,"lessonTitle":"Bài 8","lessonQ":6,"question":"Chính sách dân tộc cần thể hiện nguyên tắc nào?","options":{"A":"Xóa bỏ toàn bộ bản sắc riêng của từng dân tộc.","B":"Chia tách các dân tộc thành những cộng đồng biệt lập.","C":"Ưu tiên quyền công dân theo quy mô dân số.","D":"Bình đẳng, đoàn kết, tôn trọng và giúp nhau cùng phát triển."},"answer":"D"},{"id":273,"lesson":8,"lessonTitle":"Bài 8","lessonQ":7,"question":"Mặt trận tổ chức lấy ý kiến về dự án ảnh hưởng dân cư rồi tổng hợp phản biện và theo dõi phản hồi. Vai trò nào được thể hiện?","options":{"A":"Thay cơ quan nhà nước phê duyệt mọi dự án đầu tư.","B":"Quản lý trực tiếp toàn bộ hoạt động kinh doanh của chủ đầu tư.","C":"Thực hiện chức năng xét xử tranh chấp phát sinh tại địa bàn.","D":"Đại diện, tập hợp, giám sát và phản biện xã hội."},"answer":"D"},{"id":274,"lesson":8,"lessonTitle":"Bài 8","lessonQ":8,"question":"Đối với đội ngũ trí thức, biện pháp nào được giáo trình nhấn mạnh để phát huy đóng góp?","options":{"A":"Giới hạn phản biện khoa học để bảo đảm hình thức nhất trí.","B":"Xác định giá trị đóng góp chủ yếu bằng số năm giữ chức vụ.","C":"Đồng nhất chế độ đãi ngộ mà không xét đặc điểm lao động sáng tạo.","D":"Trọng dụng theo năng lực, kết quả cống hiến và bảo vệ sở hữu trí tuệ."},"answer":"D"},{"id":275,"lesson":8,"lessonTitle":"Bài 8","lessonQ":9,"question":"Đoàn thể đông thành viên nhưng hoạt động ít gắn nhu cầu việc làm, học tập, đời sống nên mức tham gia thấp. Hướng đổi mới nào sát nguyên nhân?","options":{"A":"Coi số thành viên đăng ký là thước đo đủ về sức đoàn kết.","B":"Điều chỉnh nội dung và cách hoạt động theo nhu cầu chính đáng của thành viên.","C":"Tăng chỉ tiêu số cuộc họp trong khi giữ nguyên nội dung.","D":"Chuyển mọi hoạt động sang báo cáo hành chính theo định kỳ."},"answer":"B"},{"id":276,"lesson":8,"lessonTitle":"Bài 8","lessonQ":10,"question":"Trong làm việc nhóm, cách nào góp phần giữ đoàn kết khi có ý kiến khác nhau?","options":{"A":"Không cho thành viên nêu hạn chế của công việc.","B":"Chia nhóm theo quan hệ thân quen.","C":"Bỏ qua mọi ý kiến khác với người trưởng nhóm.","D":"Lắng nghe, trao đổi có căn cứ và tìm giải pháp chung."},"answer":"D"},{"id":277,"lesson":8,"lessonTitle":"Bài 8","lessonQ":11,"question":"Theo chủ nghĩa Mác – Lênin, đại đoàn kết dân tộc là nội dung và nhiệm vụ chiến lược của cách mạng vì","options":{"A":"quần chúng nhân dân là người sáng tạo ra lịch sử.","B":"các giai cấp có lợi ích hoàn toàn giống nhau.","C":"sự phát triển kinh tế quyết định mọi hoạt động xã hội.","D":"mỗi dân tộc cần phát triển độc lập với các dân tộc khác."},"answer":"A"},{"id":278,"lesson":8,"lessonTitle":"Bài 8","lessonQ":12,"question":"Theo tư tưởng Hồ Chí Minh, đại đoàn kết dân tộc có vai trò như thế nào đối với cách mạng Việt Nam?","options":{"A":"Là nhiệm vụ chỉ thực hiện trong thời kỳ đấu tranh giành độc lập.","B":"Là chiến lược cơ bản, lâu dài, nguồn sức mạnh và động lực chủ yếu của cách mạng.","C":"Là hoạt động riêng của Mặt trận Tổ quốc Việt Nam.","D":"Là nhiệm vụ chỉ đặt ra đối với giai cấp công nhân."},"answer":"B"},{"id":279,"lesson":8,"lessonTitle":"Bài 8","lessonQ":13,"question":"Theo tư tưởng Hồ Chí Minh, hình thức tổ chức để tập hợp, đoàn kết các giai cấp, tầng lớp, dân tộc, tôn giáo và những người yêu nước là","options":{"A":"các tổ chức kinh tế tư nhân.","B":"các cơ quan quản lý nhà nước.","C":"Mặt trận dân tộc thống nhất.","D":"các tổ chức nghề nghiệp độc lập."},"answer":"C"},{"id":280,"lesson":8,"lessonTitle":"Bài 8","lessonQ":14,"question":"Một trong những nguyên tắc cơ bản để thực hiện đại đoàn kết toàn dân tộc theo tư tưởng Hồ Chí Minh là","options":{"A":"đặt lợi ích cá nhân lên trên lợi ích chung.","B":"chỉ tập hợp những người có cùng quan điểm.","C":"ưu tiên lợi ích của một giai cấp nhất định.","D":"bảo đảm lợi ích tối cao của dân tộc và quyền lợi cơ bản của nhân dân."},"answer":"D"},{"id":281,"lesson":8,"lessonTitle":"Bài 8","lessonQ":15,"question":"Cơ sở quan trọng để xây dựng khối đại đoàn kết toàn dân tộc ở Việt Nam là","options":{"A":"sự thống nhất về lợi ích căn bản giữa các dân tộc, giai cấp và tầng lớp trong xã hội.","B":"sự đồng nhất hoàn toàn về phong tục, tập quán của các dân tộc.","C":"sự khác biệt về điều kiện phát triển giữa các vùng miền.","D":"việc hạn chế sự tham gia của các tổ chức xã hội."},"answer":"A"},{"id":282,"lesson":8,"lessonTitle":"Bài 8","lessonQ":16,"question":"Theo quan điểm của Đảng, nền tảng của khối đại đoàn kết toàn dân tộc là liên minh giữa","options":{"A":"giai cấp công nhân với đội ngũ doanh nhân và thanh niên.","B":"giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức.","C":"giai cấp nông dân với đội ngũ doanh nhân và người cao tuổi.","D":"đội ngũ trí thức với phụ nữ và cựu chiến binh."},"answer":"B"},{"id":283,"lesson":8,"lessonTitle":"Bài 8","lessonQ":17,"question":"Một trong những mục tiêu chung để tập hợp, đoàn kết toàn dân tộc trong xây dựng và bảo vệ Tổ quốc là","options":{"A":"xóa bỏ mọi khác biệt về văn hóa giữa các dân tộc.","B":"chỉ tập trung phát triển kinh tế, không quan tâm đến xã hội.","C":"xây dựng nước Việt Nam hòa bình, độc lập, thống nhất, toàn vẹn lãnh thổ, dân giàu, nước mạnh, dân chủ, công bằng, văn minh.","D":"ưu tiên quyền lợi của một bộ phận dân cư trong xã hội."},"answer":"C"},{"id":284,"lesson":8,"lessonTitle":"Bài 8","lessonQ":18,"question":"Để phát huy sức mạnh của đội ngũ trí thức, Đảng và Nhà nước cần thực hiện giải pháp nào sau đây?","options":{"A":"Hạn chế quyền tự do tư tưởng trong hoạt động nghiên cứu khoa học.","B":"Chỉ sử dụng trí thức trong lĩnh vực giáo dục.","C":"Không cần bảo vệ quyền sở hữu trí tuệ của trí thức.","D":"Trọng dụng trí thức dựa trên phẩm chất, năng lực và kết quả cống hiến."},"answer":"D"},{"id":285,"lesson":8,"lessonTitle":"Bài 8","lessonQ":19,"question":"Trong việc phát huy sức mạnh đại đoàn kết toàn dân tộc, Mặt trận Tổ quốc Việt Nam giữ vai trò nào sau đây?","options":{"A":"Nòng cốt trong tập hợp, vận động nhân dân, phát huy đoàn kết và đồng thuận xã hội.","B":"Thay thế toàn bộ chức năng quản lý nhà nước.","C":"Chỉ thực hiện các hoạt động từ thiện, không tham gia giám sát xã hội.","D":"Chỉ tập hợp các tổ chức tôn giáo trong nước."},"answer":"A"},{"id":286,"lesson":8,"lessonTitle":"Bài 8","lessonQ":20,"question":"Hành vi lợi dụng vấn đề dân tộc, tín ngưỡng, tôn giáo để kích động chia rẽ các tầng lớp nhân dân đi ngược lại với yêu cầu nào sau đây?","options":{"A":"Phát huy bản sắc văn hóa của từng dân tộc.","B":"Củng cố và phát huy sức mạnh đại đoàn kết toàn dân tộc.","C":"Tạo điều kiện để các dân tộc cùng phát triển.","D":"Bảo đảm quyền tự do tín ngưỡng, tôn giáo theo quy định của pháp luật."},"answer":"B"},{"id":287,"lesson":9,"lessonTitle":"Bài 9","lessonQ":1,"question":"Quan hệ giữa người công dân tốt và người lao động tốt được giáo trình xác định thế nào?","options":{"A":"Người lao động tốt là công dân tốt có năng lực thực hiện tốt hoạt động lao động.","B":"Người công dân tốt được xác định chủ yếu bằng mức thu nhập lao động.","C":"Người lao động tốt chỉ cần giỏi nghề, còn nghĩa vụ công dân là tiêu chí riêng.","D":"Hai khái niệm áp dụng cho hai nhóm người loại trừ nhau về địa vị."},"answer":"A"},{"id":288,"lesson":9,"lessonTitle":"Bài 9","lessonQ":2,"question":"Sinh viên vận hành máy thành thạo nhưng thường không phối hợp bàn giao khiến cả dây chuyền chậm. Mặt cần rèn luyện trực tiếp nhất là gì?","options":{"A":"Nhu cầu chuyển sang ngành học có ít thiết bị sản xuất hơn.","B":"Tinh thần trách nhiệm và hợp tác trong quan hệ với tập thể.","C":"Khả năng thao tác kỹ thuật đã được xác nhận là thành thạo.","D":"Mức tích lũy chứng chỉ thay cho kết quả thực hiện công việc."},"answer":"B"},{"id":289,"lesson":9,"lessonTitle":"Bài 9","lessonQ":3,"question":"Sinh viên thực tập phát hiện sản phẩm có lỗi trước khi giao. Cách xử lý nào đúng đạo đức nghề nghiệp?","options":{"A":"Chờ khách hàng phản ánh rồi mới xem xét.","B":"Giấu lỗi để giữ thành tích cá nhân.","C":"Báo cáo trung thực, phối hợp khắc phục lỗi.","D":"Đổ lỗi cho người không liên quan."},"answer":"C"},{"id":290,"lesson":9,"lessonTitle":"Bài 9","lessonQ":4,"question":"Sau tốt nghiệp, công nghệ thay đổi làm kỹ năng đã học chưa đáp ứng công việc. Định hướng rèn luyện phù hợp là gì?","options":{"A":"Tích lũy thêm văn bằng cùng nội dung mà không cần thực hành mới.","B":"Tự học và cập nhật chuyên môn, kỹ năng công nghệ, ngoại ngữ theo công việc.","C":"Ưu tiên thâm niên làm việc thay việc kiểm tra năng lực hiện tại.","D":"Chỉ dựa vào kinh nghiệm thao tác cũ đến khi được bố trí việc khác."},"answer":"B"},{"id":291,"lesson":9,"lessonTitle":"Bài 9","lessonQ":5,"question":"Người lao động tốt cần rèn luyện những mặt nào?","options":{"A":"Đạo đức, chuyên môn, sức khỏe và trách nhiệm.","B":"Chỉ chuyên môn vì tay nghề thay được đạo đức.","C":"Chỉ sức khỏe vì máy móc quyết định mọi kết quả.","D":"Chỉ bằng cấp vì có bằng là đáp ứng mọi công việc."},"answer":"A"},{"id":292,"lesson":9,"lessonTitle":"Bài 9","lessonQ":6,"question":"Người công dân tốt là người","options":{"A":"chỉ thực hiện quyền lợi của bản thân, không cần quan tâm đến nghĩa vụ.","B":"thực hiện tốt quyền và nghĩa vụ cơ bản của công dân theo quy định của Hiến pháp và pháp luật.","C":"chỉ tham gia các hoạt động xã hội khi được yêu cầu.","D":"ưu tiên lợi ích cá nhân hơn lợi ích của cộng đồng."},"answer":"B"},{"id":293,"lesson":9,"lessonTitle":"Bài 9","lessonQ":7,"question":"Một trong những nội dung tu dưỡng, rèn luyện để trở thành người công dân tốt, người lao động tốt là","options":{"A":"phát huy truyền thống yêu nước, trung thành với sự nghiệp cách mạng của nhân dân Việt Nam.","B":"chỉ chú trọng nâng cao thu nhập cá nhân.","C":"đề cao lợi ích cá nhân trong mọi hoạt động.","D":"hạn chế tham gia các hoạt động tập thể."},"answer":"A"},{"id":294,"lesson":9,"lessonTitle":"Bài 9","lessonQ":8,"question":"Biểu hiện nào sau đây thể hiện người lao động tốt?","options":{"A":"Làm việc tùy tiện, không tuân thủ nội quy của cơ quan.","B":"Chỉ quan tâm đến tiền lương, không chú trọng chất lượng công việc.","C":"Có ý thức kỷ luật, không ngừng nâng cao trình độ chuyên môn và hoàn thành tốt nhiệm vụ.","D":"Né tránh trách nhiệm khi xảy ra sai sót trong công việc."},"answer":"C"},{"id":295,"lesson":9,"lessonTitle":"Bài 9","lessonQ":9,"question":"Một sinh viên cao đẳng chủ động học tập, rèn luyện kỹ năng nghề nghiệp, chấp hành nội quy nhà trường và tích cực tham gia hoạt động cộng đồng. Những việc làm này thể hiện điều gì?","options":{"A":"Chỉ nhằm đáp ứng yêu cầu trước mắt của việc học tập.","B":"Chỉ thể hiện trách nhiệm của người học đối với nhà trường.","C":"Không liên quan đến việc tu dưỡng, rèn luyện phẩm chất cá nhân.","D":"Góp phần nâng cao năng lực, rèn luyện phẩm chất và chuẩn bị trở thành người công dân tốt, người lao động tốt."},"answer":"D"},{"id":296,"lesson":9,"lessonTitle":"Bài 9","lessonQ":10,"question":"Để trở thành người công dân tốt, người lao động tốt, mỗi sinh viên cần lựa chọn cách ứng xử nào sau đây?","options":{"A":"Chỉ học tập khi có kiểm tra, đánh giá.","B":"Chủ động học tập, tu dưỡng đạo đức, chấp hành pháp luật và có trách nhiệm với công việc, cộng đồng.","C":"Đặt lợi ích cá nhân lên trên lợi ích tập thể trong mọi trường hợp.","D":"Chỉ rèn luyện chuyên môn, không cần quan tâm đến đạo đức và lối sống."},"answer":"B"}];
