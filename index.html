 dịch điện tử được coi là:","options":{"A":"Mua bán online","B":"Giao dịch bằng văn bản","C":"Giao dịch mang xã hội","D":"Không công nhận"},"answer":"B"},{"id":283,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":98,"question":"Sự kiện nào sau đây chấm dứt quyền sở hữu","options":{"A":"Đánh rơi tài sản","B":"Bỏ quên tài sản","C":"Tài sản bị xử lý để thực hiện nghĩa vụ cho người khác","D":"Tài sản bị tịch thu"},"answer":"D"},{"id":284,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":99,"question":"Hợp đồng nào sau đây là hợp đồng mẫu","options":{"A":"Hợp đồng mua bán điện nước","B":"Hợp đồng chuyển nhượng quyền sử dụng đất","C":"Hợp đồng mua bán xe ô tô","D":"Hợp đồng ủy quyền"},"answer":"A"},{"id":285,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":100,"question":"Giao dịch dân sự vô hiệu khi :","options":{"A":"Chủ thể có năng lực pháp luật dân sự, năng lực hành vi dân sự phù hợp với giao dịch dân sự được xác lập","B":"Chủ thể tham gia giao dịch dân sự hoàn toàn tự nguyện","C":"Giao dịch dân sự được thể hiện bằng lời nói, bằng văn bản hoặc bằng hành vi cụ thể","D":"Giao dịch dân sự có mục đích, nội dung vi phạm điều cấm của luật, trái đạo đức xã hội"},"answer":"D"},{"id":286,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":101,"question":"Điều 117 bộ Luật dân sự 2015 quy định về điều gì?","options":{"A":"Trách nhiệm do vi phạm hợp đồng","B":"Điều kiện có hiệu lực của giao dịch dân sự","C":"Quyền định đoạt","D":"Quyền đối với bất động sản liền kề"},"answer":"B"},{"id":287,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":102,"question":"Đối tượng điều chỉnh của Luật dân sự 2015 là:","options":{"A":"Quan hệ sở hữu và quan hệ nhân thân","B":"Quan hệ tài sản và quan hệ nhân thân","C":"Nhóm quan hệ thừa kế và quan hệ thân nhân","D":"Những nhóm quan hệ tài sản và quan hệ nhân thân"},"answer":"B"},{"id":288,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":103,"question":"Điều 127 Giao dịch dân sự vô hiệu do bị lừa dối, đe dọa, cưỡng ép: Khi một bên tham gia giao dịch dân sự do bị lừa dối hoặc bị đe dọa, cưỡng ép thì có quyền yêu cầu Tòa án tuyên bố giao dịch dân sự đó là:","options":{"A":"Không có hiệu lực","B":"Giả dối","C":"Vô hiệu","D":"Vô căn cứ"},"answer":"C"},{"id":289,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":104,"question":"Việc hạn chế quyền dân sự được quy định như thế nào trong bộ luật Dân sự 2015","options":{"A":"Quyền dân sự không bị hạn chế trong mọi trường hợp","B":"Quyền dân sự có thể bị hạn chế theo quy định của luật trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe của cộng đồng","C":"Quyền dân sự có thể bị hạn chế theo quy định tại Nghị định của Chính phủ","D":"Quyền dân sự có thể bị hạn chế trong một số trường hợp"},"answer":"B"},{"id":290,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":105,"question":"Bộ luật Dân sự 2015 quy định như thế nào về giới hạn việc thực hiện quyền dân sự?","options":{"A":"Cá nhân, pháp nhân được lạm dụng quyền dân sự của mình để vi phạm nghĩa vụ của mình","B":"Cá nhân, pháp nhân không được lạm dụng quyền dân sự của mình gây thiệt hại cho người khác, để vi phạm nghĩa vụ của mình hoặc thực hiện mục đích khác trái pháp luật","C":"Bộ luật Dân sự không có quy định về giới hạn việc thực hiện quyền dân sự","D":"Cá nhân, pháp nhân được thực hiện quyền dân sự theo ý chí của mình"},"answer":"B"},{"id":291,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":106,"question":"Việc tự bảo vệ quyền dân sự được quy định như thế nào trong bộ luật Dân sự năm 2015?","options":{"A":"Việc tự bảo vệ quyền dân sự phải phù hợp với tính chất, mức độ xâm phạm đến quyền dân sự đó và không được trái với các nguyên tắc cơ bản của pháp luật dân sự","B":"Việc tự bảo vệ quyền dân sự của cá nhân, pháp nhân có thể trái với các nguyên tắc cơ bản của pháp luật dân sự","C":"Cá nhân, pháp nhân không được tự bảo vệ quyền dân sự","D":"Cá nhân, pháp nhân có quyền được bồi thường thiệt hại"},"answer":"A"},{"id":292,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":107,"question":"Bộ luật Dân sự năm 2015 quy định về bồi thường thiệt hại khi quyền dân sự bị xâm phạm","options":{"A":"Cá nhân, pháp nhân có quyền dân sự bị xâm phạm chỉ được bồi thường hai phần ba thiệt hại","B":"Cá nhân, pháp nhân có quyền dân sự bị xâm phạm chỉ được bồi thường một phần ba thiệt hại","C":"Cá nhân, pháp nhân có quyền dân sự bị xâm phạm được bồi thường toàn bộ thiệt hại","D":"Cá nhân, pháp nhân có quyền dân sự bị xâm phạm được bồi thường toàn bộ thiệt hại, trừ trường hợp các bên có thỏa thuận khác hoặc luật có quy định khác"},"answer":"D"},{"id":293,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":108,"question":"Theo Bộ luật Dân sự năm 2015, năng lực pháp luật dân sự của cá nhân là gì?","options":{"A":"Là khả năng của cá nhân có quyền dân sự","B":"Là khả năng của cá nhân có nghĩa vụ dân sự","C":"Là khả năng của cá nhân có quyền và nghĩa vụ dân sự","D":"Là khả năng của cá nhân xác lập quyền, nghĩa vụ dân sự"},"answer":"C"},{"id":294,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":109,"question":"Theo Bộ luật Dân sự năm 2015, năng lực hành vi dân sự của cá nhân là gì?","options":{"A":"Là khả năng của cá nhân bằng hành vi của mình xác lập, thực hiện quyền, nghĩa vụ dân sự","B":"Là khả năng của cá nhân thực hiện quyền, nghĩa vụ dân sự","C":"Là khả năng của cá nhân xác lập quyền, nghĩa vụ dân sự","D":"Là khả năng của cá nhân xác lập, thực hiện quyền, nghĩa vụ dân sự"},"answer":"A"},{"id":295,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":110,"question":"Bộ luật Dân sự năm 2015 quy định về mất năng lực hành vi dân sự","options":{"A":"Khi một người do bị bênh tâm thần hoặc mắc bệnh khác mà không thể nhận thức, làm chủ được hành vi thì theo yêu cầu của người có quyền, lợi ích liên quan hoặc của cơ quan, tổ chức hữu quan. Tòa án ra quyết định tuyên bố người này là người mất năng lực hành vi dân sự trên cơ sở kết luận giám định pháp y tâm thần","B":"Khi một người do bị bệnh tâm thần mà không thể nhận thức, làm chủ được hành vi thì bị coi là người mất năng lực hành vi dân sự","C":"Khi một người do bị mắc bệnh mà không thể nhận thức, làm chủ được hành vi thì bị coi là người mất năng lực hành vi dân sự","D":"Người nghiện ma túy, nghiện các chất kích thích khác dẫn đến không làm chủ được hành vi"},"answer":"A"},{"id":296,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":111,"question":"Bộ luật Dân sự năm 2015 quy định pháp nhân thương mại là gì?","options":{"A":"Pháp nhân thương mại là pháp nhân có mục tiêu chính là tìm kiếm lợi nhuận và lợi nhuận được chia cho các thành viên","B":"Pháp nhân thương mại là pháp nhân có mục tiêu chính là tìm kiếm lợi nhuận và lợi nhuận không chia cho các thành viên","C":"Pháp nhân thương mại là pháp nhân có mục tiêu chính là tìm kiếm lợi nhuận và hai phần ba lợi nhuận được chia cho các thành viên","D":"Là pháp nhân có mục tiêu chính là tìm kiếm lợi nhuận"},"answer":"A"},{"id":297,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":112,"question":"Theo Bộ luật Dân sự năm 2015 “tài sản” được hiểu như thế nào và bao gồm những gì?","options":{"A":"Tài sản là vật, tiền, giấy tờ có giá và quyền tài sản","B":"Tài sản là bất động sản","C":"Tài sản là vật, tiền, giấy tờ có giá và quyền tài sản bao gồm bất động sản và động sản. Bất động sản và động sản có thể là tài sản hiện có và tài sản hình thành trong tương lai","D":"Đất đai, nhà, công trình xây dựng"},"answer":"C"},{"id":298,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":113,"question":"Theo Bộ luật Dân sự năm 2015 giao dịch dân sự được hiểu như thế nào?","options":{"A":"Giao dịch dân sự là sự thỏa thuận giữa hai bên","B":"Giao dịch dân sự là hợp đồng hoặc hành vi pháp lý đơn phương làm phát sinh, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự","C":"Giao dịch dân sự là sự thỏa thuận giữa các bên trong quan hệ dân sự","D":"Giao dịch dân sự được thể hiện bằng lời nói, bằng văn bản hoặc bằng hành vi cụ thể"},"answer":"B"},{"id":299,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":114,"question":"Theo Bộ luật Dân sự năm 2015 hợp đồng dân sự được hiểu như thế nào?","options":{"A":"Hợp đồng dân sự là sự thỏa thuận giữa các bên về việc xác lập, thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự","B":"Hợp đồng dân sự là sự thỏa thuận giữa các bên về việc xác lập quyền, nghĩa vụ dân sự","C":"Hợp đồng dân sự là sự thỏa thuận giữa các bên về việc thay đổi hoặc chấm dứt quyền, nghĩa vụ dân sự","D":"Hợp đồng dân sự là sự thể hiện quyền và nghĩa vụ của các bên bằng văn bản"},"answer":"A"},{"id":300,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":115,"question":"Không bằng lòng với quyết định thu hồi đất để làm đường giao thông nông thôn, người dân xã X đã đồng loạt kéo nhau đến ủy ban nhân dân xã để phản đối gây mất an ninh trật tự. Trong trường hợp này, người dân xã X đã vận dụng sai quyền nào dưới đây của công dân?","options":{"A":"Thuyết phục.","B":"Đàm phán.","C":"Tố cáo.","D":"Khiếu nại."},"answer":"D"},{"id":301,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":116,"question":"Bộ luật Dân sự năm 2015 quy định pháp nhân phi thương mại là gì?","options":{"A":"Pháp nhân phi thương mại là pháp nhân có mục tiêu chính là tìm kiếm lợi nhuận","B":"Pháp nhân phi thương mại là pháp nhân không phân chia lợi nhuận cho các thành viên","C":"Pháp nhân phi thương mại là pháp nhân không có mục tiêu chính là tìm kiếm lợi nhuận; nếu có lợi nhuận thì cũng không được phân chia cho các thành viên","D":"Pháp nhân phi thương mại là pháp nhân được thành lập theo quy định của pháp luật"},"answer":"C"},{"id":302,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":117,"question":"Hình thức xử phạt chính trong xử phạt vi phạm hành chính bao gồm:","options":{"A":"Cảnh cáo","B":"Phạt tiền","C":"Cảnh cáo và phạt tiền","D":"Tước quyền sử dụng giấy phép và tịch thu tang vật"},"answer":"C"},{"id":303,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":118,"question":"Tính chất của phương pháp Mệnh lệnh – đơn phương trong ngành luật hành chính:","options":{"A":"Hoạt động quản lý, hoạt động chấp hành – điều hành mang bản chất là tính quyền uy","B":"Các bên tham gia quan hệ có địa vị không bình đẳng với nhau về ý chí: một bên đưa ra lệnh, bên kia phải phục tùng","C":"Bảo đảm sự bình đẳng, quyền tự định đoạt về mặt pháp lý giữa các chủ thể","D":"Truy cứu trách nhiệm tài sản của những người có hành vi gây thiệt hại cho người"},"answer":"B"},{"id":304,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":119,"question":"Theo NĐ 168/2024/NĐ -CP, Hành vi bấm còi, rú ga (nẹt pô) liên tục trong đô thị, khu đông dân cư sẽ bị phạt tiền theo mức nào sau đây:","options":{"A":"2000.000 đồng đến 4000.000 đồng","B":"2000.000 đồng đến 6000.000 đồng","C":"8000.000 đồng đến 10000.000 đồng","D":"4000.000 đồng đến 8000.000 đồng"},"answer":"C"},{"id":305,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":120,"question":"Theo Điều 7 NĐ 168/2024/NĐ -CP. Phạt tiền đối với người điều khiển xe mô tô, xe gắn máy ( kể cả xe máy điện ), các loại xe tương tự xe mô tô và các loại xe tương tự xe gắn máy trên đường mà trong máu hoặc hơi thở có nồng độ cồn nhưng chưa vượt quá 50 miligam/100 mililit máu hoặc chưa vượt quá 0,25 miligam/ 1 lít khí thở. Trừ 4 điểm giấy phép lái xe ngoài ra phạt tiền từ","options":{"A":"Từ 2.000.000 đồng đến 3.000.000 đồng","B":"Từ 2.000.000 đồng đến 4.000.000 đồng","C":"Từ 3.000.000 đồng đến 4.000.000 đồng","D":"Từ 3.000.000 đồng đến 5.000.000 đồng"},"answer":"A"},{"id":306,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":121,"question":"Theo Điều 7 NĐ 168/2024/NĐ -CP, phạt tiền đối với người điều khiển xe mô tô, xe gắn máy ( kể cả xe máy điện ), các loại xe tương tự xe mô tô và các loại xe tương tự xe gắn máy trên đường mà trong máu hoặc hơi thở có nồng độ cồn nhưng vượt quá 50 miligam đến 80 miligam/100 mililit máu hoặc vượt quá 0,25 miligam đến 0,4 miligam/ 1 lít khí thở. Trừ 10 điểm giấy phép lái xe , ngoài ra ph iều tình tiết giảm nhẹ","C":"Người được miễn hình phạt","D":"Người phạm tội ít nghiêm trọng và có nhiều tình tiết giảm nhẹ nhưng chưa đến mức miễn hình phạt"},"answer":"D"},{"id":317,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":132,"question":"Hình phạt nào không áp dụng đối với pháp nhân thương mại phạm tội","options":{"A":"Phạt tù","B":"Phạt tiền","C":"Đình chỉ hoạt động có thời hạn","D":"Đình chỉ hoạt động vĩnh viễn"},"answer":"A"},{"id":318,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":133,"question":"Hình phạt bổ sung đối với pháp nhân thương mại bao gồm:","options":{"A":"Cấm kinh doanh, cấm hoạt động trong một số lĩnh vực nhất định (1)","B":"Cấm huy động vốn (2)","C":"Phạt tiền khi không áp dụng là hình phạt chính (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":319,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":134,"question":"Tịch thu tài sản chỉ được áp dụng đối với người bị kết án về tội nào sau đây:","options":{"A":"Tội trộm cắp tài sản","B":"Tội phạm về tham nhũng","C":"Tội ít nghiêm trọng","D":"Người có tài sản"},"answer":"B"},{"id":320,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":135,"question":"Bộ luật Hình sự năm 2015 quy định người từ độ tuổi nào phải chiu trách nhiệm hình sự:","options":{"A":"Người từ đủ 14 tuổi trở lên","B":"Người từ đủ 15 tuổi trở lên","C":"Người từ đủ 17 tuổi trở lên","D":"Người từ đủ 18 tuổi trở lên"},"answer":"A"},{"id":321,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":136,"question":"Người từ đủ 14 tuổi đến dưới 16 phải chịu trách nhiệm hình sự về tội phạm rất nghiêm trọng, tội phạm đặc biệt nghiêm trọng thuộc các tội nào sau đây?","options":{"A":"Tội giết người, tội cố ý gây thương tích hoặc gây tổn hại sức khỏe của người khác","B":"Tội cướp tài sản, tội trộm cắp tài sản","C":"Tội vận chuyển trái phép chất ma túy, tội mua bán trái phép chất ma túy","D":"Tôi tổ chức đua xe trái phép"},"answer":"A"},{"id":322,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":137,"question":"Người từ đủ 14 tuổi đến dưới 16 tuổi phải chịu trách nhiệm về:","options":{"A":"Mọi tội phạm","B":"Một số tội phạm","C":"Tội phạm rất nghiêm trọng, tội phạm đặc biệt nghiêm trọng","D":"Tội phạm ít nghiêm trọng"},"answer":"C"},{"id":323,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":138,"question":"Trường hợp nào được đưa vào trường hợp loại trừ trách nhiệm hình sự","options":{"A":"Đồng phạm","B":"Che giấu tội phạm","C":"Không tố giác tội phạm","D":"Sự kiện bất ngờ"},"answer":"D"},{"id":324,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":139,"question":"Người từ đủ 14 tuổi đến dưới 16 tuổi chuẩn bị phạm tội nào thì phải chịu trách nhiệm hình sự?","options":{"A":"Tội giết người (1)","B":"Tội trộm cắp tài sản (2)","C":"Tội gây rối trật tự công cộng (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"A"},{"id":325,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":140,"question":"Người thực hiện hành vi gây hậu quả nguy hại cho xã hội trong trường hợp không thể thấy trước hoặc không buộc phải thấy trước hậu quả của hành vi đó gọi là:","options":{"A":"Sự kiện bất ngờ","B":"Miễn chịu trách nhiệm hình sự","C":"Phải chiu trách nhiệm hình sự một phần","D":"Phải chịu trách nhiệm hình sự toàn bộ"},"answer":"A"},{"id":326,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":141,"question":"Thời hiệu truy cứu trách nhiệm hình sự đối với tội phạm rất nghiêm trọng là:","options":{"A":"5 năm","B":"10 năm","C":"15 năm","D":"20 năm"},"answer":"C"},{"id":327,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":142,"question":"Người bị giữ trong trường hợp khẩn cấp, người bị bắt, bị tạm giữ, tạm giam, khởi tố, điều tra, truy tố, xét xử, thi hành án oan, trái pháp luật được đảm bảo quyền lợi như thế nào?","options":{"A":"Được bồi thường thiệt hại về vật chất (1)","B":"Được bồi thường thiệt hại về tinh thần (2)","C":"Được phục hồi danh dự (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":328,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":143,"question":"Trong các hình phạt sau, hình phạt nào không phải là hình phạt bổ sung?","options":{"A":"Cấm đảm nhiệm chức vụ, cấm hành nghề hoặc làm công việc nhất định","B":"Cấm cư trú","C":"Tịch thu tài sản","D":"Cải tạo không giam giữ"},"answer":"D"},{"id":329,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":144,"question":"Trong các hình phạt sau, hình phạt nào không phải là hình phạt chính?","options":{"A":"Phạt tiền","B":"Cải tạo không giam giữ","C":"Giáo dục tại xã, phường, thị trấn","D":"Tù có thời hạn"},"answer":"C"},{"id":330,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":145,"question":"Tình tiết nào sau đây không phải là tình tiết tăng nặng trách nhiệm hình sự?","options":{"A":"Phạm tội có tổ chức","B":"Phạm tội có tính chất côn đồ","C":"Cố tình thực hiện tội phạm đến cùng","D":"Người phạm tội tự thú"},"answer":"D"},{"id":331,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":146,"question":"Nhận định nào sau đây thể hiện đúng nội dung của quyền nhân thân?","options":{"A":"Quyền con người về dân sự gắn liền với mỗi cá nhân, không được chuyển giao cho người khác, trừ trường hợp pháp luật có quy định khác","B":"Quyền đối với họ tên, quyền thay đổi họ tên, quyền của cá nhân đối với hình ảnh, bí mật đời tư, tự do đi lại, cư trú","C":"Quyền thực hiện mọi hành vi theo ý chí của mình","D":"Quyền định đoạt đối với tài sản thuộc sở hữu của mình"},"answer":"A"},{"id":332,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":147,"question":"Nhà nước thực hiện chức năng của mình thông qua các hình thức hoạt động như thế nào?","options":{"A":"Chỉ thông qua hoạt động xây dựng và ban hành pháp luật (hoạt động lập pháp)","B":"Chỉ thông qua hoạt động tổ chức thực hiện pháp luật (hoạt động hành pháp).","C":"Chỉ thông qua hoạt động bảo vệ pháp luật (hoạt động tư pháp)","D":"Phải thông qua cả ba hình thức hoạt động lập pháp, hành pháp và tư pháp."},"answer":"D"},{"id":333,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":148,"question":"Cơ quan cấp Bộ có quyền ban hành văn bản quy phạm pháp luật nào sau đây?","options":{"A":"Luật Giáo dục","B":"Nghị định","C":"Thông tư","D":"Nghị quyết"},"answer":"C"},{"id":334,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":149,"question":"Nhận định nào đúng nhất về quyền sử dụng?","options":{"A":"Chủ sở hữu được thực hiện mọi hành vi để quản lý tài sản của mình","B":"Chủ sở hữu được sử dụng tài sản theo ý chí của mình","C":"Quyền khai thác công dụng, hưởng hoa lợi, lợi tức từ tài sản","D":"Thực hiện quyền sử dụng phù hợp với quy định của pháp luật đối với tài sản"},"answer":"C"},{"id":335,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":150,"question":"Nhận định nào sau đây là đúng?","options":{"A":"Cứ 18 tuổi là người thành niên","B":"Tất cả những người thành niên đều có năng lực hành vi dân sự đầy đủ","C":"Người thành niên là người đủ 18 tuổi trở lên","D":"Những người trong độ tuổi thanh niên"},"answer":"C"},{"id":336,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":151,"question":"Hãy chỉ ra nhận định sai?","options":{"A":"Con sinh ra mặc nhiên phải theo họ cha. Chỉ được theo họ mẹ khi chưa xác định được cha đẻ của đứa bé.","B":"Việc thay đổi tên cho người từ đủ chín tuổi trở lên phải có sự đồng ý của người đó.","C":"Cá nhân có quyền có họ, tên ( bao gồm cả chữ đệm, nếu có). Họ, tên của một người được xác định theo họ, tên khai sinh của người đó","D":"Cá nhân có quyền có quốc tịch"},"answer":"A"},{"id":337,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":152,"question":"Nhận định nào sau đây là đúng với quyền chiếm hữu?","options":{"A":"Chủ sở hữu được thực hiện mọi hành vi để quản lý tài sản của mình","B":"Chủ sở hữu được sử dụng tài sản theo ý chí của mình","C":"Chủ sở hữu được thực hiện mọi hành vi theo ý chí của mình để nắm giữ, chi phối tài sản của mình nhưng không được trái pháp luật, đạo đức xã hội","D":"Quyền định đoạt là quyền chuyển giao quyền sở hữu tài sản, từ bỏ quyền sở hữu, tiêu dùng hoặc tiêu hủy tài sản"},"answer":"C"},{"id":338,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":153,"question":"Giao dịch dân sự có nội dung không rõ ràng, khó hiểu, được hiểu theo nhiều nghĩa khác nhau thì việc giải thích giao dịch dân sự đó có thể được thực hiện theo:","options":{"A":"Theo ý chí của hai bên","B":"Theo ý chí của một bên","C":"Theo của một bên thứ ba do hai bên ấn định","D":"Theo ý chí đích thực của các bên khi xác lập giao dịch"},"answer":"D"},{"id":339,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":154,"question":"Thời hiệu khởi kiện để yêu cầu Tòa án giải quyết tranh chấp hợp đồng là … , kể từ ngày người có quyền yêu cầu biết hoặc phải biết quyền và lợi ích hợp pháp của mình bị xâm phạm","options":{"A":"12 tháng","B":"2 năm","C":"3 năm","D":"4 năm"},"answer":"C"},{"id":340,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":155,"question":"Vợ chồng đã ly hôn muốn xác lập lại quan hệ vợ chồng thì:","options":{"A":"Phải đăng ký kết hôn","B":"Không cần đăng ký","C":"Mời họ hàng hai bên là đủ","D":"Không đăng ký nhưng phải báo cho Ủy ban nhân đân nơi cư trú"},"answer":"A"},{"id":341,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":156,"question":"Người phát hiện tài sản do người khác đánh rơi, bỏ quên mà không biết địa chỉ của người đánh rơi, bỏ quên thì phải thông báo hoặc giao nộp cho cơ quan nào dưới đây để thông báo công khai cho chủ sở hữu biết mà nhận lại?","options":{"A":"Ủy ban nhân dân cấp xã hoặc công an cấp xã nơi gần nhất","B":"Ủy ban Mặt trận tổ quốc nơi gần nhất","C":"Viện Kiểm sát nhân dân thành phố","D":"Sở Tài nguyên môi trường"},"answer":"A"},{"id":342,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":157,"question":"Xác định tài sản nào là tài sản riêng của vợ, chồng","options":{"A":"Tài sản có được trong thời kỳ hôn nhân","B":"Tài sản được cho riêng trong thời kỳ hôn nhân","C":"Trúng số khi đang làm thủ tục ly hôn","D":"Tài sản có trước và trong thời kỳ hôn nhân đều là của chung"},"answer":"B"},{"id":343,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":158,"question":"Điều kiện có hiệu lực của hợp đồng dân sự","options":{"A":"Chủ thể có năng lực pháp luật dân sự, năng lực hành vi dân sự phù hợp với giao dịch dân sự được xác lập (1)","B":"Chủ thể tham gia giao dịch hoàn toàn tự nguyện (2)","C":"Mục đích và nội dung của giao dịch dân sự không vi phạm điều cấm của luật, không trái đạo đức xã hội. (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":344,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":159,"question":"Biểu hiện của bình đẳng trong hôn nhân là:","options":{"A":"Người chồng phải giữ vai trò chính trong đóng góp về kinh tế và quyết định công việc lớn trong gia đình (1)","B":"Công việc của người vợ là nội trợ gia đình và chăm sóc con cái, quyết định các khoản chi tiêu hàng ngày của gia đình (2)","C":"Vợ chồng cùng bàn bạc, tôn trọng ý kiến của nhau trong việc quyết định các công việc của gia đình (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"C"},{"id":345,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":160,"question":"Khi yêu cầu người vợ phải nghỉ việc để chăm sóc gia đình, người chồng đã vi phạm quyền bình đẳng giữa vợ và chồng trong quan hệ:","options":{"A":"Nhân thân","B":"Tài sản chung","C":"Tài sản riêng","D":"Tình cảm"},"answer":"A"},{"id":346,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":161,"question":"Vợ, chồng có quyền ngang nhau đối với tài sản chung là:","options":{"A":"Những tài sản hai người có được sau khi kết hôn","B":"Những tài sản có trong gia đình","C":"Những tài sản hai người có được trước khi kết hôn","D":"Những tài sản hai người có được sau khi kết hôn và tài sản được cho riêng sau khi kết hôn"},"answer":"A"},{"id":347,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":162,"question":"Vi phạm dân sự là hành vi vi phạm pháp luật, xâm phạm tới:","options":{"A":"Các quy tắc quản lý nhà nước (1)","B":"Các quan hệ tài sản và quan hệ nhân thân (2)","C":"Các quan hệ lao động, công vụ nhà nước (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"B"},{"id":348,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":163,"question":"Tòa án buộc người gây thiệt hại do tính mạng bị xâm phạm phải bồi thường những gì cho người bị hại?","options":{"A":"Bồi thường về mặt tinh thần cho người bị hại","B":"Bồi thường về mặt tài chính","C":"Bồi thường một khoản tiền bù đắp tinh thần cho những người thân của người bị thiệt hại theo quy định của pháp luật","D":"Bồi thường một khoản tiền bù đắp tinh thần cho người bị thiệt hại"},"answer":"C"},{"id":349,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":164,"question":"Vi phạm hành chính là hành vi có lỗi do …… thực hiện, vi phạm quy định của pháp luật về quản lý nhà nước mà không phải là tội phạm và theo quy định của pháp luật phải bị xử phạt vi phạm hành chính","options":{"A":"cá nhân","B":"tổ chức","C":"cá nhân, tổ chức","D":"hành vi vi phạm"},"answer":"C"},{"id":350,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":165,"question":"Vi phạm hành chính có các dấu hiệu sau:","options":{"A":"Trái pháp luật hành chính","B":"Là hành vi trái pháp luật hành chính ít nguy hiểm cho xã hội hơn so với tội phạm, xâm phạm đến trật tự quản lý nhà nước, có lỗi do người có năng lực trách nhiệm hành chính thực hiện và phải bị xử phạt hành chính","C":"Phải bị xử phạt hành chính","D":"Hành vi có lỗi"},"answer":"B"},{"id":351,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":166,"question":"Pháp luật hành chính điều chỉnh:","options":{"A":"Các mối quan hệ phát sinh trong cơ quan nhà nước","B":"Các mối quan hệ phát sinh trong hoạt động quản lý hành chính nhà nước","C":"Các quan hệ quản lý phát sinh trên mọi lĩnh vực của đời sống xã hội","D":"Mối quan hệ giữa các cơ quan hành chính"},"answer":"B"},{"id":352,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":167,"question":"Phương pháp điều chỉnh của Luật hành chính:","options":{"A":"Bình đẳng – Thỏa thuận","B":"Thỏa thuận – Mệnh lệnh","C":"Mệnh lệnh – đơn phương","D":"Mệnh lệnh – Phục tùng"},"answer":"C"},{"id":353,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":168,"question":"Hình phạt là biện pháp ….. nhất của Nhà nước được quy định trong Bộ luật hình sự, do Tòa án quyết định áp dụng đối với người hoặc pháp nhân thương mại phạm tội nhằm tước bỏ hoặc hạn chế quyền, lợi ích của người, pháp nhân thương mại đó","options":{"A":"Nhân đạo","B":"Kỷ luật","C":"Cưỡng chế nghiêm khắc","D":"Cưỡng chế nghiêm trọng"},"answer":"C"},{"id":354,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":169,"question":"Đồng phạm là:","options":{"A":"Trường hợp có ba người trở lên cố ý cùng thực hiện một tội phạm","B":"Trường hợp có hai người trở lên cố ý cùng thực hiện một tội phạm","C":"Trường hợp có bốn người trở lên cố ý cùng thực hiện một tội phạm","D":"Trường hợp có nhiều người trở lên cố ý cùng thực hiện một tội phạm"},"answer":"B"},{"id":355,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":170,"question":"Khi có quyết định đại xá của Quốc hội thì người phạm tội được:","options":{"A":"Loại trừ trách nhiệm hình sự","B":"Miễn trách nhiệm hình sự","C":"Hoãn thi hành hình phạt tù","D":"Có thể được miễn trách nhiệm hình sự"},"answer":"B"},{"id":356,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":171,"question":"Không áp dụng hình phạt tử hình đối với trường hợp nào sau đây?","options":{"A":"Người dưới 18 tuổi khi phạm tội, phụ nữ có thai, phụ nữ đang nuôi con dưới 36 tháng tuổi hoặc người đủ 75 tuổi trở lên khi phạm tội hoặc khi xét xử","B":"Người bị kết án tử hình về tội tham ô tài sản, tội nhận hối lộ mà sau khi bị kết án đã chủ động nộp lại ít nhất ba phần tư tài sản tham ô, nhận hối lộ","C":"Các trường hợp phạm tội đặc biệt nghiêm trọng","D":"Phạm tội lần đầu và thuộc trường hợp ít nghiêm trọng"},"answer":"A"},{"id":357,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":172,"question":"Tình tiết nào sau đây không phải là tình tiết giảm nhẹ trách nhiệm hình sự?","options":{"A":"Người phạm tội đã ngăn chặn hoặc làm giảm bớt tác hai của tội phạm","B":"Người phạm tội tự nguyện sửa chữa, bồi thường thiệt hại hoặc khắc phục hậu quả","C":"Người phạm tội trong tình trạng mất khả năng nhận thức hoặc khả năng điều khiển hành vi của mình do dùng rượu, bia hoặc chất kích thích thích mạnh khác","D":"Phạm tội lần đầu và thuộc trường hợp ít nghiêm trọng"},"answer":"C"},{"id":358,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":173,"question":"Một cấu thành tội phạm luôn phải chứa đựng đầy đủ bốn yếu tố:","options":{"A":"Khách thể - khách quan – cố ý – vô ý","B":"Khách thể - khách quan – chủ thể - chủ quan","C":"Khách thể - khách quan – quan hệ nhân quả - lỗi","D":"Khách thể - khách quan – cố ý trực tiếp – vô ý"},"answer":"B"},{"id":359,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":174,"question":"Việc chiếm hữu, sử dụng, định đoạt tài sản chung của vợ chồng được quyết định như thế nào?","options":{"A":"Do vợ chồng thỏa thuận","B":"Do chồng quyết định","C":"Do vợ quyết định","D":"Do Tòa án quyết định"},"answer":"A"},{"id":360,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":175,"question":"Người nào sau đây không được quyền hưởng di sản?","options":{"A":"Người dưới 18 tuổi","B":"Người bị bệnh tâm thần","C":"Người bị tạm giam","D":"Người vi phạm nghiêm trọng nghĩa vụ nuôi dưỡng người để lại di sản"},"answer":"D"},{"id":361,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":176,"question":"Sau khi ly hôn 4 tháng với anh A, chị B sinh cháu M. Vì ở cùng xóm , anh A thường xuyên đến nhà để xin được gặp con nhưng đều bị chị B từ chối. Chị B cho rằng cháu M sinh ra khi hai người ly hôn. Giấy khai sinh của con chị không có tên anh A nên anh không có quyền gặp, chăm sóc cháu M và con chị cũng không liên quan đến anh A. Nhận định nào sau đây đúng?","options":{"A":"Anh A không có quyền đến thăm con","B":"Anh A có quyền xác nhận con của mình","C":"Chị B có quyền không cho anh A thăm con","D":"Chị B đã vi phạm luật hôn nhân"},"answer":"B"},{"id":362,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":177,"question":"Sau khi kết hôn, anh Ba và chị Tư được bố mẹ anh Ba tặng 100m2 đất để xây nhà. Thửa đất đã được cấp giấy chứng nhận quyền sử dụng đất ghi tên anh Ba và chị Tư. Đột nhiên anh Ba qua đời (không có di chúc), chị Tư vẫn sinh sống một mình trên mảnh đất đó. Sau khi anh Ba mất được một năm, bố mẹ anh Ba yêu cầu chị Tư trả lại toàn bộ mảnh đất đã cho để cho em của anh Ba. Hãy xác định những người được thừa kế căn nhà?","options":{"A":"Bố mẹ anh Ba","B":"Chị Tư","C":"Bố mẹ anh Ba, chị Tư","D":"Bố mẹ anh Ba, chị Tư, người em"},"answer":"C"},{"id":363,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":178,"question":"Do cần gấp một khoản tiền nên ông Hai đã cầm cố chiếc xe tải của mình cho ông Cường, thời gian cầm cố là 12 tháng, với lãi suất 1% / tháng. Trong thời gian cầm cố ông Hai phát hiện ông Cường đã dùng xe tải của mình đi chở hàng để kiếm thêm tiền, trong trường hợp này ông Hai có quyền gì?","options":{"A":"Yêu cầu ông Cường trả lại xe (1)","B":"Yêu cầu ông Cường ngưng sử dụng chiếc xe (2)","C":"Không trả tiền lãi cho ông Cường (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"B"},{"id":364,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":179,"question":"Ông Kha có hai người con, người con đầu tên Lâm là con chung với vợ trước (đã mất), người con sau tên Tân năm nay 09 tuổi là con chung với bà Hà (có đăng ký kết hôn hợp pháp). Khi biết mình bi bệnh nặng khó qua khỏi ông Kha đã đến Ủy ban nhân dân xã lập di chúc để lại căn nhà ( thuộc tài sản riêng của ông Kha) mà các thành viên đang ở cho Lâm. Sau khi ông Kha chết, Lâm có ý định đuổi mẹ kế và em trai mình ra khỏi nhà, vì cho rằng theo di chúc, căn nhà hiện thuộc sở hữu của mình. Xác định người thừa kế của ông Kha:","options":{"A":"Lâm","B":"Lâm, Tân","C":"Lâm, bà Hà","D":"Lâm, bà Hà, Tân"},"answer":"D"},{"id":365,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":180,"question":"Chị Mai muốn nhận Nam làm con nuôi, theo quy định của pháp luật chị Mai phải thỏa mãn một trong các điều kiện sau :","options":{"A":"Chị Mai phải từ 20 tuổi trở lên","B":"Chị Mai chỉ cần nộp căn cước công dân và giấy tờ tùy thân của mình","C":"Chị Mai chỉ cần sự chứng kiến của cơ quan nhà nước thì có thể nhận Nam làm con nuôi","D":"Chị Mai phải từ 22 tuổi trở lên"},"answer":"A"},{"id":366,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":181,"question":"Chị Mai có chồng là anh Nam, bạn của chị Mai có gửi cho chị một bì thư và 50.000.000 đồng với nội dung như sau: “ Mến tặng vợ chồng bạn, chúc hai bạn nhanh chóng qua khỏi thời kỳ khó khăn này” Số tiền trên là:","options":{"A":"Tài sản chung của chị Mai và anh Nam (1)","B":"Tài sản riêng của chị Mai (2)","C":"Tài sản được chia làm hai theo quy định của pháp luật (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"A"},{"id":367,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":182,"question":"Trường hợp con của người để lại di sản chết trước hoặc cùng một thời điểm với người để lại di sản thì cháu được hưởng phần di sản mà cha hoặc mẹ của cháu được hưởng nếu còn sống gọi là:","options":{"A":"Thừa kế kế tiếp","B":"Thừa kế bù đắp","C":"Thừa kế thế vị","D":"Thừa kế ngôi vị"},"answer":"C"},{"id":368,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":183,"question":"Một công ty xả chất thải ra sông làm cá chết hàng loạt, gây ô nhiễm nặng môi trường. Trách nhiệm pháp lý áp dụng đối với công ty này là:","options":{"A":"Trách nhiệm hành chính","B":"Trách nhiệm hình sự","C":"Trách nhiệm hành chính và trách nhiệm dân sự","D":"Trách nhiệm hình sự và trách nhiệm dân sự"},"answer":"C"},{"id":369,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":184,"question":"Ông Cao vận chuyển gia cầm bị bệnh, bị cơ quan có thẩm quyền phát hiện và buộc phải tiêu hủy hết số gia cầm này bị bệnh. Đây là biện pháp chế tài:","options":{"A":"Dân sự","B":"Hình sự","C":"Hành chính","D":"Kỷ luật"},"answer":"C"},{"id":370,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":185,"question":"Xác định câu sai trong các nguyên tắc xử phạt hành chính về giao thông đường bộ:","options":{"A":"Mọi vi phạm hành chính về giao thông đường bộ phải được phát hiện kịp thời và phải đình chỉ ngay","B":"Một vi phạm hành chính sẽ bị xử phạt nhiều lần","C":"Nhiều người cùng thực hiện một hành vi vi phạm hành chính thì mỗi người vi phạm đều bị xử phạt","D":"Một người thực hiện nhiều hành vi vi phạm hành chính thì bị xử phạt về từng hành vi vi phạm"},"answer":"B"},{"id":371,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":186,"question":"Trong các hành vi dưới đây, hành vi nào vi phạm hành chính:","options":{"A":"Người lao động thường xuyên đi làm muộn","B":"Người tham gia giao thông vượt đèn đỏ bị xử phạt","C":"Hành vi trộm cắp tài sản công dân","D":"Hành vi vượt đèn đỏ gây hậu quả nghiêm trọng"},"answer":"B"},{"id":372,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":187,"question":"Là hàng xóm của nhau, chị Nhung cho chị Hoa vay 30.000.000 đồng trong thời hạn ba tháng không tính lãi. Khi đã quá hạn trả nợ hai tháng mà chị Hoa vẫn chưa trả, chị Nhung đã đến nhà chị Hoa lấy đi chiếc xe máy của chị Hoa để siết nợ. Hành vi của chị Nhung là gì?","options":{"A":"Trộm cắp tài sản","B":"Cưỡng đoạt tài sản","C":"Công nhiên chiếm đoạt tài sản","D":"Lừa đảo chiếm đoạt tài sản"},"answer":"C"},{"id":373,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":188,"question":"Ông Đa là tổ trưởng dân phòng khu phố, vì nghi ngờ cháu Phan đổ sơn vào cửa nhà mình, ông Đa đã bắt giữ cháu Phan và tra khảo nhằm buộc cháu Phan phải nhận là đổ sơn vào nhà ông. Theo Bộ luật hình sự năm 2015, hành vi của ông Đa đã có dấu hiệu của tội gì?","options":{"A":"Tội lợi dụng chức vụ, quyền hạn , bắt giữ, giam người trái pháp luật","B":"Tôi vi phạm quy định về giam giữ","C":"Tội bắt, giữ hoặc giam người trái pháp luật","D":"Tôi lợi dụng chức vụ, quyền hạn gây ảnh hưởng đối với người khác để trục lợi"},"answer":"C"},{"id":374,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":189,"question":"Lợi dụng lúc gia đình Ba ngủ trưa không đóng cửa, Ân lẻn vào nhà Ba lấy chiếc máy hiệu SH ( trị giá khoảng 50 triệu đồng) Ân dắt xe ra đến sân thì bị anh Ba phát hiện và đuổi theo giằng lại. Ân dùng chân đạp mạnh vào người anh Ba làm anh ngã ra sân. Ân vội lên xe và rồ ga chạy ra ngoài đường để tẩu thoát nhưng đã bị mọi người bắt giữ. Anh Ba ngã chỉ bị xây xước. Ân phạm tội:","options":{"A":"Trộm cắp tài sản, hành hung để tẩu thoát","B":"Công nhiên chiếm đoạt tài sản","C":"Cướp tài sản","D":"Cướp giật tài sản"},"answer":"C"},{"id":375,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":190,"question":"T, U, K uống rượu say, đi loạng choạng và ngã ở dọc đường, G và Q phát hiện chị U đeo nhiều nữ trang bằng vàng, G và Q lấy đi toàn bộ tài sản trị giá 50 triệu đồng. Gần sáng cơn say hết, chị U tỉnh giấc mới biết mình bị mất tài sản và đi báo công an. Tội danh của G và Q là:","options":{"A":"Cướp tài sản","B":"Công nhiên chiếm đoạt tài sản","C":"Trộm cắp tài sản","D":"Cướp giật tài sản"},"answer":"C"},{"id":376,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":191,"question":"Chọn đáp án đúng","options":{"A":"Người từ đủ 14 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm, trừ những tội phạm mà Bộ luật này có quy định khác","B":"Người từ đủ 15 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm, trừ những tội phạm mà Bộ luật này có quy định khác","C":"Người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm, trừ những tội phạm mà Bộ luật này có quy định khác","D":"Người từ đủ 17 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm, trừ những tội phạm mà Bộ luật này có quy định khác"},"answer":"C"},{"id":377,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":192,"question":"Chọn đáp án đúng","options":{"A":"Người phạm tội trong tình trạng mất khả năng nhận thức hoặc khả năng điều khiển h cứ nên tòa án tuyên phạt A hình phạt của loại tội phạm nhẹ hơn. K thực hiện những hành vi nào?","options":{"A":"Lợi dụng chức vụ quyền hạn để bao che cho người có hành vi vi phạm pháp luật vì vụ lợi; cản trở, can thiệp trái pháp luật vào việc kiểm tra, thanh tra, kiểm toán, điều tra, truy tố, xét xử, thi hành án vì vụ lợi","B":"Nhũng nhiễu vì vụ lợi","C":"Không thực hiện nhiệm vụ, công vụ vì vụ lợi","D":"Lợi dụng chức vụ, quyền hạn trong khi thi hành nhiệm vụ, công vụ vì vụ lợi"},"answer":"A"},{"id":381,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":196,"question":"Mục đích của quyền khiếu nại là nhằm ….quyền và lợi ích hợp pháp của người khiếu nại","options":{"A":"phục hồi","B":"bù đắp","C":"chia sẻ","D":"khôi phục"},"answer":"D"},{"id":382,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":197,"question":"Mức phạt tiền thấp nhất đối với pháp nhân thương mại phạm tội là","options":{"A":"50.000.000đ","B":"100.000.000đ","C":"150.000.000đ","D":"200.000.000đ"},"answer":"A"}];
    const LETTERS = ['A', 'B', 'C', 'D'];

    const SUBJECT_CONFIGS = {
      gdct: {
        title: 'Giáo Dục Chính Trị (9 Bài)',
        badge: '296 Câu • GDCT',
        storageKey: 'gdct_itc_296_single_locked_v2',
        getQuestions: () => GDCT_BANK
      },
      pl_all: {
        title: 'Pháp Luật (382 Câu)',
        badge: '382 Câu • Pháp Luật',
        storageKey: 'pl_itc_all_382_single_locked_v1',
        getQuestions: () => PL_BANK
      }
    };

    let currentSubject = 'gdct';
    let activeBank = GDCT_BANK;
    let qMap = new Map();

    let state = {
      mode: 'practice',
      examSubmitted: false,
      currentIndex: 0,
      deck: [],
      answers: {},
      drawerOpen: false
    };

    function fyShuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Shuffle options for a question; if an option references positional meta text ("Cả A và B", "Tất cả...trên"), keep positional order or keep meta option at the end
    function shuffleOptionsForQuestion(q) {
      const keys = Object.keys(q.options);
      const hasPositionalRef = Object.values(q.options).some(txt =>
        /cả a và b|cả b và c|cả 2 đáp án|tất cả.*trên|cả 03 loại.*trên/i.test(txt)
      );
      if (hasPositionalRef) {
        return keys;
      }
      return fyShuffle(keys);
    }

    function buildRandomDeck() {
      const shuffledIds = fyShuffle(activeBank.map(q => q.id));
      state.deck = shuffledIds.map((id, idx) => {
        const q = qMap.get(id);
        return {
          id,
          displayNum: idx + 1,
          optionOrder: shuffleOptionsForQuestion(q)
        };
      });
    }

    function loadSubjectState(subjKey) {
      currentSubject = subjKey;
      localStorage.setItem('gdct_pl_active_subject', subjKey);
      const cfg = SUBJECT_CONFIGS[subjKey];
      activeBank = cfg.getQuestions();
      qMap = new Map(activeBank.map(q => [q.id, q]));

      document.getElementById('subject-badge').textContent = cfg.badge;

      // Update subject tabs styling
      ['gdct', 'pl_all'].forEach(k => {
        const btn = document.getElementById(`tab-${k}`);
        if (k === subjKey) {
          btn.className = 'px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-teal-600 text-white shadow-xs transition cursor-pointer';
        } else {
          btn.className = 'px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200/80 dark:border-slate-700 transition cursor-pointer';
        }
      });

      const raw = localStorage.getItem(cfg.storageKey);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.deck) && parsed.deck.length === activeBank.length) {
            state.mode = parsed.mode || 'practice';
            state.examSubmitted = !!parsed.examSubmitted;
            state.currentIndex = Math.min(parsed.currentIndex || 0, activeBank.length - 1);
            state.deck = parsed.deck;
            state.answers = parsed.answers || {};
          } else {
            state.mode = 'practice';
            state.examSubmitted = false;
            state.currentIndex = 0;
            state.answers = {};
            buildRandomDeck();
          }
        } catch (e) {
          state.mode = 'practice';
          state.examSubmitted = false;
          state.currentIndex = 0;
          state.answers = {};
          buildRandomDeck();
        }
      } else {
        state.mode = 'practice';
        state.examSubmitted = false;
        state.currentIndex = 0;
        state.answers = {};
        buildRandomDeck();
      }

      saveState();
      refreshAll();
    }

    function switchSubject(subjKey) {
      if (currentSubject === subjKey) return;
      loadSubjectState(subjKey);
    }

    function init() {
      if (localStorage.getItem('gdct_theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
      syncThemeIcons();

      const savedSubj = localStorage.getItem('gdct_pl_active_subject');
      const initialSubj = (savedSubj && SUBJECT_CONFIGS[savedSubj]) ? savedSubj : 'gdct';
      loadSubjectState(initialSubj);
    }

    function saveState() {
      try {
        const cfg = SUBJECT_CONFIGS[currentSubject];
        localStorage.setItem(cfg.storageKey, JSON.stringify({
          mode: state.mode,
          examSubmitted: state.examSubmitted,
          currentIndex: state.currentIndex,
          deck: state.deck,
          answers: state.answers
        }));
      } catch (e) {}
    }

    function getQStatus(qId) {
      const picked = state.answers[qId];
      if (!picked) return 'undone';
      const q = qMap.get(qId);
      return picked === q.answer ? 'correct' : 'wrong';
    }

    function toggleLeftPanel() {
      state.drawerOpen = !state.drawerOpen;
      applyDrawerState();
    }

    function closeLeftPanel() {
      state.drawerOpen = false;
      applyDrawerState();
    }

    function applyDrawerState() {
      const drawer = document.getElementById('left-drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      const arrow = document.getElementById('drawer-arrow');
      if (state.drawerOpen) {
        drawer.classList.remove('-translate-x-full');
        drawer.classList.add('translate-x-0');
        backdrop.classList.remove('hidden');
        arrow.classList.add('rotate-180');
        const activeBtn = document.getElementById(`gbtn-mob-${state.currentIndex}`);
        if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest' });
      } else {
        drawer.classList.add('-translate-x-full');
        drawer.classList.remove('translate-x-0');
        backdrop.classList.add('hidden');
        arrow.classList.remove('rotate-180');
      }
    }

    function shuffleBothNow() {
      buildRandomDeck();
      state.currentIndex = 0;
      saveState();
      refreshAll();
    }

    function resetAllConfirm() {
      if (!confirm('Xóa toàn bộ các câu đã khóa của phần này và trộn ngẫu nhiên lại bộ đề mới?')) return;
      state.answers = {};
      state.examSubmitted = false;
      state.currentIndex = 0;
      buildRandomDeck();
      saveState();
      refreshAll();
    }

    function setMode(m) {
      if (state.mode === m) return;
      state.mode = m;
      if (m === 'practice') state.examSubmitted = false;
      saveState();
      refreshAll();
    }

    function selectAnswer(qId, chosenOriginalKey) {
      if ((state.mode === 'exam' && state.examSubmitted) || state.answers[qId] !== undefined) {
        return;
      }
      state.answers[qId] = chosenOriginalKey;
      saveState();
      updateStatsAndButtons();
      renderSingleQuestion();
      renderGrid();
    }

    function submitExam() {
      const doneCount = Object.keys(state.answers).length;
      if (!confirm(`Bạn đã làm ${doneCount}/${activeBank.length} câu. Nộp bài và chấm điểm ngay?`)) return;
      state.examSubmitted = true;
      saveState();
      refreshAll();
    }

    function updateStatsAndButtons() {
      let done = 0, correct = 0, wrong = 0;
      state.deck.forEach(item => {
        const st = getQStatus(item.id);
        if (st !== 'undone') {
          done++;
          if (st === 'correct') correct++;
          else wrong++;
        }
      });

      const total = state.deck.length;
      const pctDone = total > 0 ? Math.round((done / total) * 100) : 0;
      const score10 = total > 0 ? ((correct / total) * 10).toFixed(1) : '0.0';

      document.getElementById('side-percent').textContent = `${pctDone}% hoàn thành`;
      document.getElementById('progress-bar').style.width = `${pctDone}%`;
      document.getElementById('stat-total-done').textContent = `${done}/${total}`;
      document.getElementById('stat-correct').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '-' : correct;
      document.getElementById('stat-wrong').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '-' : wrong;
      document.getElementById('stat-score').textContent = (state.mode === 'exam' && !state.examSubmitted) ? '-' : score10;

      document.getElementById('grid-count-desk').textContent = total;
      document.getElementById('grid-count-mob').textContent = total;

      const activeToggle = 'py-1.5 px-2.5 rounded-lg text-xs font-bold bg-white dark:bg-slate-900 text-teal-600 dark:text-teal-400 shadow-xs transition cursor-pointer';
      const inactiveToggle = 'py-1.5 px-2.5 rounded-lg text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition cursor-pointer';
      document.getElementById('btn-mode-practice').className = state.mode === 'practice' ? activeToggle : inactiveToggle;
      document.getElementById('btn-mode-exam').className = state.mode === 'exam' ? activeToggle : inactiveToggle;

      document.getElementById('submit-exam-btn').classList.toggle('hidden', !(state.mode === 'exam' && !state.examSubmitted));
    }

    function buildGridButtons(prefix) {
      return state.deck.map((item, idx) => {
        const st = getQStatus(item.id);
        const isCurrent = idx === state.currentIndex;
        let cls = 'h-8 rounded-lg text-xs font-bold flex items-center justify-center border transition cursor-pointer ';
        if (isCurrent) cls += 'ring-2 ring-teal-500 ring-offset-1 dark:ring-offset-slate-900 ';

        if (st === 'undone') {
          cls += 'bg-slate-50 hover:bg-slate-100 text-slate-600 border-slate-200 dark:bg-slate-800/70 dark:hover:bg-slate-800 dark:text-slate-400 dark:border-slate-700';
        } else if (state.mode === 'exam' && !state.examSubmitted) {
          cls += 'bg-sky-500 text-white border-sky-600';
        } else if (st === 'correct') {
          cls += 'bg-emerald-500 text-white border-emerald-600';
        } else {
          cls += 'bg-rose-500 text-white border-rose-600';
        }
        return `<button id="gbtn-${prefix}-${idx}" onclick="jumpToIndex(${idx})" class="${cls}">${item.displayNum}</button>`;
      }).join('');
    }

    function renderGrid() {
      const gridDesktop = document.getElementById('question-grid-desktop');
      const gridMobile = document.getElementById('question-grid-mobile');
      if (gridDesktop) gridDesktop.innerHTML = buildGridButtons('desk');
      if (gridMobile) gridMobile.innerHTML = buildGridButtons('mob');

      const activeDesk = document.getElementById(`gbtn-desk-${state.currentIndex}`);
      if (activeDesk) activeDesk.scrollIntoView({ block: 'nearest' });
    }

    function jumpToIndex(idx) {
      state.currentIndex = idx;
      saveState();
      renderSingleQuestion();
      renderGrid();
      if (window.innerWidth < 1024) {
        closeLeftPanel();
      }
    }

    function stepQuestion(delta) {
      const next = state.currentIndex + delta;
      if (next < 0 || next >= state.deck.length) return;
      state.currentIndex = next;
      saveState();
      renderSingleQuestion();
      renderGrid();
    }

    function renderSingleQuestion() {
      const box = document.getElementById('single-question-box');
      const deckItem = state.deck[state.currentIndex];
      const q = qMap.get(deckItem.id);
      const pickedKey = state.answers[q.id];
      const isLocked = pickedKey !== undefined || (state.mode === 'exam' && state.examSubmitted);
      const reveal = (state.mode === 'practice' && pickedKey !== undefined) || (state.mode === 'exam' && state.examSubmitted);
      const isCorrect = pickedKey === q.answer;

      let badgeHTML = '<span class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400">Chưa trả lời</span>';
      if (reveal && pickedKey !== undefined) {
        badgeHTML = isCorrect
          ? '<span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-950/90 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800">🔒 Đã khóa • Chính xác ✓</span>'
          : '<span class="px-3 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-700 dark:bg-rose-950/90 dark:text-rose-300 border border-rose-300 dark:border-rose-800">🔒 Đã khóa • Sai ✕</span>';
      } else if (pickedKey !== undefined) {
        badgeHTML = '<span class="px-3 py-1 rounded-full text-xs font-bold bg-sky-100 text-sky-700 dark:bg-sky-950/90 dark:text-sky-300 border border-sky-300 dark:border-sky-800">🔒 Đã khóa đáp án</span>';
      }

      // Chỉ hiển thị câu gốc SAU KHI đã hiển thị đáp án (reveal === true)
      const ansIdx = deckItem.optionOrder.indexOf(q.answer);
      const currentCorrectLetter = LETTERS[ansIdx] || q.answer;
      const originHTML = reveal
        ? `<span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">${escapeHtml(q.lessonTitle)} • Câu gốc ${q.lessonQ} (Đ/A gốc: ${q.answer} ➔ ${currentCorrectLetter})</span>`
        : '';

      const optionsHTML = deckItem.optionOrder.map((origKey, displayIdx) => {
        const displayLetter = LETTERS[displayIdx];
        const optText = q.options[origKey];
        const isThisPicked = pickedKey === origKey;
        const isThisRight = origKey === q.answer;

        let rowCls = 'w-full text-left p-4 rounded-xl border transition flex items-start gap-3.5 ';
        let pillCls = 'w-8 h-8 rounded-lg text-xs font-extrabold flex items-center justify-center shrink-0 transition ';

        if (isLocked) {
          rowCls += 'cursor-not-allowed ';
        } else {
          rowCls += 'group cursor-pointer ';
        }

        if (reveal) {
          if (isThisRight) {
            rowCls += 'bg-emerald-50/95 border-emerald-500 text-emerald-950 dark:bg-emerald-950/50 dark:border-emerald-500 dark:text-emerald-100 shadow-2xs';
            pillCls += 'bg-emerald-600 text-white';
          } else if (isThisPicked && !isThisRight) {
            rowCls += 'bg-rose-50/95 border-rose-500 text-rose-950 dark:bg-rose-950/50 dark:border-rose-500 dark:text-rose-100';
            pillCls += 'bg-rose-600 text-white';
          } else {
            rowCls += 'bg-slate-50/60 border-slate-200/70 text-slate-400 dark:bg-slate-900/40 dark:border-slate-800 dark:text-slate-500 opacity-70';
            pillCls += 'bg-slate-200/70 text-slate-400 dark:bg-slate-800 dark:text-slate-500';
          }
        } else if (isThisPicked) {
          rowCls += 'bg-sky-50/90 border-sky-500 text-sky-950 dark:bg-sky-950/40 dark:border-sky-500 dark:text-sky-100 shadow-2xs';
          pillCls += 'bg-sky-600 text-white';
        } else {
          rowCls += 'bg-slate-50/80 hover:bg-teal-50/50 border-slate-200 hover:border-teal-500 text-slate-800 dark:bg-slate-800/50 dark:hover:bg-slate-800 dark:border-slate-700 dark:text-slate-100';
          pillCls += 'bg-white border border-slate-300 text-slate-700 group-hover:border-teal-500 group-hover:bg-teal-600 group-hover:text-white dark:bg-slate-900 dark:border-slate-600 dark:text-slate-300';
        }

        return `
          <button type="button" ${isLocked ? 'disabled' : ''} onclick="selectAnswer(${q.id}, '${origKey}')" class="${rowCls}">
            <span class="${pillCls}">${displayLetter}</span>
            <span class="text-sm sm:text-base leading-relaxed pt-0.5 flex-1">${escapeHtml(optText)}</span>
          </button>
        `;
      }).join('');

      box.innerHTML = `
        <article class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 p-5 sm:p-6 shadow-xs">
          <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-100 dark:border-slate-800">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="inline-flex items-center px-3.5 py-1 rounded-xl text-sm font-extrabold bg-teal-600 text-white shadow-2xs">
                Câu ${deckItem.displayNum} / ${activeBank.length}
              </span>
              ${originHTML}
            </div>
            ${badgeHTML}
          </div>

          <h2 class="text-base sm:text-lg font-bold leading-relaxed text-slate-900 dark:text-white mb-5">
            ${escapeHtml(q.question)}
          </h2>

          <div class="space-y-3">
            ${optionsHTML}
          </div>

          <!-- Navigation Footer -->
          <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-3">
            <button onclick="stepQuestion(-1)" ${state.currentIndex === 0 ? 'disabled' : ''} class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs sm:text-sm font-bold disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer">
              ← Câu trước
            </button>

            <div class="text-xs font-semibold text-slate-400 dark:text-slate-500 text-center">
              Câu <b class="text-slate-700 dark:text-slate-300">${state.currentIndex + 1}</b> / ${state.deck.length}
            </div>

            <button onclick="stepQuestion(1)" ${state.currentIndex >= state.deck.length - 1 ? 'disabled' : ''} class="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs sm:text-sm font-bold disabled:opacity-40 disabled:pointer-events-none shadow-xs transition cursor-pointer">
              Câu tiếp theo →
            </button>
          </div>
        </article>
      `;
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        stepQuestion(1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        stepQuestion(-1);
      } else {
        const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
        const idx = keyMap[e.key.toLowerCase()];
        if (idx !== undefined) {
          const item = state.deck[state.currentIndex];
          if (item && idx < item.optionOrder.length && state.answers[item.id] === undefined) {
            e.preventDefault();
            selectAnswer(item.id, item.optionOrder[idx]);
          }
        }
      }
    });

    function refreshAll() {
      updateStatsAndButtons();
      renderSingleQuestion();
      renderGrid();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('gdct_theme', isDark ? 'dark' : 'light');
      syncThemeIcons();
    }

    function syncThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('icon-sun').classList.toggle('hidden', !isDark);
      document.getElementById('icon-moon').classList.toggle('hidden', isDark);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
