c hiện chính sách dung túng, duy trì các hủ tục lạc hậu trong nhân dân ta.", "D": "Thực hiện khẩu hiệu: tự do, bình đẳng, bác ái ở nước ta."}, "answer": "A"}, {"id": 183, "question": "Lựa chọn đáp án thích hợp để điền vào chỗ trống trong khái niệm dưới đây: “Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong cảm giác, được cảm giác của chúng ta ………và tồn tại không lệ thuộc vào cảm giác”.", "options": {"A": "chép lại, chụp lại, phản ánh", "B": "chép lại, lệ thuộc, phản ánh", "C": "chụp lại, chép lại, phản ánh", "D": "chụp lại, lệ thuộc, phản ánh"}, "answer": "A"}, {"id": 184, "question": "Học thuyết giá trị thặng dư là ..............trong toàn bộ học thuyết kinh tế của C.Mác, là đóng góp to lớn của ông trong lịch sử tư tưởng nhân loại. Nó chỉ ra bản chất bóc lột của phương thức sản xuất tư bản chủ nghĩa.", "options": {"A": "hòn đá tảng", "B": "sợi chỉ đỏ", "C": "bộ phận quan trọng", "D": "vấn đề cơ bản"}, "answer": "A"}, {"id": 185, "question": "Nhà nước đầu tiên trong lịch sử là kiểu nhà nước nào ?", "options": {"A": "Nhà nước phong kiến.", "B": "Nhà nước chủ nô.", "C": "Nhà nước tư sản.", "D": "Nhà nước vô sản."}, "answer": "B"}, {"id": 186, "question": "Xác định đâu là một trong những phương hướng xây dựng chủ nghĩa xã hội ở Việt Nam được nêu ra tại Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung và phát triển năm 2011) ?", "options": {"A": "Có quan hệ hữu nghị và hợp tác với các nước trên thế giới.", "B": "Dân giàu, nước mạnh, xã hội công bằng, dân chủ, văn minh.", "C": "Đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước gắn với phát triển kinh tế tri thức, bảo vệ tài nguyên, môi trường.", "D": "Có nền văn hóa tiên tiến, khoa học, đậm đà bản sắc dân tộc."}, "answer": "C"}, {"id": 187, "question": "Phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa là một trong những ?", "options": {"A": "Đặc trưng cơ bản của chủ nghĩa xã hội ở Việt Nam được nêu ra tại Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung và phát triển năm 2011).", "B": "Phương thức lãnh đạo củ Đảng trong thời kỳ đổi mới.", "C": "Mục tiêu phát triển kinh tế trong thời kỳ công nghệ 4.0.", "D": "Phương hướng xây dựng chủ nghĩa xã hội ở Việt Nam được nêu ra tại Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung và phát triển năm 2011)."}, "answer": "D"}, {"id": 188, "question": "Đặc trưng của chủ nghĩa xã hội ở Việt Nam thuộc về lĩnh vực văn hóa được nêu ra tại Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung và phát triển năm 2011)?", "options": {"A": "Có quan hệ hữu nghị và hợp tác với các nước trên thế giới.", "B": "Tiên tiến, đậm đà bản sắc dân tộc.", "C": "Giải phóng khỏi áp bức bất công, nâng cao đời sống nhân dân, thực hiện tiến bộ và công bằng xã hội.", "D": "Bình đẳng, đoàn kết, tương trợ giúp đỡ lẫn nhau."}, "answer": "B"}, {"id": 189, "question": "Đảm bảo vững chắc quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội được xem là ?", "options": {"A": "Nhiệm vụ trọng yếu, thường xuyên của Đảng, Nhà nước và toàn dân. (1)", "B": "Đặc trưng cơ bản của chủ nghĩa xã hội ở Việt Nam được nêu ra tại Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung và phát triển năm 2011).(2)", "C": "Phương thức lãnh đạo củ Đảng trong thời kỳ đổi mới. (3)", "D": "Cả (1), (2), (3) đều đúng."}, "answer": "A"}, {"id": 190, "question": "Lực lượng nòng cốt Đảm bảo vững chắc quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội là?", "options": {"A": "Cán bộ, đảng viên.", "B": "Quân đội nhân dân và Công an nhân dân, dân quân tự vệ.", "C": "Quân đội nhân dân và Công an nhân dân.", "D": "Quân đội nhân dân và Công an nhân dân, dân quân tự vệ, các đoàn thể chính trị xã hội."}, "answer": "C"}, {"id": 191, "question": "Công nghiệp hoá, hiện đại hoá đất nước phải bảo đảm ?", "options": {"A": "Xây dựng nền kinh tế khép kín và hướng nội.", "B": "Xây dựng nền kinh tế độc lập tự chủ.", "C": "Xây dựng nền kinh tế dựa vào sự giúp đỡ của nước tư bản.", "D": "Xây dựng nền kinh tế mở và giao lưu hợp tác với các nước xã hội chủ nghĩa."}, "answer": "B"}, {"id": 192, "question": "Trong quá trình công nghiệp hoá hiện đại hoá nền kinh tế nào được coi là yếu tố quan trọng ?", "options": {"A": "Kinh tế nông nghiệp.", "B": "Nền kinh tế công nghiệp.", "C": "Nền kinh tế tri thức.", "D": "Nền kinh tế công - nông nghiệp kết hợp."}, "answer": "C"}, {"id": 193, "question": "Theo Hồ Chí Minh, nền tảng của Mặt trận dân tộc thống nhất:", "options": {"A": "Liên minh kết công – nông.", "B": "Liên minh công – nông – lao động trí óc.", "C": "Liên minh dân tộc.", "D": "Liên minh công – nông và các tầng lớp xã hội khác."}, "answer": "B"}, {"id": 194, "question": "Từ xa xưa trong lịch sử, dân tộc Việt Nam sớm có ý thức cộng đồng, ý thức đoàn kết “bầu ơi thương lấy bí cùng…”, “lá lành đùm lá rách”…. đã tr ở thành cơ sở nào của đường lối, chính sách đại đoàn kết toàn dân tộc trong xây dựng và bảo vệ Tổ quốc ?", "options": {"A": "Cơ sở chủ quan", "B": "Cơ sở khoa học", "C": "Cơ sở lý luận", "D": "Cơ sở thực tiễn"}, "answer": "D"}, {"id": 195, "question": "Thời gian lao động xã hội cần thiết là …………để sản xuất ra một hàng hoá trong điều kiện bình thường của xã hội, tức là với một trình độ ………….. và cường độ lao động trung bình so với điều kiện xã hội nhất định. Lựa chọn đáp án đúng để điền vào chỗ trống:", "options": {"A": "thời gian cần thiết/ kỹ thuật trung bình", "B": "thời gian chủ yếu/ kỹ thuật trung bình", "C": "thời gian cần thiết/ kỹ thuật cá biệt", "D": "thời gian đủ/ kỹ thuật trung bình"}, "answer": "A"}, {"id": 196, "question": "Để sản xuất ra một cái áo, thời gian lao động của anh Thiên là 1 giờ, anh Phát là 2 giờ, anh Đạt là 3 giờ. Trong khi đó, thời gian lao động xã hội cần thiết là 2 giờ. Trong 3 người trên, ai thực hiện tốt quy luật giá trị ?", "options": {"A": "Anh Thiên. (1)", "B": "Anh Phát. (2)", "C": "Anh Đạt. (3)", "D": "Cả (1) và (2) đều đúng."}, "answer": "D"}, {"id": 197, "question": "Hoàn thiện nội dung sau: Đại hội XII của Đảng tiếp tục khẳng định phương châm và định hướng lớn của hoạt động đối ngoại là: “…, … trong quan hệ đối ngoại; chủ động và tích cực hội nhập quốc tế; là bạn, là đối tác tin cậy và … có trách nhiệm của cộng đồng quốc tế”.", "options": {"A": "Đa dạng hóa, đa phương hóa / thành viên.", "B": "Đa dạng hóa, đa phương hóa / hội viên.", "C": "Đa phương hóa, đa dạng hóa / thành viên.", "D": "Đa phương hóa, đa dạng hóa / hội viên."}, "answer": "A"}, {"id": 198, "question": "Thường ngày Nam và Sơn cùng ng ồi học chung một bàn. Một hôm, Nam bị mất điện thoại, Nam cho rằng Sơn đã lấy điện thoại Nam, sau đó hai bạn lời qua ti ếng lại với nhau. Tức quá Nam đánh Sơn. Hỏi Nam đã vi phạm luật gì ?", "options": {"A": "Quyền sống, bất khả xâm phạm về thân thể, được pháp luật bảo hộ về sức khoẻ, danh dự và nhân phẩm.", "B": "Quyền bất khả xâm phạm về đời sống riêng tư.", "C": "Bí mật cá nhân và bí mật gia đình.", "D": "Bí mật thư tín, điện thoại, điện tín và các hình thức trao đổi thông tin riêng tư khác."}, "answer": "A"}, {"id": 199, "question": "Thấy con gái đi học thường xuyên nhắn tin nói chuyện với một bạn trai trong lớp. Lo sợ con gái bị bạn xấu lợi dụng nên bà Lan thường xuyên xem điện thoại của con mà không được sự đồng ý. Cá biệt có những tin nhắn bà đọc xong xóa luôn không cho con gái biết. Một hôm tình cờ phát hiện sự việc này con gái bà rất tức giận và nói: Mẹ không được phép làm như vậy. Mẹ làm như vậy là vi phạm pháp luật đấy. Theo em con gái bà Lan đang đề cập đến quyền gì của công dân ?", "options": {"A": "Quyền sống, bất khả xâm phạm về thân thể, được pháp luật bảo hộ về sức khoẻ, danh dự và nhân phẩm.", "B": "Quyền bất khả xâm phạm về đời sống riêng tư.", "C": "Bí mật cá nhân và bí mật gia đình.", "D": "Bí mật thư tín, điện thoại, điện tín và các hình thức trao đổi thông tin riêng tư khác."}, "answer": "D"}, {"id": 200, "question": "Đang là sinh viên năm th ứ 2 tại một trường cao đẳng trên thành ph ố, một hôm Lam nhận được điện thoại của gia đình yêu cầu về quê có chuyện gấp. Về tới quê Lam bị ép gả cho một người mà Lam không yêu ch ỉ vì người đó giúp gia đình Lam có một số tiền lớn để trả nợ. Lam không đồng ý và đã trốn lên thành phố. Trong tình huống này gia đình Lam đã vi phạm quyền gì ?", "options": {"A": "Quyền sống, bất khả xâm phạm về thân thể, được pháp luật bảo hộ về sức khoẻ, danh dự và nhân phẩm.", "B": "Quyền bất khả xâm phạm về đời sống riêng tư.", "C": "Quyền tự do ngôn luận.", "D": "Quyền kết hôn, ly hôn theo nguyên tắc tự nguyện, tiến bộ, một vợ một chồng, vợ chồng bình đẳng, tôn trọng lẫn nhau./."}, "answer": "D"}];
    
    // Application States
    let appState = {
      mode: 'practice', // 'practice' | 'exam'
      filter: 'all', // 'all' | 'done' | 'undone' | 'correct' | 'incorrect'
      searchQuery: '',
      shuffledQuestions: [], // Stores question objects with currently shuffled options
      userSelections: {}, // qId -> selected option index (0..3)
      examSubmitted: false
    };

    // Lazy loading variables
    let visibleCount = 15;
    let currentFilteredQuestions = [];

    // Initialize application
    function init() {
      // 1. Try loading progress from LocalStorage
      const saved = localStorage.getItem('tracnghiem_gdct_state_v3') || localStorage.getItem('tracnghiem_gdct_state_v2');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          appState.mode = parsed.mode || 'practice';
          appState.userSelections = parsed.userSelections || {};
          appState.examSubmitted = parsed.examSubmitted || false;
          appState.shuffledQuestions = parsed.shuffledQuestions || [];
        } catch (e) {
          console.error("Failed to restore saved progress", e);
        }
      }

      // Update mode buttons UI
      updateModeButtonsUI();

      // 2. Generate shuffles if empty or sync text with ORIGINAL_QUESTIONS
      if (!appState.shuffledQuestions || appState.shuffledQuestions.length !== ORIGINAL_QUESTIONS.length) {
        shuffleAllOptions();
      } else {
        // Always sync text from ORIGINAL_QUESTIONS to replace any stale/truncated text cached in LocalStorage
        appState.shuffledQuestions.forEach(sq => {
          const orig = ORIGINAL_QUESTIONS.find(o => o.id === sq.id);
          if (orig) {
            sq.question = orig.question;
            sq.correctAnswerText = orig.options[orig.answer];
            if (sq.shuffledOptions) {
              sq.shuffledOptions.forEach(opt => {
                if (opt.originalKey && orig.options[opt.originalKey] !== undefined) {
                  opt.text = orig.options[opt.originalKey];
                }
              });
            }
          }
        });
      }

      // Save updated synced state
      saveProgress();

      // 3. Render questions list & grid & stats
      visibleCount = 15;
      updateFilteredDataset();
      renderQuestionsList(false);
      renderNavigationGrid();
      updateStats();
    }

    function updateModeButtonsUI() {
      document.getElementById('mode-practice').classList.toggle('active', appState.mode === 'practice');
      document.getElementById('mode-exam').classList.toggle('active', appState.mode === 'exam');
      document.getElementById('submit-btn').style.display = (appState.mode === 'exam' && !appState.examSubmitted) ? 'block' : 'none';
    }

    // Shuffle options for all questions
    function shuffleAllOptions() {
      appState.shuffledQuestions = ORIGINAL_QUESTIONS.map(q => {
        const optionKeys = ['A', 'B', 'C', 'D'];
        
        // Find correct option text
        const correctText = q.options[q.answer];

        // Map options to array of object
        const optArray = optionKeys.map(key => ({
          text: q.options[key],
          originalKey: key
        })).filter(o => o.text !== undefined);

        // Shuffle the array (Fisher-Yates)
        for (let i = optArray.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [optArray[i], optArray[j]] = [optArray[j], optArray[i]];
        }

        return {
          id: q.id,
          question: q.question,
          shuffledOptions: optArray,
          correctAnswerText: correctText
        };
      });
    }

    // Set quiz mode
    function setMode(newMode) {
      if (appState.mode === newMode) return;
      
      if (newMode === 'exam' && Object.keys(appState.userSelections).length > 0 && !appState.examSubmitted) {
        if (!confirm('Chuyển sang chế độ Thi thử sẽ ẩn các phản hồi đúng sai ngay lập tức của bạn cho tới khi nộp bài. Bạn có muốn tiếp tục?')) {
          return;
        }
      }
      
      appState.mode = newMode;
      updateModeButtonsUI();
      
      // Re-render only currently visible cards
      renderQuestionsList(false);
      renderNavigationGrid();
      updateStats();
      saveProgress();
    }

    // Set search query
    function handleSearch() {
      appState.searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      visibleCount = 15;
      updateFilteredDataset();
      renderQuestionsList(false);
    }

    // Set filter
    function setFilter(filterType) {
      appState.filter = filterType;
      
      // Update active filter button class
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.getElementById(`filter-${filterType}`).classList.add('active');

      visibleCount = 15;
      updateFilteredDataset();
      renderQuestionsList(false);
    }

    // Shuffle and save
    function shuffleAnswersAll() {
      if (confirm('Tráo đáp án sẽ xáo trộn lại thứ tự lựa chọn A, B, C, D của toàn bộ 200 câu hỏi. Tiến độ làm bài của bạn vẫn giữ nguyên nhưng vị trí các đáp án sẽ thay đổi. Tiếp tục?')) {
        shuffleAllOptions();
        
        visibleCount = 15;
        updateFilteredDataset();
        renderQuestionsList(false);
        
        updateStats();
        saveProgress();
        showToast('Tráo đáp án thành công!');
      }
    }

    // Reset progress
    function resetProgressConfirm() {
      if (confirm('Bạn có chắc muốn đặt lại toàn bộ tiến độ làm bài không? Tất cả đáp án bạn đã chọn sẽ bị xóa sạch.')) {
        appState.userSelections = {};
        appState.examSubmitted = false;
        shuffleAllOptions();
        
        document.getElementById('search-input').value = '';
        appState.searchQuery = '';
        
        setFilter('all');
        updateModeButtonsUI();
        
        visibleCount = 15;
        updateFilteredDataset();
        renderQuestionsList(false);
        renderNavigationGrid();
        updateStats();
        saveProgress();
        showToast('Đã làm lại từ đầu!');
      }
    }

    // Save state to localStorage
    function saveProgress() {
      const stateToSave = {
        mode: appState.mode,
        userSelections: appState.userSelections,
        examSubmitted: appState.examSubmitted,
        shuffledQuestions: appState.shuffledQuestions
      };
      localStorage.setItem('tracnghiem_gdct_state_v3', JSON.stringify(stateToSave));
    }

    // Get grading status of a single question
    function getQuestionStatus(qId) {
      const q = appState.shuffledQuestions.find(x => x.id === qId);
      if (!q) return 'unanswered';
      
      const selectionIdx = appState.userSelections[qId];
      if (selectionIdx === undefined) return 'unanswered';

      const selectedOptText = q.shuffledOptions[selectionIdx].text;
      const isCorrect = selectedOptText === q.correctAnswerText;

      return isCorrect ? 'correct' : 'incorrect';
    }

    // Answer selecting handler
    function selectOption(qId, optionIdx) {
      if (appState.mode === 'exam' && appState.examSubmitted) {
        return; // Locked after submission
      }

      appState.userSelections[qId] = optionIdx;
      
      // Update UI for this question card
      renderQuestionCard(qId);
      
      // Update navigation grid item
      updateGridItem(qId);

      // Update stats and save
      updateStats();
      saveProgress();
    }

    // Updates the currentFilteredQuestions array according to search and filters
    function updateFilteredDataset() {
      const query = appState.searchQuery;
      const filter = appState.filter;

      currentFilteredQuestions = appState.shuffledQuestions.filter(q => {
        let matchFilter = true;
        const status = getQuestionStatus(q.id);

        if (filter === 'done' && status === 'unanswered') matchFilter = false;
        else if (filter === 'undone' && status !== 'unanswered') matchFilter = false;
        else if (filter === 'correct' && status !== 'correct') matchFilter = false;
        else if (filter === 'incorrect' && status !== 'incorrect') matchFilter = false;

        let matchSearch = true;
        if (query) {
          const matchId = q.id.toString() === query;
          const matchText = q.question.toLowerCase().includes(query);
          
          let matchOptions = false;
          for (let opt of q.shuffledOptions) {
            if (opt.text.toLowerCase().includes(query)) {
              matchOptions = true;
              break;
            }
          }
          matchSearch = matchId || matchText || matchOptions;
        }

        return matchFilter && matchSearch;
      });
    }

    // Renders matching questions in chunks (Lazy loading)
    function renderQuestionsList(append = false) {
      const container = document.getElementById('questions-container');
      if (!append) {
        container.innerHTML = '';
      }

      const toRender = currentFilteredQuestions.slice(
        append ? container.children.length : 0,
        visibleCount
      );

      toRender.forEach(q => {
        // Skip rendering if already in DOM (prevents duplicates)
        if (document.getElementById(`q-card-${q.id}`)) return;

        const card = document.createElement('div');
        card.className = 'panel card';
        card.id = `q-card-${q.id}`;
        container.appendChild(card);
        buildCardContent(card, q);
      });

      // Handle no results empty state
      let noResults = document.getElementById('no-results-message');
      if (currentFilteredQuestions.length === 0) {
        if (!noResults) {
          noResults = document.createElement('div');
          noResults.id = 'no-results-message';
          noResults.className = 'no-results panel';
          noResults.innerHTML = `
            <i class="fa-regular fa-folder-open"></i>
            <p>Không tìm thấy câu hỏi nào phù hợp với bộ lọc hoặc từ khóa tìm kiếm.</p>
          `;
          container.appendChild(noResults);
        } else {
          noResults.style.display = 'block';
        }
      } else {
        if (noResults) noResults.style.display = 'none';
      }
    }

    // Appends more questions when scrolled
    function loadMoreQuestions() {
      if (visibleCount < currentFilteredQuestions.length) {
        visibleCount = Math.min(visibleCount + 15, currentFilteredQuestions.length);
        renderQuestionsList(true);
      }
    }

    // Window scroll listener for infinite scrolling
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 600) {
        loadMoreQuestions();
      }
    });

    // Renders/updates a specific question card
    function renderQuestionCard(qId) {
      const card = document.getElementById(`q-card-${qId}`);
      if (!card) return;
      const q = appState.shuffledQuestions.find(x => x.id === qId);
      if (!q) return;
      buildCardContent(card, q);
    }

    // Helper to generate question card HTML content
    function buildCardContent(card, q) {
      const status = getQuestionStatus(q.id);
      const isAnswered = appState.userSelections[q.id] !== undefined;
      const showAnswers = (appState.mode === 'practice' && isAnswered) || (appState.mode === 'exam' && appState.examSubmitted);

      // Status badge template
      let statusBadge = '';
      if (showAnswers) {
        if (status === 'correct') {
          statusBadge = '<span class="q-status-badge correct"><i class="fa-solid fa-check"></i> Đúng</span>';
        } else {
          statusBadge = '<span class="q-status-badge incorrect"><i class="fa-solid fa-xmark"></i> Sai</span>';
        }
      } else if (isAnswered) {
        statusBadge = '<span class="q-status-badge unanswered" style="color:#c084fc; border-color: rgba(124, 58, 237, 0.3); background: rgba(124, 58, 237, 0.05);"><i class="fa-solid fa-pen"></i> Đã chọn</span>';
      } else {
        statusBadge = '<span class="q-status-badge unanswered">Chưa trả lời</span>';
      }

      let optionsHtml = '';
      const letters = ['A', 'B', 'C', 'D'];
      const selectedIdx = appState.userSelections[q.id];

      q.shuffledOptions.forEach((opt, idx) => {
        const isSelected = selectedIdx === idx;
        const isCorrectChoice = opt.text === q.correctAnswerText;
        
        let choiceClass = '';
        if (isSelected) choiceClass += ' selected';
        
        // Show correct / incorrect colors if needed
        if (showAnswers) {
          if (isCorrectChoice) {
            choiceClass += ' correct-choice';
          } else if (isSelected && !isCorrectChoice) {
            choiceClass += ' incorrect-choice';
          }
          choiceClass += ' disabled';
        }

        optionsHtml += `
          <div class="option${choiceClass}" onclick="selectOption(${q.id}, ${idx})">
            <div class="option-letter">${letters[idx]}</div>
            <div class="option-text">${escapeHtml(opt.text)}</div>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="q-number">
          <span>Câu ${q.id}</span>
          ${statusBadge}
        </div>
        <div class="q-text">${escapeHtml(q.question)}</div>
        <div class="options-grid">
          ${optionsHtml}
        </div>
      `;
    }

    // Render 1-200 navigation grid
    function renderNavigationGrid() {
      const grid = document.getElementById('navigation-grid');
      grid.innerHTML = '';

      appState.shuffledQuestions.forEach(q => {
        const btn = document.createElement('button');
        btn.id = `grid-btn-${q.id}`;
        btn.className = 'grid-btn';
        btn.textContent = q.id;
        
        updateGridItemClass(btn, q.id);

        btn.onclick = () => {
          document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          // If the item is currently filtered out, switch filter to all
          const isFilteredOut = !currentFilteredQuestions.some(x => x.id === q.id);
          if (isFilteredOut) {
            setFilter('all');
          }

          // Locate question index in currentFilteredQuestions
          const qIdx = currentFilteredQuestions.findIndex(x => x.id === q.id);
          if (qIdx !== -1) {
            // Expand visibleCount dynamically to include the target item if it's further down
            if (qIdx >= visibleCount) {
              visibleCount = qIdx + 1;
              renderQuestionsList(true);
            }

            // Scroll to the card
            const card = document.getElementById(`q-card-${q.id}`);
            if (card) {
              card.scrollIntoView({ behavior: 'smooth', block: 'center' });
              card.style.borderColor = 'var(--primary)';
              setTimeout(() => {
                card.style.borderColor = 'var(--card-border)';
              }, 1000);
            }
          }

          if (window.innerWidth <= 1024) {
            toggleMobilePanel();
          }
        };

        grid.appendChild(btn);
      });
    }

    // Update single grid item styling
    function updateGridItem(qId) {
      const btn = document.getElementById(`grid-btn-${qId}`);
      if (btn) {
        updateGridItemClass(btn, qId);
      }
    }

    function updateGridItemClass(btn, qId) {
      const status = getQuestionStatus(qId);
      const isAnswered = appState.userSelections[qId] !== undefined;
      const isExam = appState.mode === 'exam';

      btn.classList.remove('correct', 'incorrect', 'answered');

      if (isExam && !appState.examSubmitted) {
        if (isAnswered) btn.classList.add('answered');
      } else {
        if (status === 'correct') btn.classList.add('correct');
        else if (status === 'incorrect') btn.classList.add('incorrect');
      }
    }

    // Update Statistics panels
    function updateStats() {
      const total = appState.shuffledQuestions.length;
      let answeredCount = 0;
      let correctCount = 0;
      let incorrectCount = 0;

      appState.shuffledQuestions.forEach(q => {
        const isAnswered = appState.userSelections[q.id] !== undefined;
        if (isAnswered) {
          answeredCount++;
          const status = getQuestionStatus(q.id);
          if (status === 'correct') correctCount++;
          else if (status === 'incorrect') incorrectCount++;
        }
      });

      const unansweredCount = total - answeredCount;
      const percentDone = total > 0 ? Math.round((answeredCount / total) * 100) : 0;
      const scorePercent = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

      document.getElementById('stat-done').textContent = `${answeredCount}/${total}`;
      document.getElementById('stat-score').textContent = `${scorePercent}%`;
      document.getElementById('stat-correct').textContent = correctCount;
      document.getElementById('stat-incorrect').textContent = incorrectCount;
      
      document.getElementById('percent-label').textContent = `${percentDone}%`;
      document.getElementById('progress-bar').style.width = `${percentDone}%`;

      document.getElementById('count-done').textContent = answeredCount;
      document.getElementById('count-undone').textContent = unansweredCount;
      document.getElementById('count-correct').textContent = correctCount;
      document.getElementById('count-incorrect').textContent = incorrectCount;
    }

    // Submit Exam Mode
    function submitExam() {
      const answered = Object.keys(appState.userSelections).length;
      const total = appState.shuffledQuestions.length;
      
      if (answered < total) {
        if (!confirm(`Bạn mới làm ${answered}/${total} câu. Bạn có chắc muốn nộp bài chấm điểm ngay bây giờ không?`)) {
          return;
        }
      } else {
        if (!confirm('Bạn có chắc muốn nộp bài chấm điểm không?')) {
          return;
        }
      }

      appState.examSubmitted = true;
      document.getElementById('submit-btn').style.display = 'none';

      // Re-render currently visible cards to show correctness
      renderQuestionsList(false);
      renderNavigationGrid();
      updateStats();
      saveProgress();

      window.scrollTo({ top: 0, behavior: 'smooth' });

      let correct = 0;
      appState.shuffledQuestions.forEach(q => {
        if (getQuestionStatus(q.id) === 'correct') correct++;
      });
      alert(`KẾT QUẢ THI THỬ:\nSố câu đúng: ${correct}/${total}\nĐiểm số: ${(correct/total * 10).toFixed(2)}/10 điểm.\nBạn có thể dò lại các câu sai màu đỏ để ôn tập.`);
    }

    // Mobile Panel trigger
    function toggleMobilePanel() {
      const panel = document.getElementById('right-panel');
      panel.classList.toggle('show');
    }

    // Helpers
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Run on startup
    window.onload = init;
  </script>
</body>
</html>
