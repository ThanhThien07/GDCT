dự, nhân phẩm","D":"Quyền được đảm bảo an toàn cuộc sống"},"answer":"C"},{"id":21,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":21,"question":"Anh B thường xuyên đi làm muộn và nhiều lần tự ý nghỉ việc không lí do. Trong trường hợp này anh B đã vi phạm:","options":{"A":"Hình sự","B":"Hành chính","C":"Dân sự","D":"Kỉ luật"},"answer":"D"},{"id":22,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":22,"question":"Anh C làm việc tại công ty Trách nhiệm hữu hạn May mặc X, công việc: nhân viên kho thành phẩm. Hai bên ký hợp đồng có thời hạn là 12 tháng, hiệu lực từ 01/10/2021 đến 30/9/2022.Đến ngày 01/12/2022, anh C vẫn tiếp tục ở lại làm việc mà hai bên không ký hợp đồng mới. Hợp đồng lao động còn hiệu lực không?","options":{"A":"Hợp đồng lao động hết hiệu lực, anh C phải nghỉ việc tại Công ty","B":"Hợp đồng lao động hết hiệu lực, nếu anh C muốn tiếp tục làm việc thì các bên phải gia hạn hợp đồng","C":"Hợp đồng lao động đã giao kết trở thành hợp đồng lao động không xác định thời hạn","D":"Hợp đồng lao động xác định thời hạn đã hết hạn mà anh C vẫn tiếp tục làm việc tại Công ty thì hợp đồng đó mặc nhiên được gia hạn bằng thời hạn của 3 hợp đồng đã ký trước đó"},"answer":"C"},{"id":23,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":23,"question":"Anh A là nhân viên phòng kế toán. Do yêu cầu công việc, công ty yêu cầu anh A đi làm thêm giờ vào ngày 01/01/2024 (thời gian làm việc bằng ngày thường, tức là 8h/ngày). Vậy anh A được trả lương khi làm thêm giờ như thế nào so với mức lương vào ngày thường?","options":{"A":"Ít nhất bằng 150%","B":"Ít nhất bằng 200%","C":"Ít nhất bằng 180%","D":"Ít nhất bằng 300%"},"answer":"D"},{"id":24,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":24,"question":"Pháp luật có những chức năng gì?","options":{"A":"Chức năng điều chỉnh","B":"Chức năng giáo dục","C":"Chức năng điều chỉnh và chức năng giáo dục","D":"Chỉ có chức năng phản ánh"},"answer":"C"},{"id":25,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":25,"question":"Chủ thể nào sau đây là người đứng đầu cơ quan quyền lực nhà nước cao nhất?","options":{"A":"Chủ tịch Quốc hội","B":"Chủ tịch nước","C":"Thủ tướng Chính phủ","D":"Chánh án Toà án Nhân dân tố́́́i cao"},"answer":"A"},{"id":26,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":26,"question":"Nguyên tắc đảm bảo tính tối cao của Hiến pháp và luật được thể hiện như sau:","options":{"A":"Khi ban hành các văn bản dưới luật không được trái Hiến pháp và luật; trong tổ chức và thực hiện pháp luật phải coi trọng Hiến pháp và luật","B":"Văn bản dưới luật được ban hành không cần căn cứ vào Hiến pháp và luật miễn là phù hợp với điều kiện địa phương và đạo đức xã hội","C":"Khi ban hành các văn bản dưới luật phải thật sự bình đẳng với Hiến pháp và luật","D":"Tăng cường kiểm tra, xử lý vi phạm"},"answer":"A"},{"id":27,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":27,"question":"Việc thống nhất sửa đổi, bổ sung Hiến pháp phải có:","options":{"A":"Ít nhất 1/2 tổng số đại biểu tán thành (1)","B":"Ít nhất 2/3 tổng số đại biểu tán thành (2)","C":"Ít nhất 3/4 tổng số đại biểu tán thành (3)","D":"Cả (1), (2) và (3) đều sai"},"answer":"B"},{"id":28,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":28,"question":"Hợp đồng lao động xác định thời hạn được ký tối đa mấy lần?","options":{"A":"2 lần","B":"3 lần","C":"4 lần","D":"Tùy thuộc vào sự thỏa thuận của người lao động và người sử dụng lao động"},"answer":"A"},{"id":29,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":29,"question":"Khi đơn phương chấm dứt Hợp đồng lao động không xác định thời hạn, người lao động phải báo trước cho người sử dụng lao động:","options":{"A":"45 ngày","B":"30 ngày","C":"03 ngày","D":"Bất cứ lúc nào người lao động muốn nghỉ việc mà không cần báo trước"},"answer":"A"},{"id":30,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":30,"question":"Đối với lao động nữ, người sử dụng lao động có thể đơn phương chấm dứt hợp đồng lao động khi người lao động nữ:","options":{"A":"Kết hôn","B":"Nghỉ việc không lý do","C":"Nuôi con dưới 12 tháng tuổi","D":"Có thai"},"answer":"B"},{"id":31,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":31,"question":"Quyền làm việc của người lao động là:","options":{"A":"Làm việc cho bất kỳ người sử dụng lao động nào (1)","B":"Làm việc ở bất cứ nơi nào mà pháp luật không cấm (2)","C":"Được làm việc cho bất kỳ người sử dụng lao động nào và ở bất kỳ nơi nào mà pháp luật không cấm (3)","D":"cả (1) và (2) đều đúng"},"answer":"C"},{"id":32,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":32,"question":"Tác phẩm văn học do công dân tạo ra được pháp luật bảo hộ thuộc quyền nào dưới đây của công dân?","options":{"A":"Quyền tác giả","B":"Quyền sở hữu công nghiệp","C":"Quyền phát minh, sáng chế","D":"Quyền được phát triển"},"answer":"A"},{"id":33,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":33,"question":"Quan hệ xã hội nào sau đây không phải là quan hệ pháp luật","options":{"A":"Trân và Quang làm thủ tục đăng ký kết hôn","B":"Tư đi vào đường ngược chiều, Cảnh sát giao thông đã xử phạt","C":"Na ra chợ mua rau","D":"Quan hệ lao động"},"answer":"C"},{"id":34,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":34,"question":"Nếu người sử dụng lao động buộc người lao động thôi việc trái pháp luật thì người lao động có quyền:","options":{"A":"Kiện ra tòa (1)","B":"Yêu cầu người sử dụng lao động phải bồi thường thiệt hại trong thời gian bị buộc thôi việc (2)","C":"Yêu cầu người sử dụng lao động phải tiếp nhận người lao động trở lại làm việc bình thường(3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":35,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":35,"question":"Trước khi ban hành nội quy lao động, người sử dụng lao động:","options":{"A":"Phải tham khảo ý kiến của từng người lao động","B":"Phải tham khảo ý kiến của ban giám đốc","C":"Phải tham khảo ý kiến của tổ chức đại diện tập thể lao động cơ sở","D":"Phải tham khảo tình hình chung"},"answer":"C"},{"id":36,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":36,"question":"Những hành vi nào dưới đây là không đúng với Luật lao động:","options":{"A":"Bắt trẻ em dưới 15 tuổi vào làm việc","B":"Được tham gia bảo hiểm đầy đủ","C":"Được nghỉ các ngày lễ, tết theo quy định của nhà nước.","D":"Được thăm hỏi những lúc ốm đau, bệnh tật"},"answer":"A"},{"id":37,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":37,"question":"Cô M mua một hộp sữa bột hiệu X, chưa kịp dùng thì nhận được thông báo từ nhà sản xuất về sự cố trong quá trình sản xuất nên yêu cầu người tiêu dùng đem sản phẩm đã mua mà chưa kịp sử dụng đến các đại lý để đổi lấy sản phẩm mới. Vậy hàng hóa đó (sữa bột) được gọi là:","options":{"A":"Hàng hóa","B":"Hàng kém chất lượng","C":"Hàng hóa có khuyết tật","D":"Hàng đổi, trả"},"answer":"C"},{"id":38,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":38,"question":"Chọn cụm từ đúng: “Cá nhân vi phạm pháp luật về bảo vệ quyền lợi người tiêu dùng thì … mà bị xử phạt vi phạm hành chính hoặc bị truy cứu trách nhiệm hình sự, nếu gây thiệt hại thì phải bồi thường theo quy định của pháp luật.","options":{"A":"tùy theo lỗi","B":"tùy theo thái độ","C":"tùy theo tính chất, mức độ vi phạm","D":"tùy theo tính chất vụ việc"},"answer":"C"},{"id":39,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":39,"question":"Khi chấm dứt Hợp đồng lao động trái pháp luật, người sử dụng lao động phải:","options":{"A":"Nhận người lao động trở lại làm việc","B":"Nhận người lao động trở lại làm việc; trả tiền lương, bảo hiểm xã hội","C":"Nhận người lao động trở lại làm việc; trả tiền lương, bảo hiểm xã hội, bảo hiểm y tế","D":"Thanh toán các khoản do hai bên thỏa thuận"},"answer":"C"},{"id":40,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":40,"question":"Minh bạch tài sản, thu nhập của cán bộ, công chức là việc:","options":{"A":"Kê khai tài sản của bản thân","B":"Kê khai tài sản của bản thân; cán bộ, công chức còn phải kê khai tài sản của vợ hoặc chồng và con chưa thành niên","C":"Kê khai tài sản của bản thân; cán bộ, công chức còn phải kê khai tài sản của vợ hoặc chồng và con đã thành niên","D":"Kê khai tài sản của bản thân; cán bộ, công chức còn phải kê khai tài sản của cha mẹ, vợ hoặc chồng và các con."},"answer":"B"},{"id":41,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":41,"question":"Hàng hóa có khuyết tật là:","options":{"A":"Hàng hóa không bảo đảm an toàn cho người tiêu dùng (1)","B":"Có khả năng gây thiệt hại cho tính mạng, sức khỏe (2)","C":"Có khả năng gây thiệt hại tài sản của người tiêu dùng (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":42,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":42,"question":"Cơ quan chịu trách nhiệm quản lý nhà nước về bảo vệ quyền lợi người tiêu dùng:","options":{"A":"Chính phủ (1)","B":"Bộ Công Thương, các cơ quan ngang bộ (2)","C":"Ủy ban nhân dân các cấp (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":43,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":43,"question":"Thuộc tính chung của bản chất Nhà nước là:","options":{"A":"Tính giai cấp","B":"Tính xã hội","C":"Tính giai cấp và tính xã hội","D":"Tính giai cấp, tính xã hội và tính cưỡng chế"},"answer":"C"},{"id":44,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":44,"question":"Nhận định nào sai khi xác định người không được thực hiện quyền ứng cử","options":{"A":"Người bị khởi tố dân sự","B":"Người đang chấp hành quyết định hình sự của Tòa án","C":"Người đang bị xử lý hành chính về giáo dục tại địa phương","D":"Người đã chấp hành xong bản án hình sự"},"answer":"D"},{"id":45,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":45,"question":"Tranh chấp lao động là tranh chấp về quyền, nghĩa vụ và lợi ích phát sinh trong:","options":{"A":"Quan hệ dân sự","B":"Quan hệ hành chính","C":"Quan hệ lao động","D":"Quan hệ giữa hai người lao động"},"answer":"C"},{"id":46,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":46,"question":"Tranh chấp lao động cá nhân phải thông qua thủ tục nào sau đây:","options":{"A":"Viết đơn tố cáo","B":"Liên hệ cơ quan có thẩm quyền","C":"Hòa giải","D":"Yêu cầu tòa án giải quyết"},"answer":"C"},{"id":47,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":47,"question":"Đối tượng điều chỉnh của luật lao động là:","options":{"A":"Các quan hệ xã hội về sử dụng lao động giữa người lao động và người sử dụng lao động","B":"Các quan hệ xã hội liên quan đến việc làm và tiền lương","C":"Các quan hệ xã hội liên quan đến quan hệ lao động","D":"Các quan hệ xã hội về sử dụng lao động và các quan hệ liên quan đến quan hệ lao động"},"answer":"D"},{"id":48,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":48,"question":"Không có pháp luật xã hội sẽ không:","options":{"A":"Dân chủ và hạnh phúc","B":"Trật tự và ổn định","C":"Hòa bình và dân chủ","D":"Sức mạnh và quyền lực"},"answer":"B"},{"id":49,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":49,"question":"Quyền học tập, quyền sáng tạo và quyền phát triển của công dân được quy định trong:","options":{"A":"Hiến pháp (1)","B":"Luật giáo dục (2)","C":"Luật khoa học và công nghệ (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":50,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":50,"question":"Công ty X có 10 người lao động, đều làm việc lâu năm tại Công ty X thông qua việc ký hợp đồng lao động không xác định thời hạn. Do gặp khó khăn trong kinh doanh, Công ty X muốn cho một số người lao động nghỉ việc. Trong số 04 người lao động thuộc các trường hợp sau đây thì Công ty có thể chấm dứt hợp đồng lao động đúng quy định pháp luật với người nào?","options":{"A":"Lao động nữ mang thai đang tạm hoãn hợp đồng lao động","B":"Người lao động bị tai nạn lao động đang điều trị bệnh nên không thể làm việc được","C":"Người lao động bị kết án tù giam","D":"Người lao động thuộc bộ phận có khối lượng công việc không ổn định thì Công ty có thể cho nghỉ miễn là phải báo trước 45 ngày cho người lao động bàn giao và tìm việc làm mới"},"answer":"C"},{"id":51,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":51,"question":"Chị B ký hợp đồng lao động với doanh nghiệp X, thời hạn là 36 tháng, lương 12 triệu đồng/01 tháng. Ngày 05/5/2020 là ngày hết hạn hợp đồng nhưng chị B vẫn làm việc với công việc và tiền lương như hợp đồng lao động đã ký kết mà không ký mới hợp đồng lao động. Ngày 15/6/2020 chị B chấm dứt hợp đồng lao động với lý do phải chuyển chỗ ở đến nơi khác nên đi lại gặp khó khăn. Chị B có được quyền đơn phương chấm dứt hợp đồng lao động không? Thủ tục chấm dứt như thế nào?","options":{"A":"Thuộc trường hợp bản thân, gia đình có hoàn cảnh khó khăn nên chị B có quyền chấm dứt hợp đồng lao động và phải báo trước 30 ngày","B":"Chị B có quyền chấm dứt hợp đồng lao động vì thực tế giữa chị B và Công ty đã không ký mới hợp đồng lao động","C":"Có và chị B phải báo trước Công ty 45 ngày","D":"Lý do chấm dứt hợp đồng lao động không đúng pháp luật và chị B phải thỏa thuận với Công ty về thời hạn chấm dứt, bàn giao công việc, hoàn thành các nghĩa vụ của người lao động trước khi nghỉ"},"answer":"C"},{"id":52,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":52,"question":"Anh An làm thợ điện tại doanh nghiệp dệt M với Hợp đồng lao động có thời hạn 36 tháng. Làm việc được 1 năm, do có giấy phép ra thăm thân nhân ở nước ngoài, anh An xin nghỉ không hương lương trong thời gian 2 tháng, Giám đốc doanh nghiệp chấp thuận với yêu cầu anh An tìm người thay thế trong thời gian đó. Anh An giới thiệu anh Ca, bạn cùng học nghề. Sau khi kiểm tra, Giám đốc chấp thuận anh Ca vào làm việc thay anh An. Làm việc được 1 tháng, trong một làn trực điện ca ba, do đóng nhầm điện áp gây hỏng máy móc và sản phẩm của doanh nghiệp, anh Ca bỏ trốn. Khi hết hạn nghỉ, anh An trở lại làm việc thì được doanh nghiệp thông báo toàn bộ sự việc và yêu cầu anh An phải liên đới bồi thường thiệt hại đã xảy ra với tổng số tiền là 50.000.000 đồng. Cho biết trách nhiệm bồi thường thiệt hại trong trường hợp trên thuộc về ai?","options":{"A":"An","B":"Ca","C":"An và Ca liên đới chịu trách nhiệm","D":"An và Ca liên đới chịu trách nhiệm bồi thường 50% của thiệt hại, 50% còn lại do người sử dụng lao động hỗ trợ cho người lao động"},"answer":"B"},{"id":53,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":53,"question":"Bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam được tổ chức theo nguyên tắc nào?","options":{"A":"Quốc hội là cơ quan đại biểu cao nhất của nhân dân, cơ quan quyền lực nhà nước cao nhất của nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam (1)","B":"Quyền lực nhà nước là thống nhất nhưng có sự phân công và phối hợp giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp (2)","C":"Đảm bảo sự tham gia đông đảo của nhân dân vào tổ chức và hoạt động của nhà nước (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":54,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":54,"question":"Nhà nước ta điều hành đất nước bằng :","options":{"A":"Văn hóa, giáo dục chính trị","B":"Kế hoạch phát triển kinh tế","C":"Quân đội và chính quyền","D":"Hiến pháp và pháp luật"},"answer":"D"},{"id":55,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":55,"question":"Điều 16 Hiến pháp 2013 khẳng định :","options":{"A":"Mọi người đều bình đẳng trước pháp luật (1)","B":"Mọi người không bị phân biệt, đối xử trước pháp luật (2)","C":"Mọi người đều bình đẳng trước pháp luật; không ai bị phân biệt, đối xử trong đời sống chính trị, dân sự, kinh tế, văn hóa, xã hội (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":56,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":56,"question":"Tiền lương của người lao động trong thời gian thử việc được quy định trong Bộ luật Lao động 2019 ít nhất phải bằng:","options":{"A":"50% mức lương của công việc đó","B":"70% mức lương của công việc đó","C":"85% mức lương của công việc đó","D":"Do hai bên thỏa thuận"},"answer":"C"},{"id":57,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":57,"question":"Luật lao động quy định thẩm quyền tuyên bố hợp đồng lao động vô hiệu:","options":{"A":"Người sử dụng lao động có quyền tuyên bố hợp đồng lao động vô hiệu","B":"Bộ trưởng Bộ Lao động thương binh và xã hội","C":"Chính phủ","D":"Tòa án nhân dân có quyền tuyên bố hợp đồng lao động vô hiệu"},"answer":"D"},{"id":58,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":58,"question":"Khoản 1 điều 33 Bộ luật Lao động 2019: Trong quá trình thực hiện hợp đồng lao động, nếu bên nào có yêu cầu sửa đổi, bổ sung nội dung hợp đồng lao động thì phải báo cho bên kia biết trước:","options":{"A":"Ít nhất 5 ngày làm việc về những nội dung cần sửa đổi, bổ sung","B":"Ít nhất 7 ngày làm việc về những nội dung cần sửa đổi, bổ sung","C":"Ít nhất 3 ngày làm việc về những nội dung cần sửa đổi, bổ sung","D":"Phải thực hiện ngay những nội dung cần sửa đổi, bổ sung"},"answer":"C"},{"id":59,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":59,"question":"Nguyên tắc trả lương cho người lao động là:","options":{"A":"Trả qua thẻ","B":"Trả trực tiếp, đầy đủ","C":"Trả bằng tiền mặt","D":"Trả lương trực tiếp, đầy đủ và đúng thời hạn"},"answer":"D"},{"id":60,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":60,"question":"Tài sản, thu nhập nào dưới đây không thuộc tài sản, thu nhập phải kê khai?","options":{"A":"Quyền sử dụng đất, nhà ở, công trình xây dựng và tài sản khác gắn liền với đất, nhà ở, công trình xây dựng","B":"Kim khí quý, đá quý, tiền, giấy tờ có giá và động sản khác mà mỗi tài sản có giá trị từ 50.000.000 đồng trở lên","C":"Tài sản, tài khoản ở nước ngoài","D":"Giấy tờ có giá có giá trị đến dưới 50.000.000 đồng"},"answer":"D"},{"id":61,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":61,"question":"Theo Điều 9 của luật bảo vệ quyền lợi người tiêu dùng (2010), người tiêu dùng có các nghĩa vụ sau:","options":{"A":"Kiểm tra hàng hoá trước khi nhận (1)","B":"Lựa chọn tiêu dùng hàng hóa, dịch vụ có nguồn gốc, xuất xứ rõ ràng, không làm tổn hại đến môi trường, trái với thuần phong mỹ tục và đạo đức xã hội, không gây nguy hại đến tính mạng, sức khỏe của mình và của người khác (2)","C":"Thực hiện chính xác, đầy đủ hướng dẫn sử dụng hàng hóa, dịch vụ (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":62,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":62,"question":"Hợp đồng đào tạo nghề gồm có những nội dung nào?","options":{"A":"Nghề đào tạo; địa điểm đào tạo, thời hạn đào tạo; chi phí đào tạo (1)","B":"Thời hạn người lao động cam kết phải làm việc cho người sử dụng lao động sau khi được đào tạo (2)","C":"Trách nhiệm hoàn trả chi phí đào tạo; Trách nhiệm của người sử dụng lao động (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":63,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":63,"question":"Người lao động nữ mang thai có xác nhận của cơ sở khám, chữa bệnh có thẩm quyền chứng nhận tiếp tục làm việc sẽ ảnh hưởng xấu tới thai nhi có quyền đơn phương chấm dứt hợp đồng lao động hoặc tạm hoãn thực hiện hợp đồng lao động. Thời hạn mà lao động nữ phải báo trước cho người sử dụng lao động là:","options":{"A":"3 ngày","B":"5 ngày","C":"7 ngày","D":"Tùy thuộc vào thời hạn do cơ sở khám, chữa bệnh có thẩm quyền chỉ định"},"answer":"D"},{"id":64,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":64,"question":"Người lao động nữ được quyền đơn phương chấm dứt hợp đồng lao động trong trường hợp nào sau đây:","options":{"A":"Lao động nữ mang thai phải nghỉ việc theo chỉ định của cơ sở khám bênh, chữa bệnh có thẩm quyền. (1)","B":"Lao động nữ thường xuyên không hoàn thành công việc theo hợp đồng lao động (2)","C":"Cả (1) và (2) đúng","D":"Cả (1) và (2) sai"},"answer":"A"},{"id":65,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":65,"question":"Trường hợp người sử dụng lao động không được đơn phương chấm dứt hợp đồng lao động:","options":{"A":"Người lao động bị ốm đau, tai nạn lao động, bệnh nghề nghiệp đang trong thời gian điều trị điều dưỡng.(1)","B":"Người lao động đang nghỉ hàng năm, nghỉ về việc riêng hoặc những trường hợp nghỉ khác được người sử dụng lao động đồng ý;(2)","C":"Vì lý do kết hôn, có thai, nghỉ thai sản, nuôi con dưới 12 tháng tuổi.(3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":66,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":66,"question":"Căn cứ để xác định một người là công dân Việt Nam là :","options":{"A":"Được sinh ra ở Việt Nam","B":"Thường trú tại Việt Nam","C":"Làm việc tại Việt Nam","D":"Quốc tịch Việt Nam"},"answer":"D"},{"id":67,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":67,"question":"Thời gian thử việc căn cứ vào tính chất và mức độ phức tạp của công việc người sử dụng lao động được thử việc bao nhiêu lần?","options":{"A":"Chỉ được thử việc 01 lần","B":"Chỉ được thử việc 02 lần.","C":"Chỉ được thử việc 03 lần.","D":"Không hạn chế số lần"},"answer":"A"},{"id":68,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":68,"question":"Người lao động làm thêm giờ vào ngày lễ, ngày nghỉ có hưởng lương thì được trả lương như thế nào?","options":{"A":"Ít nhất bằng 150% tiền lương tính theo đơn giá tiền lương hoặc tiền lương của công việc đang làm.","B":"Ít nhất bằng 200% tiền lương tính theo đơn giá tiền lương hoặc tiền lương của công việc đang làm","C":"Ít nhất bằng 300% chưa kể tiền lương ngày lễ, ngày nghỉ có hưởng lương đối với người lao động hưởng lương ngày","D":"Ít nhất bằng 300% tiền lương tính theo đơn giá tiền lương hoặc tiền lương của công việc đang làm"},"answer":"C"},{"id":69,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":69,"question":"Những hành vi nào sau đây người sử dụng lao động không được làm khi giao kết, thực hiện hợp đồng lao động?","options":{"A":"Giữ tiền đặt cọc, chứng minh nhân dân, văn bằng chính của người lao động.(1)","B":"Giữ bản chính giấy tờ tùy thân, văn bằng, chứng chỉ của người lao động.(2)","C":"Yêu cầu người lao động phải thực hiện biện pháp bảo đảm bằng tiền hoặc tài sản khác cho việc thực hiện hợp đồng lao động (3)","D":"Cả (2) và (3) đều đúng"},"answer":"D"},{"id":70,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":70,"question":"Tại một cửa hàng ăn uống, người khách mua một tô phở khi tính tiền chủ cửa hàng báo giá 500 ngàn đồng, người khách than phiền dịch vụ quá đắt mà lại không có biển báo giá công khai. Chủ hàng nói ở đây toàn khách quen nên không cần biển báo giá công khai. Hỏi, trách nhiệm của tổ chức, cá nhân kinh doanh hàng hóa, dịch vụ trong việc cung cấp thông tin về hàng hóa, dịch vụ cho người tiêu dùng là gì?","options":{"A":"Niêm yết công khai giá hàng hóa, dịch vụ tại địa điểm kinh doanh, văn phòng dịch vụ.","B":"Niêm yết công khai giá hàng hóa, dịch vụ tại địa điểm kinh doanh, văn phòng dịch vụ khi có đoàn kiểm tra","C":"Chỉ cần chất lượng sản phẩm tốt","D":"Việc niêm yết công khai giá hàng hóa, dịch vụ tại địa điểm kinh doanh, văn phòng dịch vụ là không cần thiết"},"answer":"A"},{"id":71,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":71,"question":"Pháp luật là:","options":{"A":"Hệ thống các văn bản và Nghị định do các cấp ban hành và thực hiện.","B":"Những luật và điều luật cụ thể trong thực tế đời sống","C":"Hệ thống các quy tắc xử sự chung do nhà nước ban hành và được bảo đảm thực hiện bằng quyền lực nhà nước","D":"Hệ thống các quy tắc xử sự được hình thành theo điều kiện cụ thể của từng địa phương"},"answer":"C"},{"id":72,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":72,"question":"Pháp lệnh do cơ quan nào ban hành?","options":{"A":"Uỷ ban Thường vụ Quốc hội","B":"Chính phủ","C":"Quốc hội","D":"Thủ tướng Chính phủ"},"answer":"A"},{"id":73,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":73,"question":"Từ khi thành lập nước Việt Nam dân chủ cộng hòa (nay là nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam) cho đến nay, nước ta có mấy bản Hiến pháp, đó là những bản hiến pháp (HP) nào?","options":{"A":"5 (HP 1946, HP 1959, HP 1980, HP 1992, HP 2013)","B":"4 (HP 1945, HP 1959, HP 1980, HP 1992)","C":"4 (HP 1946, HP 1959, HP 1980, HP 1992)","D":"5 (HP 1945, HP 1959, HP 1980, HP 1992, HP 2013)"},"answer":"A"},{"id":74,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":74,"question":"Bản Hiến pháp mới được Quốc hội nước Cộng hòa xã hội chủ nghĩa Việt Nam thông qua ngày 28/11/2013 (HP 2013) có hiệu lực năm nào?","options":{"A":"2015","B":"2013","C":"2016","D":"2014"},"answer":"D"},{"id":75,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":75,"question":"Thời gian thử việc đối với công việc cần trình độ chuyên môn kỹ thuật trung cấp nghề, trung cấp chuyên nghiệp, công nhân kỹ thuật, nhân viên nghiệp vụ tối đa là:","options":{"A":"06 ngày","B":"60 ngày","C":"30 ngày","D":"Do thỏa thuận giữa người lao động và người sử dụng lao động"},"answer":"C"},{"id":76,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":76,"question":"Khi đơn phương chấm dứt Hợp đồng lao động (xác định thời hạn), người lao động phải báo trước cho người sử dụng lao động:","options":{"A":"45 ngày","B":"30 ngày","C":"03 ngày","D":"Bất cứ lúc nào người lao động muốn nghỉ việc mà không cần báo trước"},"answer":"B"},{"id":77,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":77,"question":"Thời gian thử việc đối với công việc có chức danh nghề cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên tối đa là:","options":{"A":"90 ngày","B":"60 ngày","C":"30 ngày","D":"Do thỏa thuận giữa người lao động và người sử dụng lao động"},"answer":"B"},{"id":78,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":78,"question":"Bảo hiểm xã hội tự nguyện bao gồm các chế độ nào sau đây?","options":{"A":"Ốm đau; Thai sản","B":"Hưu trí, tử tuất","C":"Ốm đau; Thai sản; Tai nạn lao động, bệnh nghề nghiệp; Hưu trí; Tử tuất","D":"Ốm đau; Thai sản; Bệnh nghề nghiệp; Hưu trí; Tử tuất"},"answer":"B"},{"id":79,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":79,"question":"Thế nào là vụ lợi?","options":{"A":"Vụ lợi là hành vi của người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn đó để tham nhũng","B":"Vụ lợi là việc công chức lợi dụng chức vụ, quyền hạn nhằm đạt được lợi ích vật chất hoặc lợi ích phi vật chất không chính đáng","C":"Vụ lợi là việc người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn nhằm đạt được lợi ích vật chất hoặc lợi ích phi vật chất không chính đáng","D":"Vụ lợi là hành vi lợi dụng chức vụ, quyền hạn đó để tham nhũng"},"answer":"C"},{"id":80,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":80,"question":"Người tiêu dùng có quyền :","options":{"A":"Yêu cầu bồi thường thiệt hại khi hàng hóa, dịch vụ không đúng tiêu chuẩn, quy chuẩn kỹ thuật, chất lượng, số lượng mà tổ chức, cá nhân kinh doanh hàng hóa, dịch vụ đã công bố, niêm yết, quảng cáo hoặc cam kết (1)","B":"Dùng vũ lực, đe dọa dùng vũ lực khi hàng hóa không đúng như công bố ban đầu (2)","C":"Có quyền đưa thông tin lên mạng xã hội nhằm mục đích bôi xấu doanh nghiệp (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"A"},{"id":81,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":81,"question":"Hành vi nào sau đây bị cấm theo Luật Bảo vệ người tiêu dùng:","options":{"A":"Tổ chức, cá nhân kinh doanh hàng hóa, dịch vụ không bảo đảm chất lượng gây thiệt hại đến tính mạng, sức khỏe, tài sản của người tiêu dùng","B":"Thương lượng với người tiêu dùng về sản phẩm lỗi","C":"Niêm yết công khai giá hàng hóa, dịch vụ tại địa điểm kinh doanh","D":"Cung cấp giấy bảo hành về sản phẩm cho người tiêu dung"},"answer":"A"},{"id":82,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":82,"question":"Sắp xếp các văn bản gồm: Nghị định, Pháp lệnh, Luật, Chỉ thị theo trật tự thứ bậc trong hệ thống văn bản pháp luật Việt Nam:","options":{"A":"Pháp lệnh – Luật – Nghị định – Chỉ thị","B":"Luật – Pháp lệnh – Nghị định – Chỉ thị","C":"Pháp lệnh – Nghị định – Luật – Chỉ thị","D":"Nghị định – Luật – Pháp lệnh – Chỉ thị"},"answer":"B"},{"id":83,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":83,"question":"Hiến pháp là luật cơ bản của nhà nước có hiệu lực pháp lí cao nhất nên:","options":{"A":"Nội dung của tất cả các văn bản đều phải phù hợp, không được trái luật định","B":"Nội dung của tất cả các văn bản đều phải phù hợp, không được trái quy định","C":"Nội dung của tất cả các văn bản đều phải phù hợp, không được sửa đổi","D":"Nội dung của tất cả các văn bản đều phải phù hợp, không được trái Hiến pháp"},"answer":"D"},{"id":84,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":84,"question":"Xác định các điều kiện lao động có hại không được sử dụng lao động nữ :","options":{"A":"Thợ lặn (1)","B":"Các công việc phải mang vác từ 30 kg trở lên (2)","C":"Khoan thăm dò giếng dầu và khí (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":85,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":85,"question":"Thời hiệu xử lý kỷ luật lao động được quy định như thế nào?","options":{"A":"Tối đa là sáu tháng kể từ ngày xảy ra hành vi vi phạm; trường hợp hành vi vi phạm liên quan trực tiếp đến tài chính, tài sản, tiết lộ bí mật công nghệ, bí mật kinh doanh của người sử dụng lao động thì thời hiệu xử lý kỷ luật lao động tối đa là mười hai tháng.","B":"Tối đa là bốn tháng kể từ ngày xảy ra vi phạm, trường hợp đặc biệt không được quá chín tháng.","C":"Tối đa là năm tháng kể từ ngày xảy ra vi phạm, trường hợp đặc biệt không được quá chín tháng.","D":"Tối đa là sáu tháng, trường hợp khác theo quy định của pháp luật lao động, thời hiệu xử lý kỷ luật lao động tối đa là mười hai tháng."},"answer":"A"},{"id":86,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":86,"question":"Việc hủy bỏ việc đơn phương chấm dứt hợp đồng lao động được quy định như thế nào?","options":{"A":"Mỗi bên có thể hủy bỏ việc đơn phương chấm dứt hợp đồng lao động trước khi hết thời hạn báo trước. Khi hết thời hạn báo trước, mỗi bên đều có quyền chấm dứt hợp đồng lao động (1)","B":"Mỗi bên đều có quyền huỷ bỏ việc đơn phương chấm dứt hợp đồng lao động trước khi hết thời hạn báo trước nhưng phải thông báo bằng văn bản và phải được bên kia đồng ý (2)","C":"Mỗi bên đều có quyền huỷ bỏ việc đơn phương chấm dứt hợp đồng lao động trước khi hết thời hạn báo trước nhưng phải thông báo bằng văn bản (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"B"},{"id":87,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":87,"question":"Khái niệm Phụ lục hợp đồng lao động?","options":{"A":"Phụ lục hợp đồng lao động là một bộ phận của hợp đồng lao động và có hiệu lực như hợp đồng lao động (1)","B":"Phụ lục hợp đồng lao động được xem là bản sao hợp đồng lao động (2)","C":"Phụ lục hợp đồng xem là bản Hợp đồng lao động lần thứ hai (3)","D":"Cả (1), (2) và (3) đều sai"},"answer":"A"},{"id":88,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":88,"question":"Khi tạm thời chuyển người lao động làm việc khác so với hợp đồng lao động, người sử dụng lao động phải thông báo cho người lao động biết trước bao nhiêu ngày?","options":{"A":"Ít nhất 03 ngày làm việc","B":"Ít nhất 05 ngày làm việc","C":"Ít nhất 07 ngày làm việc","D":"Ít nhất 10 ngày làm việc"},"answer":"A"},{"id":89,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":89,"question":"Tác hại của tham nhũng ảnh hưởng tới lĩnh vực nào dưới đây?","options":{"A":"Chính trị","B":"Kinh tế","C":"Xã hội","D":"Chính trị, kinh tế, xã hội"},"answer":"D"},{"id":90,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":90,"question":"Quyết định số 1035/QĐ-TTg của Thủ tướng Chính phủ lấy ngày … hàng năm là Ngày Quyền của người tiêu dùng Việt Nam.","options":{"A":"01/3","B":"08/3","C":"15/3","D":"26/3"},"answer":"C"},{"id":91,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":91,"question":"Nghĩa vụ của người sử dụng lao động khi đơn phương chấm dứt hợp đồng trái pháp luật?","options":{"A":"Phải nhận người lao động trở lại làm việc theo Hợp đồng lao động đã giao kết (1)","B":"Phải trả tiền lương, bảo hiểm xã hội, bảo hiểm y tế trong những ngày người lao động không được làm việc cộng với ít nhất 02 tháng tiền lương theo hợp đồng lao động (2)","C":"Cả (1), (2) đều sai","D":"Cả (1) và (2) đều đúng"},"answer":"D"},{"id":92,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":92,"question":"Loại hợp đồng nào dưới đây không áp dụng thời gian thử việc ?","options":{"A":"Hợp đồng lao động có xác định thời hạn (1)","B":"Hợp đồng lao động không xác định thời hạn (2)","C":"Hợp đồng lao động mùa vụ (3)","D":"Cả (1), (2) và (3) đều sai"},"answer":"C"},{"id":93,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":93,"question":"Xác định hình thức xử lý kỷ luật lao động","options":{"A":"Khiển trách (1)","B":"Kéo dài thời hạn nâng lương không quá 6 tháng ; cách chức (2)","C":"Sa thải (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":94,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":94,"question":"Hợp đồng lao động là sự thỏa thuận giữa người lao động và người sử dụng lao động về:","options":{"A":"Việc làm có trả lương (1)","B":"Điều kiện làm việc (2)","C":"Quyền, nghĩa vụ của mỗi bên trong quan hệ lao động (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":95,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":95,"question":"Người có chức vụ, quyền hạn bao gồm các chủ thể nào sau đây?","options":{"A":"Cán bộ, công chức, viên chức (1)","B":"Sĩ quan, quân nhân chuyên nghiệp, công nhân quốc phòng trong cơ quan, đơn vị thuộc quân đội nhân dân; sĩ quan, hạ sĩ quan nghiệp vụ, sĩ quan, hạ sĩ quan chuyên môn – kỹ thuật trong cơ quan, đơn vị thuộc công an nhân dân (2)","C":"Cán bộ lãnh đạo, quản lý doanh nghiệp của nhà nước; cán bộ lãnh đạo, quản lý là đại diện phần vốn góp của nhà nước tại doanh nghiệp; người được nhà nước giao thực hiện nhiệm vụ, công vụ có quyền hạn trong khi thực hiện nhiệm vụ, công vụ đó (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":96,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":96,"question":"Hành vi nào sau đây không phải là hành vi tham nhũng?","options":{"A":"Tham ô tài sản","B":"Nhận hối lộ; đưa hối lộ, môi giới hối lộ để giải quyết công việc của cơ quan, tổ chức, đơn vị hoặc địa phương vì vụ lợi","C":"Lạm dụng chức vụ, quyền hạn chiếm đoạt tài sản.","D":"Không thực hiện kịp thời trách nhiệm giải trình"},"answer":"D"},{"id":97,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":97,"question":"Trong trường hợp tranh chấp gây thiệt hại đến lợi ích của Nhà nước, lợi ích của nhiều người tiêu dùng, lợi ích công cộng thì:","options":{"A":"Không được thương lượng, hòa giải","B":"Cần lắng nghe từ nhiều phía","C":"Thông qua Tòa án","D":"Thông qua trọng tài"},"answer":"A"},{"id":98,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":98,"question":"Giải quyết tranh chấp phát sinh giữa người tiêu dùng và tổ chức, cá nhân kinh doanh hàng hóa, thông qua:","options":{"A":"Thương lượng (1)","B":"Hòa giải (2)","C":"Tòa án (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":99,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":99,"question":"Hiến pháp 2013 qui định mọi công dân:","options":{"A":"Đủ 18 tuổi trở lên có quyền bầu cử và ứng cử","B":"Đủ 21 tuổi trở lên có quyền bầu cử và ứng cử","C":"Từ 18 đến 21 tuổi có quyền bầu cử và ứng cử","D":"Đủ 18 tuổi có quyền bầu cử, đủ 21 tuổi có quyền ứng cử"},"answer":"D"},{"id":100,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":100,"question":"Chọn đáp án đúng:","options":{"A":"Mọi người phạm tội đều bình đẳng trước pháp luật, không phân biệt giới tính, dân tộc, tín ngưỡng, tôn giáo, thành phần, địa vị xã hội","B":"Mọi người phạm tội đều bình đẳng trước pháp luật, không phân biệt giới tính, tín ngưỡng, tôn giáo, thành phần, địa vị xã hội.","C":"Mọi người phạm tội đều bình đẳng trước pháp luật, không phân biệt giới tính, dân tộc, thành phần, địa vị xã hội.","D":"Mọi người phạm tội đều bình đẳng trước pháp luật, không phân biệt giới tính, dân tộc, tín ngưỡng, thành phần, địa vị xã hội"},"answer":"A"},{"id":101,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":101,"question":"Bà T đang ở nhà thì có người nhân viên tiếp thị đến chào mời mua một loại sản phẩm lọc nước sau một hồi quảng cáo mà bà T không mua người nhân viên chuyển sang “hù dọa” rằng nếu không lọc nước sẽ ảnh hưởng đến sức khỏe có thể gây chết người. Hành vi của người nhân viên đó được gọi là gì?","options":{"A":"Thực hiện theo quy định của công ty","B":"Kỹ năng bán hàng","C":"Quấy rối người tiêu dùng","D":"Quấy rối khách hàng"},"answer":"C"},{"id":102,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":102,"question":"Công khai, minh bạch trong hoạt động của cơ quan, tổ chức, đơn vị nhằm mục đích nào sau đây?","options":{"A":"Tạo điều kiện để người dân cũng như toàn xã hội tham gia giám sát hoạt động của các cơ quan nhà nước (1)","B":"Để tránh che dấu, tẩu tán tài sản tham nhũng, ngoài việc kê khai tài sản của bản thân, cán bộ, công chức còn phải kê khai tài sản của vợ hoặc chồng và con chưa thành niên (2)","C":"Xây dựng và thực hiện các chế độ, định mức, tiêu chuẩn (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"A"},{"id":103,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":103,"question":"Khi phát hiện hàng hóa, dịch vụ lưu hành trên thị trường không bảo đảm an toàn, gây thiệt hại hoặc đe dọa gây thiệt hại đến tính mạng, sức khỏe, tài sản của người tiêu dùng; hành vi của tổ chức, cá nhân kinh doanh hàng hóa, dịch vụ xâm phạm đến quyền, lợi ích hợp pháp của người tiêu dùng. Người tiêu dùng có nghĩa vụ gì?","options":{"A":"Cần cẩn thận khi mua, sử dụng hàng hóa, dịch vụ","B":"May quá, mình không mua phải hàng hóa, dịch vụ đó","C":"Báo cho những người thân của mình tránh mua hàng hóa, dịch vụ đó","D":"Thông tin cho cơ quan nhà nước, tổ chức, cá nhân có liên quan"},"answer":"D"},{"id":104,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":104,"question":"Khi có tranh chấp phát sinh giữa người tiêu dùng và tổ chức, cá nhân kinh doanh hàng hóa, dịch vụ được giải quyết thông qua:","options":{"A":"Thương lượng; Hòa giải","B":"Hòa giải;","C":"Trọng tài; Tòa án","D":"Thương lượng; Hòa giải; Trọng tài; Tòa án"},"answer":"D"},{"id":105,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":105,"question":"Nhà nước thực hiện chức năng của mình thông qua các hình thức hoạt động như thế nào?","options":{"A":"Chỉ thông qua hoạt động xây dựng và ban hành pháp luật (hoạt động lập pháp)","B":"Chỉ thông qua hoạt động tổ chức thực hiện pháp luật (hoạt động hành pháp).","C":"Chỉ thông qua hoạt động bảo vệ pháp luật (hoạt động tư pháp)","D":"Phải thông qua cả ba hình thức hoạt động lập pháp, hành pháp và tư pháp."},"answer":"D"},{"id":106,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":106,"question":"Cơ quan cấp Bộ có quyền ban hành văn bản quy phạm pháp luật nào sau đây?","options":{"A":"Luật Giáo dục","B":"Nghị định","C":"Thông tư","D":"Nghị quyết"},"answer":"C"},{"id":107,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":107,"question":"Nhận định nào sau đây là đúng?","options":{"A":"Cứ 18 tuổi là người thành niên","B":"Tất cả những người thành niên đều có năng lực hành vi dân sự đầy đủ","C":"Người thành niên là người đủ 18 tuổi trở lên","D":"Những người trong độ tuổi thanh niên"},"answer":"C"},{"id":108,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":108,"question":"Hãy chỉ ra nhận định sai?","options":{"A":"Con sinh ra mặc nhiên phải theo họ cha. Chỉ được theo họ mẹ khi chưa xác định được cha đẻ của đứa bé.","B":"Việc thay đổi tên cho người từ đủ chín tuổi trở lên phải có sự đồng ý của người đó.","C":"Cá nhân có quyền có họ, tên ( bao gồm cả chữ đệm, nếu có). Họ, tên của một người được xác định theo họ, tên khai sinh của người đó","D":"Cá nhân có quyền có quốc tịch"},"answer":"A"},{"id":109,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":109,"question":"Vợ chồng đã ly hôn muốn xác lập lại quan hệ vợ chồng thì:","options":{"A":"Phải đăng ký kết hôn","B":"Không cần đăng ký","C":"Mời họ hàng hai bên là đủ","D":"Không đăng ký nhưng phải báo cho Ủy ban nhân đân nơi cư trú"},"answer":"A"},{"id":110,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":110,"question":"Biểu hiện của bình đẳng trong hôn nhân là:","options":{"A":"Người chồng phải giữ vai trò chính trong đóng góp về kinh tế và quyết định công việc lớn trong gia đình (1)","B":"Công việc của người vợ là nội trợ gia đình và chăm sóc con cái, quyết định các khoản chi tiêu hàng ngày của gia đình (2)","C":"Vợ chồng cùng bàn bạc, tôn trọng ý kiến của nhau trong việc quyết định các công việc của gia đình (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"C"},{"id":111,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":111,"question":"Khi yêu cầu người vợ phải nghỉ việc để chăm sóc gia đình, người chồng đã vi phạm quyền bình đẳng giữa vợ và chồng trong quan hệ:","options":{"A":"Nhân thân","B":"Tài sản chung","C":"Tài sản riêng","D":"Tình cảm"},"answer":"A"},{"id":112,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":112,"question":"Người nào sau đây không được quyền hưởng di sản?","options":{"A":"Người dưới 18 tuổi","B":"Người bị bệnh tâm thần","C":"Người bị tạm giam","D":"Người vi phạm nghiêm trọng nghĩa vụ nuôi dưỡng người để lại di sản"},"answer":"D"},{"id":113,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":113,"question":"Sau khi ly hôn 4 tháng với anh A, chị B sinh cháu M. Vì ở cùng xóm , anh A thường xuyên đến nhà để xin được gặp con nhưng đều bị chị B từ chối. Chị B cho rằng cháu M sinh ra khi hai người ly hôn. Giấy khai sinh của con chị không có tên anh A nên anh không có quyền gặp, chăm sóc cháu M và con chị cũng không liên quan đến anh A. Nhận định nào sau đây đúng?","options":{"A":"Anh A không có quyền đến thăm con","B":"Anh A có quyền xác nhận con của mình","C":"Chị B có quyền không cho anh A thăm con","D":"Chị B đã vi phạm luật hôn nhân"},"answer":"B"},{"id":114,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":114,"question":"Ông Kha có hai người con, người con đầu tên Lâm là con chung với vợ trước (đã mất), người con sau tên Tân năm nay 09 tuổi là con chung với bà Hà (có đăng ký kết hôn hợp pháp). Khi biết mình bi bệnh nặng khó qua khỏi ông Kha đã đến Ủy ban nhân dân xã lập di chúc để lại căn nhà ( thuộc tài sản riêng của ông Kha) mà các thành viên đang ở cho Lâm. Sau khi ông Kha chết, Lâm có ý định đuổi mẹ kế và em trai mình ra khỏi nhà, vì cho rằng theo di chúc, căn nhà hiện thuộc sở hữu của mình. Xác định người thừa kế của ông Kha:","options":{"A":"Lâm","B":"Lâm, Tân","C":"Lâm, bà Hà","D":"Lâm, bà Hà, Tân"},"answer":"D"},{"id":115,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":115,"question":"Nơi cư trú của cá nhân là:","options":{"A":"Nơi người đó thường xuyên sinh sống","B":"Nơi người đó ở mỗi khi đi công tác","C":"Nơi cư trú của cha mẹ","D":"Nơi người đó tạm trú"},"answer":"A"},{"id":116,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":116,"question":"Chị Mai muốn nhận Nam làm con nuôi, theo quy định của pháp luật chị Mai phải thỏa mãn một trong các điều kiện sau :","options":{"A":"Chị Mai phải từ 20 tuổi trở lên","B":"Chị Mai chỉ cần nộp căn cước công dân và giấy tờ tùy thân của mình","C":"Chị Mai chỉ cần sự chứng kiến của cơ quan nhà nước thì có thể nhận Nam làm con nuôi","D":"Chị Mai phải từ 22 tuổi trở lên"},"answer":"A"},{"id":117,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":117,"question":"Chị Mai có chồng là anh Nam, bạn của chị Mai có gửi cho chị một bì thư và 50.000.000 đồng với nội dung như sau: “ Mến tặng vợ chồng bạn, chúc hai bạn nhanh chóng qua khỏi thời kỳ khó khăn này” Số tiền trên là:","options":{"A":"Tài sản chung của chị Mai và anh Nam (1)","B":"Tài sản riêng của chị Mai (2)","C":"Tài sản được chia làm hai theo quy định của pháp luật (3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"A"},{"id":118,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":118,"question":"Trường hợp con của người để lại di sản chết trước hoặc cùng một thời điểm với người để lại di sản thì cháu được hưởng phần di sản mà cha hoặc mẹ của cháu được hưởng nếu còn sống gọi là:","options":{"A":"Thừa kế kế tiếp","B":"Thừa kế bù đắp","C":"Thừa kế thế vị","D":"Thừa kế ngôi vị"},"answer":"C"},{"id":119,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":119,"question":"Trong trường hợp vì lý do kinh tế mà nhiều người lao động có nguy cơ mất việc làm, phải thôi việc thì người sử dụng lao động có trách nhiệm xây dựng phương án sử dụng lao động như thế nào?","options":{"A":"Danh sách và số lượng người lao động tiếp tục được sử dụng, người lao động đưa đi đào tạo lại để tiếp tục sử dụng; Danh sách và số lượng người lao động nghỉ hưu; Danh sách và số lượng người lao động được chuyển sang làm việc không trọn thời gian; người lao động phải chấm dứt hợp đồng lao động. (1)","B":"Biện pháp và nguồn tài chính bảo đảm thực hiện phương án. (2)","C":"Khi xây dựng phương án sử dụng lao động phải có sự tham gia của tổ chức đại diện tập thể lao động tại cơ sở.(3)","D":"Cả (1), (2) và (3) đều đúng"},"answer":"D"},{"id":120,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":120,"question":"Trong khi nghiên cứu hồ sơ vụ án A phạm tội tham ô tài sản. K là kiểm sát viên thụ lý vụ án đã yêu cầu người nhà bị can nộp 100 triệu đồng để K làm nhẹ tội cho A. Sau khi nhận đủ số tiền của gia đình A, K đã hủy 3 trong số 6 chi phiếu giả mà A dùng để rút tiền của nhà nước ra khỏi hồ sơ vụ án. Do thiếu chứng cứ nên tòa án tuyên phạt A hình phạt của loại tội phạm nhẹ hơn. K thực hiện những hành vi nào?","options":{"A":"Lợi dụng chức vụ quyền hạn để bao che cho người có hành vi vi phạm pháp luật vì vụ lợi; cản trở, can thiệp trái pháp luật vào việc kiểm tra, thanh tra, kiểm toán, điều tra, truy tố, xét xử, thi hành án vì vụ lợi","B":"Nhũng nhiễu vì vụ lợi","C":"Không thực hiện nhiệm vụ, công vụ vì vụ lợi","D":"Lợi dụng chức vụ, quyền hạn trong khi thi hành nhiệm vụ, công vụ vì vụ lợi"},"answer":"A"},{"id":121,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":121,"question":"Người lao động làm việc theo ca được nghỉ ít nhất ….. trước khi chuyển sang ca làm việc khác","options":{"A":"6 giờ","B":"12 giờ","C":"24 giờ","D":"36 giờ"},"answer":"B"},{"id":122,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":122,"question":"Cơ quan quản lý nhà nước trong bộ máy Nhà nước Việt Nam hiện nay gồm:","options":{"A":"Tòa án nhân dân và Viện kiểm sát nhân dân các cấp.","B":"Chính phủ và Ủy ban nhân dân các cấp.","C":"Tất cả các cơ quan nhà nước.","D":"Quốc hội và Hội đồng nhân dân các cấp"},"answer":"B"},{"id":123,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":123,"question":"Ở Việt Nam hiện nay, chủ quyền quốc gia do:","options":{"A":"Cả hệ thống chính trị cùng nắm giữ và thực hiện.","B":"Đảng cộng sản Việt Nam nắm giữ và thực hiện.","C":"Toàn thể xã hội nắm giữ và thực hiện.","D":"Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam nắm giữ và thực hiện"},"answer":"D"},{"id":124,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":124,"question":"Nhà nước là:","options":{"A":"Tổ chức của toàn thể nhân dân.","B":"Một tổ chức chính trị đặc biệt","C":"Tổ chức quyền lực công đặc biệt.","D":"Một tổ chức chính trị - xã hội."},"answer":"C"},{"id":125,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":125,"question":"Ở Việt Nam hiện nay, quyền lực nhà nước là:","options":{"A":"Do kế thừa từ các kiểu nhà nước trong lịch sử.","B":"Thuộc về nhân dân, nhân dân thực hiện quyền lực nhà nước thông qua các cơ quan quyền lực nhà nước do dân bầu.","C":"Quyền lực tự nhiên, mặc nhiên thuộc về cơ quan nhà nước khi họ lên nắm quyền quản lý xã hội.","D":"Quyền lực của các nhân viên và cơ quan nhà nước từ trung ương đến địa phương."},"answer":"B"},{"id":126,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":126,"question":"Nội dung không thuộc đặc điểm của văn bản quy phạm pháp luật là:","options":{"A":"Văn bản chỉ chứa đựng những quy phạm pháp luật do nhà nước ban hành mới.","B":"Văn bản do các cơ quan nhà nước hoặc cá nhân có thẩm quyền ban hành pháp luật ban hành theo một trình tự thủ tục nhất định.","C":"Văn bản có chứa đựng các quy phạm được nhà nước bảo đảm thực hiện.","D":"Được thực hiện nhiều lần trong thực tế cuộc sống."},"answer":"A"},{"id":127,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":127,"question":"Nhận định đúng vể vị trí của cơ quan Ủy ban nhân dân:","options":{"A":"Là cơ quan tư pháp ở địa phương.","B":"Là cơ quan quyền lực nhà nước ở địa phương.","C":"Là cơ quan quản lý nhà nước ở địa phương.","D":"Là cơ quan lập pháp ở địa phương."},"answer":"C"},{"id":128,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":128,"question":"Pháp luật là:","options":{"A":"Các quy định bắt buộc phải thực hiện trong một cộng đồng dân cư nhất định.","B":"Hệ thống các quy tắc xử sự chung do nhà nước ban hành và bảo đảm thực hiện.","C":"Hệ thống các quy định do Chính phủ ban hành.","D":"Hệ thống các quy tắc xử sự do xã hội cùng ban hành và thực hiện."},"answer":"B"},{"id":129,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":129,"question":"Chọn phương án đúng nhất trong các phương án sau:","options":{"A":"Luật Hiến pháp điều chỉnh những quan hệ xã hội quan trọng nhất trong một số lĩnh vực của đời sống XH.","B":"Luật Hiến pháp điều chỉnh các quan hệ XH liên quan đến mọi lĩnh vực khác nhau của đời sống XH.","C":"Luật Hiến pháp điều chỉnh những quan hệ XH quan trọng nhất có liên quan đến các lĩnh vực khác nhau của đời sống XH."},"answer":"C"},{"id":130,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":130,"question":"Chọn phương án đúng nhất trong các phương án sau:","options":{"A":"Theo Hiến pháp 2013, đất đai là tài sản thuộc sở hữu Nhà nước và sở hữu tư nhân","B":"Theo Hiến pháp 2013, đất đai là tài sản thuộc sở hữu tư nhân.","C":"Theo Hiến pháp 2013 đất đai là tài sản công thuộc sử hữu toàn dân"},"answer":"C"},{"id":131,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":131,"question":"Chọn phương án đúng nhất trong các phương án sau:","options":{"A":"Theo Hiến Pháp 2013, Quốc hội là cơ quan duy nhất có quyền lập hiến","B":"Theo Hiến Pháp 2013, Quốc hội là cơ quan có quyền lập pháp, lập hiến","C":"Theo Hiến Pháp 2013, Quốc hội là cơ quan duy nhất có quyền lập pháp"},"answer":"B"},{"id":132,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":132,"question":"Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là","options":{"A":"Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân.","B":"Nhà nước pháp quyền của Nhân dân, do Nhân dân, vì Nhân dân.","C":"Nhà nước pháp quyền xã hội chủ nghĩa của dân, do dân, vì dân."},"answer":"A"},{"id":133,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":133,"question":"Chọn đáp án đúng","options":{"A":"Quyền con người, quyền công dân chỉ có thể bị hạn chế theo quy định của pháp luật trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe của cộng đồng.","B":"Quyền con người chỉ có thể bị hạn chế theo quy định của luật trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe của cộng đồng.","C":"Quyền con người, quyền công dân chỉ có thể bị hạn chế theo quy định của luật trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe của cộng đồng."},"answer":"C"},{"id":134,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":134,"question":"Chọn đáp án đúng","options":{"A":"Công dân từ mười tám tuổi trở lên có quyền bầu cử và từ hai mươi mốt tuổi trở lên có quyền ứng cử vào Quốc hội, Hội đồng nhân dân.","B":"Công dân đủ mười tám tuổi trở lên có quyền bầu cử và đủ hai mươi mốt tuổi trở lên có quyền ứng cử vào Quốc hội, Hội đồng nhân dân.","C":"Công dân từ đủ mười tám tuổi trở lên có quyền bầu cử và từ đủ hai mươi mốt tuổi trở lên có quyền ứng cử vào Quốc hội, Hội đồng nhân dân."},"answer":"B"},{"id":135,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":135,"question":"Công dân đủ bao nhiêu tuổi trở lên có quyền biểu quyết khi Nhà nước tổ chức trưng cầu ý dân.","options":{"A":"17","B":"18","C":"19","D":"20"},"answer":"B"},{"id":136,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":136,"question":"Trong trường hợp Quốc hội không thể họp được thì cơ quan nào có thẩm quyền Quyết định việc tuyên bố tình trạng chiến tranh","options":{"A":"Quốc hội","B":"Ủy ban thường vụ Quốc hội","C":"Chính phủ","D":"Bộ Quốc phòng"},"answer":"B"},{"id":137,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":137,"question":"Cơ quan đại biểu cao nhất của Nhân dân là","options":{"A":"Quốc hội","B":"Chính phủ","C":"Ủy ban Mặt trận Tổ quốc Việt Nam"},"answer":"A"},{"id":138,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":138,"question":"Chủ tịch nước do cơ quan nào bầu","options":{"A":"Quốc hội","B":"Chính phủ","C":"Ủy ban trung ương mặt trận Tổ quốc Việt Nam"},"answer":"A"},{"id":139,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":139,"question":"Người sử dụng lao động không được sử dụng lao động chưa thành niên làm những công việc nặng nhọc, độc hại.","options":{"A":"Sai","B":"Đúng"},"answer":"B"},{"id":140,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":140,"question":"Trong trường hợp nào người sử dụng lao động được đơn phương chấm dứt hợp đồng lao động","options":{"A":"Người lao động thường xuyên không hoàn thành công việc theo hợp đồng","B":"Người lao động bị tạm giam, tạm giữ","C":"Người lao động đi nghĩa vụ quân sự","D":"Tất cả đều đúng"},"answer":"A"},{"id":141,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":141,"question":"Người lao động và người sử dụng lao động phải ký hợp đồng thử việc trước khi làm việc chính thức","options":{"A":"Sai","B":"Đúng"},"answer":"A"},{"id":142,"lesson":1,"lessonTitle":"Đề cương Pháp luật 1","lessonQ":142,"question":"Việc xử lý kỷ luật lao động bị coi là trái pháp luật nếu vắng mặt đương sự.","options":{"A":"Sai","B":"Đúng"},"answer":"A"},{"id":143,"lesson":1,"lessonTitle":"Đề cương Pháp luậ "answer":"A"},{"id":204,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":19,"question":"Đề nghị giao kết hợp đồng không chấm dứt trong trường hợp nào dưới đây?","options":{"A":"Bên được đề nghị chấp nhận giao kết hợp đồng","B":"Bên được đề nghị trả lời không chấp nhận","C":"Hết thời hạn trả lời chấp nhận","D":"Khi chưa hết thời hạn trả lời chấp nhận"},"answer":"D"},{"id":205,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":20,"question":"Địa điểm giao kết hợp đồng do bên nào đưa ra?","options":{"A":"Do bên có quyền quyết định","B":"Do các bên thỏa thuận","C":"Nơi cư trú của cá nhân hoặc trụ sở của pháp nhân đưa ra đề nghị giao kết","D":"Do bên đưa ra đề nghị giao kết quyết định"},"answer":"B"},{"id":206,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":21,"question":"Hiệu lực của hợp đồng hợp đồng có hiệu lực từ khi nào?","options":{"A":"Từ khi thanh toán cho bên có quyền","B":"Từ thời điểm giao kết, trừ trường hợp có thỏa thuận khác hoặc luật có quy định","C":"Từ thời điểm các bên thỏa thuận","D":"Từ khi bên được đề nghị chấp nhận giao kết hợp đồng"},"answer":"B"},{"id":207,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":22,"question":"Hình thức giao dịch dân sự là gì?","options":{"A":"Lời nói, văn bản","B":"Lời nói, hành vi cụ thể","C":"Giao dịch bằng mọi hình thức đều được","D":"Lời nói, văn bản hoặc hành vi cụ thể"},"answer":"D"},{"id":208,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":23,"question":"Người đại diện trong dân sự bao gồm?","options":{"A":"Đại diện theo pháp luật","B":"Đại diện theo ủy quyền","C":"Đại diện theo pháp luật và đại diện ủy quyền","D":"Đại diện theo sự chỉ định của Tòa án"},"answer":"C"},{"id":209,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":24,"question":"Về tài sản chung thì vợ chồng có quyền?","options":{"A":"Vợ chồng có thể thỏa thuận hoặc ủy quyền cho nhau chiếm hữu, sử dụng, định đoạt, tài sản chung","B":"Vợ chồng chỉ có thể thỏa thuận về sử dụng các tài sản chung","C":"K ử tình"},"answer":"B"},{"id":221,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":36,"question":"Hành vi lợi dụng tình hình khan hiếm hoặc tạo ra sự khan hiếm giả tạo trong tình hình thiên tai, dịch bệnh, chiến tranh hoặc tình hình khó khăn về kinh tế mua vét hàng hóa thuộc danh mục mặt hàng bình ổn giá phạm tội gì?","options":{"A":"Tội vi phạm quy định về cung ứng","B":"Tội lừa dối khách hàng","C":"Tội đầu cơ","D":"Tội quảng cáo gian dối"},"answer":"C"},{"id":222,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":37,"question":"Hành vi bịa đặt hoặc loan truyền những điều biết rõ là sai sự thật nhằm xúc phạm nghiêm trọng nhân phẩm, danh dự hoặc gây thiệt hại đến quyền, lợi ích hợp pháp của người khác phạm vào tội gì?","options":{"A":"Tội vu khống","B":"Tội làm nhục người khác","C":"Tội bịa đặt người khác phạm tội","D":"Tội cung cấp thông tin sai sự thật"},"answer":"A"},{"id":223,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":38,"question":"Người nào dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản thì phạm tội gì?","options":{"A":"Tội cưỡng đoạt tài sản","B":"Tội cướp giật tài sản","C":"Tội công nhiên chiếm đoạt tài sản","D":"Tội cướp tài sản"},"answer":"D"},{"id":224,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":39,"question":"Đâu là hành vi tội cưỡng đoạt tài sản?","options":{"A":"đe dọa sẽ dùng vũ lực hoặc có thủ đoạn khác uy hiếp tinh thần người khác nhằm chiếm đoạt tài sản","B":"công nhiên chiếm đoạt tài sản của người khác","C":"dùng vũ lực, đe dọa dùng vũ lực ngay tức khắc hoặc có hành vi khác làm cho người bị tấn công lâm vào tình trạng không thể chống cự được nhằm chiếm đoạt tài sản","D":"bắt cóc người khác làm con tin nhằm chiếm đoạt tài sản"},"answer":"A"},{"id":225,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":40,"question":"Người nào cướp giật tài sản của người khác thì phạm tội gì?","options":{"A":"Tội cướp tài sản","B":"Tội giật tài sản","C":"Tội cướp giật tài sản","D":"Tội cưỡng đoạt tài sản"},"answer":"C"},{"id":226,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":41,"question":"Người nào trong khi thi hành công vụ mà làm chết người do dùng vũ lực ngoài những trường hợp pháp luật cho phép thì phạm tội gì?","options":{"A":"Tội vô ý làm chết người do vi phạm quy tắc nghề nghiệp hoặc quy tắc hành chính","B":"Tội giết người trong trạng thái tinh thần bị kích động mạnh","C":"Tội làm chết người trong khi thi hành công vụ","D":"Tội vô ý làm chết người"},"answer":"C"},{"id":227,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":42,"question":"Người nào đối xử tàn ác, thường xuyên ức hiếp, ngược đãi hoặc làm nhục người lệ thuộc mình làm người đó tự sát thì phạm tội gì?","options":{"A":"Tội bức tử","B":"Tội xúi giục người khác tự sát","C":"Tội đe dọa giết người","D":"Tội vô ý làm chết người"},"answer":"A"},{"id":228,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":43,"question":"Người nào dùng mọi thủ đoạn khiến người lệ thuộc mình hoặc người đang ở trong tình trạng quẫn bách phải miễn cưỡng giao cấu hoặc miễn cưỡng thực hiện hành vi quan hệ tình dục khác thì phạm tội gì?","options":{"A":"Tội làm nhục người khác","B":"Tội cưỡng dâm","C":"Tội hiếp dâm","D":"Tội dâm ô"},"answer":"B"},{"id":229,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":44,"question":"Người nào dùng vũ lực, đe dọa dùng vũ lực hoặc lợi dụng tình trạng không thể tự vệ được của nạn nhân hoặc thủ đoạn khác giao cấu hoặc thực hiện hành vi quan hệ tình dục khác trái với ý muốn của nạn nhân thì phạm tội gì?","options":{"A":"Tội làm nhục người khác","B":"Tội cưỡng dâm","C":"Tội hiếp dâm","D":"Tội dâm ô"},"answer":"C"},{"id":230,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":45,"question":"Mức hình phạt cao nhất của tội phản bội tổ quốc là?","options":{"A":"20 năm tù","B":"30 năm tù","C":"chung thân","D":"tử hình"},"answer":"D"},{"id":231,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":46,"question":"Nhận định nào sau đây KHÔNG đúng?","options":{"A":"Được phép xử phạt tù chung thân hoặc tử hình đối với người dưới 18 tuổi phạm tội đặc biệt nghiêm trọng","B":"Tòa án chỉ áp dụng hình phạt tù có thời hạn đối với người dưới 18 tuổi phạm tội khi xét thấy các hình phạt và biện pháp giáo dục khác không có tác dụng răn đe, phòng ngừa","C":"Việc khiển trách đối với người dưới 18 tuổi phạm tội phải có sự chứng kiến của cha mẹ hoặc người đại diện hợp pháp của người dưới 18 tuổi.","D":"Án đã tuyên đối với người chưa đủ 16 tuổi phạm tội, thì không tính để xác định tái phạm hoặc tái phạm nguy hiểm."},"answer":"A"},{"id":232,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":47,"question":"Đối với người từ đủ 16 tuổi đến dưới 18 tuổi khi phạm tội, nếu điều luật được áp dụng quy định hình phạt tù chung thân hoặc tử hình, thì mức hình phạt cao nhất được áp dụng không quá bao nhiêu năm tù?","options":{"A":"18 năm","B":"20 năm","C":"25 năm","D":"30 năm"},"answer":"A"},{"id":233,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":48,"question":"Đối với người từ đủ 14 tuổi đến dưới 16 tuổi khi phạm tội, nếu điều luật được áp dụng quy định hình phạt tù chung thân hoặc tử hình, thì mức hình phạt cao nhất được áp dụng không quá bao nhiêu năm tù?","options":{"A":"10 năm","B":"12 năm","C":"15 năm","D":"18 năm"},"answer":"B"},{"id":234,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":49,"question":"Không áp dụng hình phạt tử hình đối với đối tượng nào sau đây?","options":{"A":"người dưới 18 tuổi","B":"phụ nữ có thai","C":"phụ nữ đang nuôi con dưới 36 tháng tuổi","D":"Tất cả phương án trên đều đúng."},"answer":"D"},{"id":235,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":50,"question":"Các tình tiết sau đây là tình tiết giảm nhẹ trách nhiệm hình sự?","options":{"A":"Người phạm tội đã ngăn chặn hoặc làm giảm bớt tác hại của tội phạm","B":"Người phạm tội bị buộc sửa chữa, bồi thường thiệt hại hoặc khắc phục hậu quả","C":"Phạm tội trong trường hợp phòng vệ chính đáng","D":"Phạm tội lần đầu và thuộc trường hợp nghiêm trọng"},"answer":"A"},{"id":236,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":51,"question":"Hình phạt nào không tổng hợp với các loại hình phạt khác?","options":{"A":"Trục xuất","B":"Cải tạo không giam giữ","C":"Tù có thời hạn","D":"Chung thân"},"answer":"A"},{"id":237,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":52,"question":"Người bị kết án được miễn chấp hành hình phạt khi?","options":{"A":"được đặc xá hoặc đại xá","B":"Sau khi bị kết án đã lập công","C":"Mắc bệnh hiểm nghèo","D":"Chấp hành tốt pháp luật, có hoàn cảnh gia đình đặc biệt khó khăn và xét thấy người đó không còn nguy hiểm cho xã hội nữa"},"answer":"A"},{"id":238,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":53,"question":"Đâu là điều kiện hưởng án treo?","options":{"A":"Khi xử phạt tù không quá 03 năm","B":"Người bị kết án có lý do đáng được khoan hồng thêm như đã lập công","C":"Người đã quá già yếu hoặc mắc bệnh hiểm nghèo","D":"Căn cứ vào các tình tiết tăng nặng"},"answer":"A"},{"id":239,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":54,"question":"Người bị xử phạt tù có thể được hoãn chấp hành hình phạt trong các trường hợp sau đây?","options":{"A":"Bị bệnh nặng thì được hoãn cho đến khi sức khỏe được hồi phục","B":"Phụ nữ có thai hoặc đang nuôi con dưới 36 tháng tuổi, thì được hoãn cho đến khi con đủ 36 tháng tuổi","C":"Là người lao động duy nhất trong gia đình, nếu phải chấp hành hình phạt tù thì gia đình sẽ gặp khó khăn đặc biệt, được hoãn đến 01 năm, trừ trường hợp người đó bị kết án về các tội xâm phạm an ninh quốc gia hoặc các tội khác là tội phạm rất nghiêm trọng, tội phạm đặc biệt nghiêm trọng","D":"Tất cả các trường hợp trên"},"answer":"D"},{"id":240,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":55,"question":"Hình phạt nào có thể là hình phạt chính cũng có thể là hình phạt bổ sung?","options":{"A":"Phạt tiền","B":"Cấm cư trú","C":"Tịch thu tài sản","D":"Cảnh cáo"},"answer":"A"},{"id":241,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":56,"question":"Hình phạt chính đối với pháp nhân thương mại phạm tội bao gồm?","options":{"A":"Cấm huy động vốn","B":"Cấm kinh doanh","C":"Đình chỉ hoạt động có thời hạn","D":"Cấm hoạt động trong một số lĩnh vực nhất định"},"answer":"C"},{"id":242,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":57,"question":"Cơ quan nào có trách nhiệm giám sát, giáo dục người cải tạo không giam giữ?","options":{"A":"Gia đình","B":"Tòa án địa phương","C":"UBND xã","D":"Trưởng thôn, ấp"},"answer":"C"},{"id":243,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":58,"question":"Tù có thời hạn đối với người phạm một tội có mức tối thiểu là?","options":{"A":"03 tháng","B":"06 tháng","C":"1 năm","D":"2 năm"},"answer":"A"},{"id":244,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":59,"question":"Tuổi chịu trách nhiệm hình sự về mọi loại tội phạm là bao nhiêu?","options":{"A":"Từ 16 tuổi trở lên","B":"Từ 15 tuổi trở lên","C":"Người từ đủ 16 tuổi trở lên trừ những tội phạm mà Bộ luật hình sự có quy định khác","D":"Tất cả phương án trên đều sai."},"answer":"C"},{"id":245,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":60,"question":"Người phạm tội trong tình trạng mất khả năng nhận thức hoặc khả năng điều khiển hành vi của mình do dùng rượu, bia hoặc chất kích thích mạnh khác có phải chịu trách nhiệm hình sự không?","options":{"A":"vẫn phải chịu trách nhiệm hình sự","B":"không phải chịu trách nhiệm hình sự","C":"Tùy trường hợp"},"answer":"A"},{"id":246,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":61,"question":"Đâu là hành vi được xem là chuẩn bị phạm tội là?","options":{"A":"tìm kiếm phương tiện để thực hiện tội phạm","B":"thực hiện hành vi phạm tội nhưng chưa thành","C":"Đang thực hiện hành vi thì bị phát hiện","D":"đang phạm tội thì dừng tay"},"answer":"A"},{"id":247,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":62,"question":"Phạm tội chưa đạt là gì?","options":{"A":"Phạm tội chưa đạt là vô ý thực hiện tội phạm nhưng không thành vì những nguyên nhân ngoài ý muốn của người phạm tội","B":"Phạm tội chưa đạt là cố ý thực hiện tội phạm nhưng không thực hiện được đến cùng vì những nguyên nhân ngoài ý muốn của người phạm tội","C":"là tự mình không thực hiện tội phạm đến cùng, tuy không có gì ngăn cản","D":"là thực hiện xong hành vi phạm tội nhưng hậu quả gây ra không nghiêm trọng"},"answer":"B"},{"id":248,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":63,"question":"Đồng phạm là gì?","options":{"A":"trường hợp có hai người trở lên cố ý cùng thực hiện một tội phạm.","B":"người chủ mưu, cầm đầu, chỉ huy việc thực hiện tội phạm.","C":"người tạo điều kiện tinh thần hoặc vật chất cho việc thực hiện tội phạm.","D":"người kích động, dụ dỗ, thúc đẩy người khác thực hiện tội phạm."},"answer":"A"},{"id":249,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":64,"question":"Người đồng phạm bao gồm?","options":{"A":"người tổ chức, người thực hành, người xúi giục, người giúp sức","B":"người tổ chức, người thực hành, người xúi giục","C":"người tính kế, người thực hành, người xúi giục, người giúp sức","D":"người tính kế. người tiến hành, người xúi giục, người giúp sức"},"answer":"A"},{"id":250,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":65,"question":"Người nào không hứa hẹn trước, nhưng sau khi biết tội phạm được thực hiện đã che giấu người phạm tội, dấu vết, tang vật của tội phạm hoặc có hành vi khác cản trở việc phát hiện, điều tra, xử lý người phạm tội, thì phải chịu trách nhiệm hình sự về tội?","options":{"A":"không tố giác tội phạm","B":"bao che tội phạm","C":"đồng phạm","D":"che giấu tội phạm"},"answer":"D"},{"id":251,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":66,"question":"Trường hợp nào sau đây không thuộc loại trường hợp loại trừ trách nhiệm hình sự?","options":{"A":"Người thực hiện hành vi gây hậu quả nguy hại cho xã hội trong trường hợp không thể thấy trước hoặc không buộc phải thấy trước hậu quả của hành vi đó","B":"che giấu tội phạm là ông, bà, cha, mẹ, con, cháu, anh chị em ruột, vợ hoặc chồng của người phạm tội","C":"Người thực hiện hành vi nguy hiểm cho xã hội trong khi đang mắc bệnh tâm thần, một bệnh khác làm mất khả năng nhận thức hoặc khả năng điều khiển hành vi của mình","D":"hành vi của người vì bảo vệ quyền hoặc lợi ích chính đáng của mình, của người khác hoặc lợi ích của Nhà nước, của cơ quan, tổ chức mà chống trả lại một cách cần thiết người đang có hành vi xâm phạm các lợi ích nói trên"},"answer":"B"},{"id":252,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":67,"question":"Hành vi của người vì bảo vệ quyền hoặc lợi ích chính đáng của mình, của người khác hoặc lợi ích của Nhà nước, của cơ quan, tổ chức mà chống trả lại một cách cần thiết người đang có hành vi xâm phạm các lợi ích nói trên là?","options":{"A":"Thi hành mệnh lệnh của người chỉ huy hoặc của cấp trên","B":"Rủi ro trong nghiên cứu, thử nghiệm, áp dụng tiến bộ khoa học, kỹ thuật và công nghệ","C":"Tình thế cấp thiết","D":"Phòng vệ chính đáng"},"answer":"D"},{"id":253,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":68,"question":"Thời hiệu truy cứu trách nhiệm hình sự với tội ít nghiêm trọng được quy định bao nhiêu năm?","options":{"A":"05 năm","B":"10 năm","C":"15 năm","D":"20 năm"},"answer":"A"},{"id":254,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":69,"question":"Đâu là nhiệm vụ của Bộ Luật hình sự?","options":{"A":"quy định về tội phạm và hình phạt","B":"giải thích các hành vi được xem là phạm tội","C":"răn đe những người có ý định phạm tội","D":"Tất cả phương án trên đều sai."},"answer":"A"},{"id":255,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":70,"question":"Cơ sở của trách nhiệm hình sự là:","options":{"A":"Hành vi được Viện kiểm sát cho phạm tội thì phải chịu trách nhiệm sự","B":"Có hành vi gây nguy hiểm thì phải chịu trách nhiệm hình sự","C":"Phạm tội gây thiệt hại vật chất cho người khác phải chịu trách nhiệm hình sự.","D":"Người nào phạm một tội đã được Bộ luật Hình sự quy định mới phải chịu trách nhiệm hình sự."},"answer":"D"},{"id":256,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":71,"question":"Đâu là dấu hiệu của tội phạm?","options":{"A":"hành vi nguy hiểm cho xã hội được quy định trong Bộ luật Hình sự","B":"hành vi tuy có dấu hiệu của tội phạm nhưng tính chất nguy hiểm cho xã hội không đáng kể","C":"hành vi nguy hiểm do người có năng lực hành vi dân sự thực hiện một cách cố ý hoặc vô ý","D":"Có hành vi nguy hiểm"},"answer":"A"},{"id":257,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":72,"question":"Căn cứ vào tính chất và mức độ nguy hiểm cho xã hội của hành vi phạm tội được quy định trong Bộ luật Hình sự, tội phạm được phân thành mấy loại?","options":{"A":"03 loại","B":"04 loại","C":"05 loại","D":"06 loại"},"answer":"B"},{"id":258,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":73,"question":"Đâu là loại tội phạm nghiêm trọng?","options":{"A":"là tội phạm có tính chất và mức độ nguy hiểm cho xã hội không lớn mà mức cao nhất của khung hình phạt do Bộ luật này quy định đối với tội ấy là phạt tiền, phạt cải tạo không giam giữ hoặc phạt tù đến 03 năm","B":"là tội phạm có tính chất và mức độ nguy hiểm cho xã hội lớn mà mức cao nhất của khung hình phạt do Bộ luật này quy định đối với tội ấy là từ trên 03 năm tù đến 07 năm tù","C":"là tội phạm có tính chất và mức độ nguy hiểm cho xã hội rất lớn mà mức cao nhất của khung hình phạt do Bộ luật này quy định đối với tội ấy là từ trên 07 năm tù đến 15 năm tù","D":"là tội phạm có tính chất và mức độ nguy hiểm cho xã hội đặc biệt lớn mà mức cao nhất của khung hình phạt do Bộ luật này quy định đối với tội ấy là từ trên 15 năm tù đến 20 năm tù, tù chung thân hoặc tử hình"},"answer":"B"},{"id":259,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":74,"question":"Đâu là loại tội phạm rất nghiêm trọng?","options":{"A":"là tội phạm có tính  xã hội, mặc dù phải thấy trước và có thể thấy trước hậu quả đó","C":"Người phạm tội nhận thức rõ hành vi của mình là nguy hiểm cho xã hội, thấy trước hậu quả của hành vi đó có thể xảy ra, tuy không mong muốn nhưng vẫn có ý thức để mặc cho hậu quả xảy ra","D":"Người phạm tội nhận thức rõ hành vi của mình là nguy hiểm cho xã hội, thấy trước hậu quả của hành vi đó và mong muốn hậu quả xảy ra"},"answer":"B"},{"id":262,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":77,"question":"Biện pháp nào dưới đây KHÔNG phải biện pháp khắc phục hậu quả:","options":{"A":"Buộc tiêu hủy hàng hóa, vật phẩm gây hại cho sức khỏe con người, vật nuôi, cây trồng và môi trường, văn hóa phẩm có nội dung độc hại.","B":"Buộc cải chính thông tin sai sự thật hoặc gây nhầm lẫn.","C":"Trục xuất.","D":"Buộc loại bỏ yếu tố vi phạm trên hàng hoá, bao bì hàng hóa, phương tiện kinh doanh, vật phẩm."},"answer":"C"},{"id":263,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":78,"question":"Chính phủ có thẩm quyền nào sau đây:","options":{"A":"Thành lập cơ quan thuộc Chính phủ.","B":"Thành lập cơ quan của Chính phủ.","C":"Ban hành quyết định đặc xá.","D":"Cả A và B."},"answer":"A"},{"id":264,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":79,"question":"Chọn từ thích hợp điền vào chỗ trống: Tuân thủ quy phạm pháp luật hành chính là một hình thức … pháp luật, trong đó các cơ quan, tổ chức, cá nhân … không thực hiện những hành vi mà pháp luật hành chính ngăn cấm","options":{"A":"Sử dụng/ kiềm chế","B":"Sử dụng/ cố ý","C":"Thực hiện/ kiềm chế","D":"Áp dụng/ kiềm chế"},"answer":"C"},{"id":265,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":80,"question":"Chủ thể nào sau đây có thể làm đơn tố cáo","options":{"A":"Công dân","B":"Viên chức - Công chức","C":"Tổ chức","D":"Tất cả đều đúng"},"answer":"A"},{"id":266,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":81,"question":"Cơ quan nào sau đây KHÔNG phải cơ quan hành chính nhà nước:","options":{"A":"Ngân hàng nhà nước.","B":"Viện Khoa học và Công nghệ Việt Nam.","C":"Học viện chính trị quốc gia Hồ Chí Minh.","D":"Cả B và C."},"answer":"D"},{"id":267,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":82,"question":"Đâu là dấu hiệu của mặt chủ quan:","options":{"A":"Lỗi.","B":"Hành vi.","C":"Hậu quả của hành vi.","D":"Mối quan hệ giữa hành vi và hậu quả"},"answer":"A"},{"id":268,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":83,"question":"Đâu là hình thức phạt bổ sung trong xử phạt vi phạm hành chính:","options":{"A":"Cảnh cáo.","B":"Phạt tiền","C":"Tịch thu tang vật, phương tiện được sử dụng để vi phạm hành chính.","D":"Tất cả đều đúng."},"answer":"C"},{"id":269,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":84,"question":"Đâu là sự kiện pháp lý hành chính:","options":{"A":"Hành vi khiếu nại","B":"Hành vi kí kết hợp đồng mua bán","C":"Hành vi trộm cắp tài sản","D":"Hành vi buôn bán động vật quý hiếm"},"answer":"A"},{"id":270,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":85,"question":"Nhận định nào đúng nhất về quyền sử dụng?","options":{"A":"Chủ sở hữu được thực hiện mọi hành vi để quản lý tài sản của mình","B":"Chủ sở hữu được sử dụng tài sản theo ý chí của mình","C":"Quyền khai thác công dụng, hưởng hoa lợi, lợi tức từ tài sản","D":"Thực hiện quyền sử dụng phù hợp với quy định của pháp luật đối với tài sản"},"answer":"C"},{"id":271,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":86,"question":"Chủ thể nào sau đây là người đứng đầu cơ quan Hành chính nhà nước cao nhất?","options":{"A":"Chủ tịch nước","B":"Thủ tướng Chính phủ","C":"Chủ tịch Quốc hội","D":"Viện trưởng Viện Kiểm sát nhân dân tối cao"},"answer":"B"},{"id":272,"lesson":2,"lessonTitle":"Đề cương Pháp luật 2","lessonQ":87,"question":"Pháp luật là:","options":{"A":"Hệ thống các văn bản và Nghị định do các cấp ban hành và thực hiện.","B":"Những luật và điều luật cụ thể trong thực tế đời sống","C":"Hệ thống các
