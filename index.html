<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Ôn Tập GDCT & Pháp Luật - ITC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Be Vietnam Pro', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.5); border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200 flex flex-col">

  <!-- Top Navbar -->
  <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center font-extrabold text-base shadow-sm">
          ITC
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="app-title" class="font-bold text-base sm:text-lg text-slate-900 dark:text-white leading-tight">Ôn Tập GDCT & Pháp Luật</h1>
            <span id="subject-badge" class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-teal-50 text-teal-700 dark:bg-teal-950 dark:text-teal-300 border border-teal-200 dark:border-teal-800">
              296 Câu
            </span>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400">Hiển thị từng câu • Chọn xong tự động khóa đáp án</p>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="shuffleBothNow()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-teal-600 hover:bg-teal-700 active:scale-[0.98] text-white shadow-xs transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          <span>Random Câu & Đáp Án</span>
        </button>

        <button onclick="resetAllConfirm()" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-rose-50 hover:bg-rose-100 text-rose-600 dark:bg-rose-950/60 dark:hover:bg-rose-900/60 dark:text-rose-300 border border-rose-200 dark:border-rose-800/70 transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span>Làm Lại Từ Đầu</span>
        </button>

        <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition cursor-pointer" title="Đổi giao diện Sáng / Tối">
          <svg id="icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg id="icon-moon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
    </div>

    <!-- Subject Switcher Bar -->
    <div class="border-t border-slate-100 dark:border-slate-800/80 bg-slate-50/70 dark:bg-slate-900/60">
      <div class="max-w-6xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 flex-wrap">
          <button id="tab-gdct" onclick="switchSubject('gdct')" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer">
            📘 Giáo Dục Chính Trị (296 câu)
          </button>
          <button id="tab-pl_all" onclick="switchSubject('pl_all')" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition cursor-pointer">
            ⚖️ Pháp Luật (382 câu)
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MOBILE ONLY: Backdrop & Collapsible Left Panel for Question List (Hidden on Laptop lg:hidden) -->
  <div id="drawer-backdrop" onclick="closeLeftPanel()" class="lg:hidden fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-[1px] hidden transition-opacity"></div>

  <aside id="left-drawer" class="lg:hidden fixed top-0 left-0 z-50 h-full w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col transition-transform duration-300 -translate-x-full">
    <!-- Green Tab Handle on Left Edge -->
    <button onclick="toggleLeftPanel()" class="absolute top-1/2 -right-8 -translate-y-1/2 w-8 h-20 rounded-r-xl bg-teal-600 hover:bg-teal-700 text-white shadow-md flex flex-col items-center justify-center gap-1 cursor-pointer" title="Mở / Thu gọn danh sách câu hỏi">
      <svg id="drawer-arrow" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      <span class="text-[9px] font-bold uppercase tracking-tighter [writing-mode:vertical-rl]">DS Câu</span>
    </button>

    <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
      <div>
        <h2 class="text-sm font-bold text-slate-900 dark:text-white">Danh Sách Câu (<span id="grid-count-mob">296</span>)</h2>
        <div class="flex items-center gap-3 mt-1 text-[11px] text-slate-500 dark:text-slate-400">
          <span class="inline-flex items-center gap-1"><i class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></i>Đúng</span>
          <span class="inline-flex items-center gap-1"><i class="w-2 h-2 rounded-full bg-rose-500 inline-block"></i>Sai</span>
        </div>
      </div>
      <button onclick="closeLeftPanel()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 dark:hover:text-slate-200 dark:hover:bg-slate-800 transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-3">
      <div id="question-grid-mobile" class="grid grid-cols-5 gap-2">
        <!-- Rendered by JS -->
      </div>
    </div>
  </aside>

  <!-- Main Workspace -->
  <main class="max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start flex-1">

    <!-- Question Column: order-2 on mobile, order-1 (left 8 cols) on laptop -->
    <section id="single-question-box" class="order-2 lg:order-1 lg:col-span-8">
      <!-- Rendered by JS -->
    </section>

    <!-- Stats & Desktop Question Grid Column: order-1 on mobile (above question), order-2 (right 4 cols) on laptop -->
    <aside class="order-1 lg:order-2 lg:col-span-4 lg:sticky lg:top-28 space-y-4">

      <!-- Kết Quả Hiện Tại -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 p-4 shadow-xs">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Kết quả hiện tại</span>
          <span id="side-percent" class="text-xs font-bold text-teal-600 dark:text-teal-400">0% hoàn thành</span>
        </div>
        <div class="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mb-4">
          <div id="progress-bar" class="h-full bg-gradient-to-r from-teal-500 to-emerald-500 transition-all duration-300" style="width: 0%"></div>
        </div>

        <div class="grid grid-cols-4 gap-2 text-center">
          <div class="bg-slate-50 dark:bg-slate-800/60 rounded-xl p-2.5 border border-slate-200/60 dark:border-slate-700/50">
            <div id="stat-total-done" class="text-sm sm:text-base font-extrabold text-slate-800 dark:text-white">0/296</div>
            <div class="text-[11px] text-slate-500 dark:text-slate-400">Đã khóa</div>
          </div>
          <div class="bg-emerald-50/70 dark:bg-emerald-950/30 rounded-xl p-2.5 border border-emerald-200/60 dark:border-emerald-800/50">
            <div id="stat-correct" class="text-sm sm:text-base font-extrabold text-emerald-600 dark:text-emerald-400">0</div>
            <div class="text-[11px] text-emerald-700/70 dark:text-emerald-400/80">Đúng</div>
          </div>
          <div class="bg-rose-50/70 dark:bg-rose-950/30 rounded-xl p-2.5 border border-rose-200/60 dark:border-rose-800/50">
            <div id="stat-wrong" class="text-sm sm:text-base font-extrabold text-rose-600 dark:text-rose-400">0</div>
            <div class="text-[11px] text-rose-700/70 dark:text-rose-400/80">Sai</div>
          </div>
          <div class="bg-amber-50/70 dark:bg-amber-950/30 rounded-xl p-2.5 border border-amber-200/60 dark:border-amber-800/50">
            <div id="stat-score" class="text-sm sm:text-base font-extrabold text-amber-600 dark:text-amber-400">0.0</div>
            <div class="text-[11px] text-amber-700/70 dark:text-amber-400/80">Điểm 10</div>
          </div>
        </div>

        <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-1.5">Chế độ làm bài</label>
          <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
            <button id="btn-mode-practice" onclick="setMode('practice')" class="py-1.5 px-2.5 rounded-lg text-xs font-semibold transition cursor-pointer">
              ⚡ Luyện tập (Báo Đ/S)
            </button>
            <button id="btn-mode-exam" onclick="setMode('exam')" class="py-1.5 px-2.5 rounded-lg text-xs font-semibold transition cursor-pointer">
              📝 Thi thử (Nộp bài)
            </button>
          </div>
          <button id="submit-exam-btn" onclick="submitExam()" class="hidden mt-3 w-full py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs uppercase tracking-wider shadow-sm transition cursor-pointer">
            Nộp Bài & Chấm Điểm
          </button>
        </div>
      </div>

      <!-- LAPTOP ONLY: Danh sách câu hiển thị bình thường ở cột phải -->
      <div class="hidden lg:block bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 p-4 shadow-xs">
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Danh sách câu (<span id="grid-count-desk">296</span>)</span>
          <div class="flex items-center gap-2 text-[11px] text-slate-500">
            <span class="inline-flex items-center gap-1"><i class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></i>Đúng</span>
            <span class="inline-flex items-center gap-1"><i class="w-2 h-2 rounded-full bg-rose-500 inline-block"></i>Sai</span>
          </div>
        </div>
        <div id="question-grid-desktop" class="grid grid-cols-8 xl:grid-cols-9 gap-1.5 max-h-72 overflow-y-auto pr-1">
          <!-- Rendered by JS -->
        </div>
      </div>

    </aside>

  </main>

  <script>
    const GDCT_BANK = [{"id":1,"lesson":1,"lessonTitle":"Bài 1","lessonQ":1,"question":"Chủ nghĩa Mác – Lênin là học thuyết do những ai sáng lập và phát triển?","options":{"A":"C.Mác, Ph.Ăngghen sáng lập; V.I.Lênin bổ sung, phát triển.","B":"V.I.Lênin sáng lập; C.Mác, Ph.Ăngghen bổ sung, phát triển.","C":"C.Mác sáng lập; V.I.Lênin và Ph.Ăngghen phát triển.","D":"Ph.Ăngghen sáng lập; C.Mác và V.I.Lênin phát triển."},"answer":"A"},{"id":2,"lesson":1,"lessonTitle":"Bài 1","lessonQ":2,"question":"Chủ nghĩa Mác – Lênin gồm những bộ phận lý luận cơ bản nào?","options":{"A":"Triết học, chính trị học và xã hội học.","B":"Triết học Mác – Lênin, kinh tế chính trị học Mác – Lênin và chủ nghĩa xã hội khoa học.","C":"Kinh tế học, lịch sử Đảng và tư tưởng Hồ Chí Minh.","D":"Triết học duy tâm, kinh tế học cổ điển và chủ nghĩa xã hội không tưởng."},"answer":"B"},{"id":3,"lesson":1,"lessonTitle":"Bài 1","lessonQ":3,"question":"Tác phẩm nào được công bố vào tháng 2-1848, mở đầu sự ra đời của chủ nghĩa Mác?","options":{"A":"Bộ sách Tư bản.","B":"Nhà nước và cách mạng.","C":"Tuyên ngôn của Đảng Cộng sản.","D":"Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán."},"answer":"C"},{"id":4,"lesson":1,"lessonTitle":"Bài 1","lessonQ":4,"question":"Ba nguồn gốc hình thành chủ nghĩa Mác – Lênin bao gồm?","options":{"A":"Kinh tế, chính trị và văn hóa.","B":"Kinh tế – xã hội, tư tưởng lý luận và khoa học.","C":"Chính trị, quân sự và tôn giáo.","D":"Triết học, pháp luật và đạo đức."},"answer":"B"},{"id":5,"lesson":1,"lessonTitle":"Bài 1","lessonQ":5,"question":"Theo chủ nghĩa duy vật biện chứng, yếu tố nào quyết định ý thức?","options":{"A":"Ý chí cá nhân.","B":"Điều kiện tâm lý.","C":"Vật chất.","D":"Tình cảm."},"answer":"C"},{"id":6,"lesson":1,"lessonTitle":"Bài 1","lessonQ":6,"question":"Hình thức vận động nào được xác định là hình thức vận động cao nhất theo quan điểm của chủ nghĩa Mác?","options":{"A":"Vận động cơ học.","B":"Vận động hóa học.","C":"Vận động sinh học.","D":"Vận động xã hội."},"answer":"D"},{"id":7,"lesson":1,"lessonTitle":"Bài 1","lessonQ":7,"question":"Theo kinh tế chính trị học Mác – Lênin, hàng hóa có hai thuộc tính cơ bản nào?","options":{"A":"Giá trị sử dụng và giá trị trao đổi.","B":"Giá cả và lợi nhuận.","C":"Giá trị và tiền công.","D":"Cung và cầu."},"answer":"A"},{"id":8,"lesson":1,"lessonTitle":"Bài 1","lessonQ":8,"question":"Theo chủ nghĩa Mác – Lênin, giai đoạn thấp của hình thái kinh tế – xã hội cộng sản chủ nghĩa là gì?","options":{"A":"Chủ nghĩa tư bản độc quyền.","B":"Chủ nghĩa xã hội.","C":"Chủ nghĩa tư bản tự do cạnh tranh.","D":"Thời kỳ chiếm hữu nô lệ."},"answer":"B"},{"id":9,"lesson":1,"lessonTitle":"Bài 1","lessonQ":9,"question":"Vì sao sự phát triển của giai cấp công nhân giữa thế kỷ XIX là một nhân tố quan trọng dẫn đến sự ra đời của chủ nghĩa Mác?","options":{"A":"Vì giai cấp công nhân đã nắm quyền thống trị ở các nước Tây Âu.","B":"Vì phong trào công nhân tự phát đã giành thắng lợi hoàn toàn.","C":"Vì phong trào công nhân đặt ra yêu cầu khách quan phải có học thuyết khoa học và cách mạng dẫn đường.","D":"Vì giai cấp công nhân không còn mâu thuẫn với giai cấp tư sản."},"answer":"C"},{"id":10,"lesson":1,"lessonTitle":"Bài 1","lessonQ":10,"question":"Theo quy luật lượng – chất, khái niệm nào chỉ giới hạn mà trong đó lượng biến đổi nhưng chất của sự vật chưa thay đổi căn bản?","options":{"A":"Điểm nút.","B":"Bước nhảy.","C":"Mâu thuẫn.","D":"Độ."},"answer":"D"},{"id":11,"lesson":1,"lessonTitle":"Bài 1","lessonQ":11,"question":"Nội dung nào phản ánh đúng quy luật thống nhất và đấu tranh của các mặt đối lập?","options":{"A":"Mọi sự vật chỉ phát triển khi không tồn tại mâu thuẫn.","B":"Sự thống nhất và đấu tranh của các mặt đối lập là nguồn gốc, động lực cơ bản của sự vận động và phát triển.","C":"Sự thống nhất của các mặt đối lập là tuyệt đối, còn đấu tranh là tương đối.","D":"Mâu thuẫn chỉ tồn tại giữa các sự vật khác nhau, không tồn tại bên trong một sự vật."},"answer":"B"},{"id":12,"lesson":1,"lessonTitle":"Bài 1","lessonQ":12,"question":"Vì sao phủ định biện chứng không đồng nghĩa với việc xóa bỏ hoàn toàn mọi yếu tố của sự vật cũ?","options":{"A":"Vì cái mới chỉ là sự lặp lại nguyên trạng cái cũ.","B":"Vì cái cũ luôn tiến bộ hơn cái mới.","C":"Vì phủ định biện chứng có sự kế thừa có chọn lọc những yếu tố tích cực của cái cũ và cải biến chúng cho phù hợp với cái mới.","D":"Vì mọi sự vật đều tồn tại vĩnh viễn, không thể thay thế."},"answer":"C"},{"id":13,"lesson":1,"lessonTitle":"Bài 1","lessonQ":13,"question":"Theo lý luận nhận thức của chủ nghĩa Mác – Lênin, vì sao thực tiễn được xem là tiêu chuẩn của chân lý?","options":{"A":"Vì thực tiễn có thể kiểm nghiệm tính đúng đắn của nhận thức.","B":"Vì mọi nhận thức được hình thành trong suy nghĩ đều chính xác.","C":"Vì lý luận có thể thay thế hoàn toàn hoạt động thực tiễn.","D":"Vì nhận thức cảm tính luôn phản ánh đầy đủ bản chất sự vật."},"answer":"A"},{"id":14,"lesson":1,"lessonTitle":"Bài 1","lessonQ":14,"question":"Trong phương thức sản xuất, quan hệ sản xuất được xác định là gì so với lực lượng sản xuất?","options":{"A":"Nội dung vật chất, còn lực lượng sản xuất là hình thức xã hội.","B":"Hai yếu tố không có quan hệ với nhau.","C":"Yếu tố quyết định trực tiếp mọi hoạt động tư tưởng, không phụ thuộc sản xuất.","D":"Hình thức xã hội, còn lực lượng sản xuất là nội dung vật chất."},"answer":"D"},{"id":15,"lesson":1,"lessonTitle":"Bài 1","lessonQ":15,"question":"Theo học thuyết giá trị thặng dư, giá trị thặng dư là gì?","options":{"A":"Toàn bộ tiền lương mà người lao động nhận được.","B":"Phần giá trị mới do sức lao động tạo ra vượt quá giá trị của bản thân sức lao động.","C":"Toàn bộ giá trị máy móc và nguyên liệu của doanh nghiệp.","D":"Khoản tiền nhà tư bản bỏ ra để mua tư liệu sản xuất."},"answer":"B"},{"id":16,"lesson":1,"lessonTitle":"Bài 1","lessonQ":16,"question":"Vì sao chủ nghĩa Mác – Lênin được xem là học thuyết mở?","options":{"A":"Vì mọi nguyên lý đều bất biến và không cần kiểm nghiệm.","B":"Vì học thuyết chỉ có giá trị trong thế kỷ XIX.","C":"Vì học thuyết không ngừng tự phê phán, đổi mới, bổ sung và phát triển gắn với thực tiễn cách mạng và tri thức nhân loại.","D":"Vì học thuyết không đề cập đến những vấn đề của xã hội hiện thực."},"answer":"C"},{"id":17,"lesson":1,"lessonTitle":"Bài 1","lessonQ":17,"question":"Một học sinh cho rằng: “Muốn đạt kết quả học tập tốt thì chỉ cần quyết tâm, không cần quan tâm đến điều kiện học tập và phương pháp học”. Theo quan điểm duy vật biện chứng, nhận định nào phù hợp nhất?","options":{"A":"Ý thức quyết định hoàn toàn điều kiện vật chất nên quan điểm trên đúng.","B":"Điều kiện vật chất không ảnh hưởng đến kết quả học tập.","C":"Chỉ cần thay đổi điều kiện vật chất, không cần phát huy tính chủ động của học sinh.","D":"Cần tôn trọng điều kiện khách quan, đồng thời phát huy tính năng động, sáng tạo của ý thức thông qua hoạt động thực tiễn."},"answer":"D"},{"id":18,"lesson":1,"lessonTitle":"Bài 1","lessonQ":18,"question":"Một cơ sở đào tạo nhận thấy học sinh tích lũy kiến thức và rèn luyện kỹ năng qua từng ngày. Đến một thời điểm, học sinh có thể thực hiện thành thạo một công việc mà trước đó chưa làm được. Tình huống này minh họa nội dung nào?","options":{"A":"Sự tích lũy về lượng đến giới hạn nhất định dẫn đến sự thay đổi về chất.","B":"Chất luôn thay đổi trước lượng trong mọi trường hợp.","C":"Sự vật chỉ thay đổi khi có tác động từ bên ngoài.","D":"Sự thống nhất giữa các mặt đối lập là tuyệt đối."},"answer":"A"},{"id":19,"lesson":1,"lessonTitle":"Bài 1","lessonQ":19,"question":"Một doanh nghiệp thay thế dây chuyền sản xuất lạc hậu bằng công nghệ hiện đại, đồng thời đào tạo người lao động để nâng cao kỹ năng. Việc làm này phù hợp nhất với yêu cầu thực tiễn rút ra từ quy luật nào của chủ nghĩa duy vật lịch sử?","options":{"A":"Quy luật phủ định của phủ định.","B":"Quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất.","C":"Quy luật thống nhất và đấu tranh của các mặt đối lập.","D":"Quy luật cơ sở hạ tầng quyết định kiến trúc thượng tầng."},"answer":"B"},{"id":20,"lesson":1,"lessonTitle":"Bài 1","lessonQ":20,"question":"Một nhà quản lý cho rằng chỉ cần thay đổi quy định quản lý doanh nghiệp là có thể thúc đẩy sản xuất phát triển, không cần xem xét trình độ công nghệ, người lao động và quan hệ sở hữu. Theo chủ nghĩa duy vật lịch sử, hạn chế chính của quan điểm này là gì?","options":{"A":"Đã tuyệt đối hóa vai trò của người lao động.","B":"Đã phủ nhận hoàn toàn vai trò của kiến trúc thượng tầng.","C":"Chưa xem xét sự phù hợp giữa quan hệ sản xuất và trình độ phát triển của lực lượng sản xuất.","D":"Đã coi lực lượng sản xuất là yếu tố không thay đổi."},"answer":"C"},{"id":21,"lesson":1,"lessonTitle":"Bài 1","lessonQ":21,"question":"Một người sản xuất hàng hóa cải tiến kỹ thuật, làm tăng số sản phẩm tạo ra trong một giờ lao động. Trong điều kiện các yếu tố khác không đổi, thời gian lao động xã hội cần thiết để sản xuất một đơn vị hàng hóa có xu hướng giảm. Điều này dẫn đến kết quả nào?","options":{"A":"Giá trị của mỗi đơn vị hàng hóa có xu hướng giảm.","B":"Giá trị của mỗi đơn vị hàng hóa luôn tăng.","C":"Giá trị sử dụng của hàng hóa chắc chắn mất đi.","D":"Quy luật giá trị không còn tác dụng."},"answer":"A"},{"id":22,"lesson":1,"lessonTitle":"Bài 1","lessonQ":22,"question":"Một nhà tư bản ứng dụng công nghệ mới, nhờ đó giảm thời gian lao động tất yếu và tăng thời gian lao động thặng dư trong điều kiện độ dài ngày lao động không thay đổi. Đây là phương pháp sản xuất giá trị thặng dư nào?","options":{"A":"Sản xuất giá trị thặng dư tuyệt đối.","B":"Sản xuất giá trị thặng dư tương đối.","C":"Sản xuất giá trị thặng dư bằng cách tăng giá bán tùy ý.","D":"Sản xuất giá trị thặng dư bằng cách kéo dài ngày lao động."},"answer":"B"},{"id":23,"lesson":1,"lessonTitle":"Bài 1","lessonQ":23,"question":"Trong quá trình cải tổ hoạt động, một tổ chức loại bỏ những cách làm không còn phù hợp nhưng vẫn giữ lại những kinh nghiệm tốt và điều chỉnh chúng để đáp ứng yêu cầu mới. Cách làm này thể hiện nội dung nào?","options":{"A":"Phủ định sạch trơn.","B":"Giữ nguyên toàn bộ cái cũ.","C":"Phủ định siêu hình.","D":"Phủ định biện chứng."},"answer":"D"},{"id":24,"lesson":1,"lessonTitle":"Bài 1","lessonQ":24,"question":"Một nhóm nghiên cứu đưa ra giả thuyết về nguyên nhân của một hiện tượng xã hội. Để xác định giả thuyết có phản ánh đúng hiện thực hay không, nhóm tiến hành khảo sát, thu thập dữ liệu và đối chiếu kết quả với giả thuyết. Nhóm đã vận dụng quan điểm nào?","options":{"A":"Chỉ cần dựa vào kinh nghiệm cá nhân để xác định chân lý.","B":"Lấy suy luận lý thuyết làm tiêu chuẩn duy nhất của chân lý.","C":"Lấy thực tiễn làm cơ sở và tiêu chuẩn kiểm nghiệm nhận thức.","D":"Coi nhận thức ban đầu là bất biến."},"answer":"C"},{"id":25,"lesson":1,"lessonTitle":"Bài 1","lessonQ":25,"question":"Một địa phương triển khai chương trình phát triển kinh tế. Chính quyền chỉ tập trung đầu tư máy móc hiện đại nhưng không đào tạo người lao động, không điều chỉnh cơ chế tổ chức và phân phối sản phẩm, khiến hiệu quả sản xuất thấp. Cách phân tích nào phù hợp nhất với quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất?","options":{"A":"Chỉ cần đầu tư thêm máy móc vì công cụ lao động là yếu tố duy nhất quyết định sản xuất.","B":"Cần xem xét đồng bộ người lao động, tư liệu sản xuất và các quan hệ sở hữu, tổ chức quản lý, phân phối để tạo sự phù hợp thúc đẩy sản xuất.","C":"Cần giữ nguyên cơ chế tổ chức và phân phối vì quan hệ sản xuất không ảnh hưởng đến lực lượng sản xuất.","D":"Cần ưu tiên thay đổi các quan điểm tư tưởng mà không cần quan tâm đến hoạt động sản xuất vật chất."},"answer":"B"},{"id":26,"lesson":1,"lessonTitle":"Bài 1","lessonQ":26,"question":"Một quốc gia thay đổi cơ cấu kinh tế, làm biến đổi các quan hệ sản xuất giữ vai trò thống trị. Sau đó, hệ thống chính sách, pháp luật và một số thiết chế nhà nước cũng được điều chỉnh. Theo chủ nghĩa duy vật lịch sử, cách giải thích nào phù hợp nhất?","options":{"A":"Kiến trúc thượng tầng luôn tồn tại độc lập, không liên quan đến kinh tế.","B":"Chính trị quyết định hoàn toàn kinh tế trong mọi hoàn cảnh.","C":"Mọi bộ phận của kiến trúc thượng tầng đều biến mất ngay khi cơ sở hạ tầng thay đổi.","D":"Cơ sở hạ tầng biến đổi dẫn đến sự biến đổi của kiến trúc thượng tầng; tuy nhiên, sự thay đổi của các bộ phận kiến trúc thượng tầng không nhất thiết diễn ra đồng thời."},"answer":"D"},{"id":27,"lesson":1,"lessonTitle":"Bài 1","lessonQ":27,"question":"Một doanh nghiệp tăng lợi nhuận bằng cách kéo dài ngày lao động, trong khi năng suất lao động, giá trị sức lao động và thời gian lao động tất yếu không thay đổi. Nếu phân tích theo học thuyết giá trị thặng dư, phương pháp doanh nghiệp sử dụng là gì?","options":{"A":"Sản xuất giá trị thặng dư tuyệt đối.","B":"Sản xuất giá trị thặng dư tương đối.","C":"Sản xuất giá trị thặng dư siêu ngạch do ứng dụng công nghệ mới.","D":"Giảm thời gian lao động thặng dư."},"answer":"A"},{"id":28,"lesson":1,"lessonTitle":"Bài 1","lessonQ":28,"question":"Trong quá trình xây dựng xã hội mới, một quốc gia đồng thời tồn tại các yếu tố kinh tế, văn hóa của xã hội cũ và những nhân tố mới đang hình thành. Quá trình cải biến cần được thực hiện từng bước, trên nhiều lĩnh vực. Theo chủ nghĩa Mác – Lênin, tình huống này phản ánh đặc điểm nào?","options":{"A":"Xã hội mới có thể hình thành hoàn chỉnh ngay lập tức sau khi giành chính quyền.","B":"Thời kỳ quá độ chỉ diễn ra trên lĩnh vực kinh tế.","C":"Thời kỳ quá độ tồn tại đan xen giữa yếu tố cũ chưa bị xóa bỏ hết và nhân tố mới còn non yếu, cần tiếp tục xây dựng, hoàn thiện.","D":"Thời kỳ quá độ không cần có sự lãnh đạo chính trị."},"answer":"C"},{"id":29,"lesson":1,"lessonTitle":"Bài 1","lessonQ":29,"question":"Một người cho rằng mọi đổi mới đều phải xóa bỏ hoàn toàn những thành quả của giai đoạn trước; nếu một mô hình mới gặp khó khăn ban đầu thì mô hình đó chắc chắn không tiến bộ. Theo quy luật phủ định của phủ định, đánh giá nào phù hợp nhất?","options":{"A":"Quan điểm đúng vì cái mới không cần kế thừa cái cũ.","B":"Quan điểm chưa đúng vì phát triển có sự kế thừa có chọn lọc, diễn ra quanh co, phức tạp và cái mới có thể còn non yếu trong giai đoạn đầu.","C":"Quan điểm đúng vì mọi bước phát triển đều diễn ra theo đường thẳng.","D":"Quan điểm chưa đúng vì cái cũ luôn phải được giữ nguyên."},"answer":"B"},{"id":30,"lesson":1,"lessonTitle":"Bài 1","lessonQ":30,"question":"Một tổ chức muốn nâng cao hiệu quả hoạt động đã thực hiện ba việc: (1) phân tích toàn diện các yếu tố liên quan và điều kiện lịch sử cụ thể; (2) tích lũy đủ điều kiện trước khi thực hiện thay đổi căn bản; (3) kiểm nghiệm các giải pháp bằng kết quả thực tiễn và điều chỉnh khi cần thiết. Những việc làm này thể hiện sự vận dụng tổng hợp những nội dung nào?","options":{"A":"Chỉ vận dụng quy luật lượng – chất.","B":"Chỉ vận dụng nguyên lý về mối liên hệ phổ biến.","C":"Chỉ vận dụng lý luận nhận thức, không liên quan đến phép biện chứng duy vật.","D":"Vận dụng quan điểm toàn diện, lịch sử cụ thể; quy luật lượng – chất; và vai trò của thực tiễn đối với nhận thức."},"answer":"D"},{"id":31,"lesson":1,"lessonTitle":"Bài 1","lessonQ":31,"question":"Ai là hai người sáng lập chủ nghĩa Mác?","options":{"A":"C. Mác và Ph. Ăngghen.","B":"C. Mác và V.I. Lênin.","C":"Ph. Ăngghen và Hêghen.","D":"V.I. Lênin và Phoiơbắc."},"answer":"A"},{"id":32,"lesson":1,"lessonTitle":"Bài 1","lessonQ":32,"question":"Trong định nghĩa vật chất của Lênin, tiêu chí để phân biệt vật chất với ý thức là gì?","options":{"A":"Khả năng tạo ra cảm giác giống nhau ở mọi người.","B":"Khả năng được quan sát trực tiếp bằng mắt thường.","C":"Cấu tạo từ các hạt mà khoa học đã nhận biết.","D":"Sự tồn tại khách quan, không lệ thuộc cảm giác."},"answer":"D"},{"id":33,"lesson":1,"lessonTitle":"Bài 1","lessonQ":33,"question":"Tuyên ngôn của Đảng Cộng sản được công bố vào thời gian nào?","options":{"A":"Tháng 2 năm 1838.","B":"Tháng 2 năm 1848.","C":"Tháng 3 năm 1871.","D":"Tháng 3 năm 1919."},"answer":"B"},{"id":34,"lesson":1,"lessonTitle":"Bài 1","lessonQ":34,"question":"Một chi tiết cơ khí nằm yên trên bàn nhưng cấu trúc vi mô vẫn biến đổi. Ví dụ này làm rõ quan hệ nào?","options":{"A":"Đứng im tương đối trong vận động tuyệt đối.","B":"Vận động chỉ xuất hiện khi vật thay đổi vị trí.","C":"Đứng im và vận động loại trừ nhau về thời gian.","D":"Vận động tương đối trong đứng im tuyệt đối."},"answer":"A"},{"id":35,"lesson":1,"lessonTitle":"Bài 1","lessonQ":35,"question":"Cặp yếu tố nào thuộc nguồn gốc xã hội của ý thức, khác với nguồn gốc tự nhiên?","options":{"A":"Lao động và ngôn ngữ.","B":"Bộ óc người và thế giới khách quan.","C":"Cơ quan cảm giác và môi trường tự nhiên.","D":"Hệ thần kinh và hoạt động phản xạ."},"answer":"A"},{"id":36,"lesson":1,"lessonTitle":"Bài 1","lessonQ":36,"question":"Tác phẩm nào do C. Mác và Ph. Ăngghen soạn thảo, công bố năm 1848?","options":{"A":"Chủ nghĩa đế quốc, giai đoạn tột cùng của chủ nghĩa tư bản.","B":"Tuyên ngôn của Đảng Cộng sản.","C":"Nhà nước và cách mạng.","D":"Đường Kách mệnh."},"answer":"B"},{"id":37,"lesson":1,"lessonTitle":"Bài 1","lessonQ":37,"question":"Xưởng đặt mục tiêu sản lượng dựa trên công suất thiết bị, rồi đào tạo và điều chỉnh tổ chức lao động để đạt mục tiêu. Cách làm này thể hiện yêu cầu nào?","options":{"A":"Lấy quyết tâm làm căn cứ xác lập khả năng khách quan.","B":"Xuất phát từ khách quan và phát huy tính năng động chủ quan.","C":"Chờ điều kiện vật chất tự chuyển thành kết quả sản xuất.","D":"Dùng kết quả mong muốn để xác định công suất thiết bị."},"answer":"B"},{"id":38,"lesson":1,"lessonTitle":"Bài 1","lessonQ":38,"question":"Đánh giá một sinh viên, giảng viên xét kết quả học, thực hành, thái độ và điều kiện học tập, đồng thời xác định mặt hạn chế chủ yếu. Cách đánh giá này vận dụng trực tiếp quan điểm nào?","options":{"A":"Phát triển, lấy triển vọng tương lai thay kết quả hiện tại.","B":"Lịch sử cụ thể, tập trung vào mốc thời gian nhập học.","C":"Toàn diện, coi các yếu tố có mức tác động ngang nhau.","D":"Toàn diện, có phân biệt vai trò các mối liên hệ."},"answer":"D"},{"id":39,"lesson":1,"lessonTitle":"Bài 1","lessonQ":39,"question":"Công xã Pari, sự kiện được Mác và Ăngghen nghiên cứu tổng kết, diễn ra năm nào?","options":{"A":"1848.","B":"1871.","C":"1917.","D":"1889."},"answer":"B"},{"id":40,"lesson":1,"lessonTitle":"Bài 1","lessonQ":40,"question":"Sau vài lần thực hành, chất lượng thao tác chưa ổn định; khi tích lũy đủ kỹ năng, sinh viên vận hành độc lập được máy. Quan hệ nào được minh họa rõ nhất?","options":{"A":"Tích lũy lượng đến điều kiện chuyển biến về chất.","B":"Mọi thay đổi lượng đều lập tức tạo chất mới.","C":"Lượng và chất thay đổi độc lập trong học nghề.","D":"Thay đổi chất không cần quá trình tích lũy về lượng."},"answer":"A"},{"id":41,"lesson":1,"lessonTitle":"Bài 1","lessonQ":41,"question":"Ai lãnh đạo cách mạng Tháng Mười Nga năm 1917 cùng Đảng Bônsêvích và giai cấp công nhân Nga?","options":{"A":"A. Xmít.","B":"C. Mác.","C":"Ph. Ăngghen.","D":"V.I. Lênin."},"answer":"D"},{"id":42,"lesson":1,"lessonTitle":"Bài 1","lessonQ":42,"question":"Ý nghĩa nổi bật của Cách mạng Tháng Mười Nga đối với chủ nghĩa xã hội là gì?","options":{"A":"Đánh dấu lần đầu chủ nghĩa Mác được hình thành.","B":"Mở đầu phong trào công nhân tự phát ở châu Âu.","C":"Hoàn thành việc xây dựng chủ nghĩa cộng sản trên thế giới.","D":"Đưa chủ nghĩa xã hội từ lý luận thành hiện thực."},"answer":"D"},{"id":43,"lesson":1,"lessonTitle":"Bài 1","lessonQ":43,"question":"Khi thay quy trình cũ, nhà máy giữ các thao tác còn hiệu quả và cải tiến khâu không phù hợp. Cách thay đổi này thể hiện nội dung nào?","options":{"A":"Phủ định biện chứng có tính kế thừa.","B":"Giữ nguyên chất cũ trong hình thức mới.","C":"Phủ định do loại bỏ toàn bộ yếu tố trước đó.","D":"Phủ định bằng cách quay lại trạng thái ban đầu."},"answer":"A"},{"id":44,"lesson":1,"lessonTitle":"Bài 1","lessonQ":44,"question":"Trong chủ nghĩa duy vật lịch sử, cơ sở hạ tầng được hiểu theo nghĩa nào?","options":{"A":"Hệ thống đường sá, cầu cảng và mạng lưới cấp điện quốc gia.","B":"Tổng thể tư tưởng chính trị, pháp luật và thiết chế tương ứng.","C":"Toàn bộ quan hệ sản xuất hợp thành cơ cấu kinh tế của xã hội.","D":"Toàn bộ máy móc, nhà xưởng và trình độ kỹ thuật sản xuất."},"answer":"C"},{"id":45,"lesson":1,"lessonTitle":"Bài 1","lessonQ":45,"question":"Hai phương án gia công đều có lập luận hợp lý. Nhóm cho chạy thử trong điều kiện kiểm soát để kiểm tra độ chính xác thực tế. Vai trò nào của thực tiễn được nhấn mạnh?","options":{"A":"Hình thức thay thế tư duy lý luận khi có tranh luận.","B":"Kết quả cuối cùng không cần tiếp tục nhận thức.","C":"Tiêu chuẩn kiểm tra tính đúng đắn của nhận thức.","D":"Nguồn cung cấp thuật ngữ cho mô tả kỹ thuật."},"answer":"C"},{"id":46,"lesson":1,"lessonTitle":"Bài 1","lessonQ":46,"question":"Trong quan hệ giữa lực lượng sản xuất và quan hệ sản xuất, công cụ lao động thuộc yếu tố nào?","options":{"A":"Quan hệ tổ chức quản lý trong quan hệ sản xuất.","B":"Quan hệ phân phối trong quan hệ sản xuất.","C":"Tư liệu lao động của lực lượng sản xuất.","D":"Quan hệ sở hữu trong quan hệ sản xuất."},"answer":"C"},{"id":47,"lesson":1,"lessonTitle":"Bài 1","lessonQ":47,"question":"Doanh nghiệp giữ nguyên thiết bị và tay nghề nhưng chuyển từ trả công bình quân sang trả theo kết quả. Yếu tố thay đổi trực tiếp là gì?","options":{"A":"Năng lực chuyên môn của người lao động.","B":"Quan hệ phân phối sản phẩm lao động.","C":"Đối tượng lao động của quá trình sản xuất.","D":"Trình độ công cụ lao động đang sử dụng."},"answer":"B"},{"id":48,"lesson":1,"lessonTitle":"Bài 1","lessonQ":48,"question":"Quốc tế Cộng sản, còn gọi là Quốc tế III, ra đời vào thời gian nào?","options":{"A":"Tháng 3 năm 1871.","B":"Tháng 12 năm 1920.","C":"Tháng 3 năm 1919.","D":"Tháng 2 năm 1848."},"answer":"C"},{"id":49,"lesson":1,"lessonTitle":"Bài 1","lessonQ":49,"question":"Khi phân biệt giai cấp với nhóm nghề nghiệp, tiêu chí có ý nghĩa quyết định là gì?","options":{"A":"Mức độ giống nhau về công việc và chương trình đào tạo.","B":"Địa vị trong hệ thống sản xuất xã hội, nhất là quan hệ với tư liệu sản xuất.","C":"Khác biệt về nơi cư trú và điều kiện sinh hoạt hằng ngày.","D":"Khác biệt về năng lực cá nhân và phong cách tiêu dùng."},"answer":"B"},{"id":50,"lesson":1,"lessonTitle":"Bài 1","lessonQ":50,"question":"Một sản phẩm lao động trở thành hàng hóa khi nào?","options":{"A":"Có công dụng và được người làm ra tự sử dụng.","B":"Có hình thức vật thể và được cất giữ trong kho.","C":"Được đưa vào trao đổi, mua bán để đáp ứng nhu cầu.","D":"Được chế tạo bằng dây chuyền có mức tự động hóa cao."},"answer":"C"},{"id":51,"lesson":1,"lessonTitle":"Bài 1","lessonQ":51,"question":"Một cơ sở giảm thời gian làm ra sản phẩm xuống dưới mức xã hội cần thiết, còn điều kiện chung của ngành chưa đổi. Đại lượng nào giảm trực tiếp tại cơ sở đó?","options":{"A":"Nhu cầu xã hội đối với sản phẩm của toàn ngành.","B":"Thời gian lao động cá biệt cho một đơn vị sản phẩm.","C":"Thời gian lao động xã hội cần thiết của toàn ngành.","D":"Giá trị xã hội của mọi sản phẩm cùng loại."},"answer":"B"},{"id":52,"lesson":1,"lessonTitle":"Bài 1","lessonQ":52,"question":"Nếu năng suất lao động xã hội tăng gấp đôi, các điều kiện khác không đổi, lượng giá trị một đơn vị hàng hóa biến đổi thế nào?","options":{"A":"Giảm một nửa.","B":"Giảm một phần tư.","C":"Giữ nguyên mức cũ.","D":"Tăng gấp đôi."},"answer":"A"},{"id":53,"lesson":1,"lessonTitle":"Bài 1","lessonQ":53,"question":"Theo học thuyết giá trị, giá trị của hàng hóa là gì?","options":{"A":"Công dụng của sản phẩm đối với người sử dụng.","B":"Khối lượng nguyên vật liệu dùng để làm sản phẩm.","C":"Số tiền người bán mong muốn thu được.","D":"Lao động xã hội của người sản xuất kết tinh trong hàng hóa."},"answer":"D"},{"id":54,"lesson":1,"lessonTitle":"Bài 1","lessonQ":54,"question":"Yêu cầu cốt lõi của quy luật giá trị đối với sản xuất và trao đổi hàng hóa là gì?","options":{"A":"Phân phối sản phẩm theo nhu cầu của từng người.","B":"Giữ giá cả cố định bằng giá trị trong từng giao dịch.","C":"Dựa trên hao phí lao động cá biệt của người bán.","D":"Dựa trên hao phí lao động xã hội cần thiết."},"answer":"D"},{"id":55,"lesson":1,"lessonTitle":"Bài 1","lessonQ":55,"question":"Theo học thuyết giá trị thặng dư, đặc điểm nào làm sức lao động trở thành hàng hóa đặc biệt?","options":{"A":"Khi sử dụng có thể tạo giá trị lớn hơn giá trị bản thân nó.","B":"Có giá trị sử dụng nhưng không có giá trị trao đổi.","C":"Tạo ra giá trị mới bằng đúng tiền công đã trả.","D":"Chuyển nguyên vẹn giá trị máy móc vào sản phẩm."},"answer":"A"},{"id":56,"lesson":1,"lessonTitle":"Bài 1","lessonQ":56,"question":"Ngày lao động 8 giờ gồm 4 giờ cần thiết và 4 giờ thặng dư. Kéo dài lên 10 giờ, thời gian cần thiết giữ nguyên. Phương pháp tăng giá trị thặng dư là gì?","options":{"A":"Thu giá trị thặng dư nhờ giảm thời gian cần thiết.","B":"Hạ giá trị hàng hóa sức lao động bằng tăng năng suất.","C":"Sản xuất giá trị thặng dư tuyệt đối.","D":"Sản xuất giá trị thặng dư tương đối."},"answer":"C"},{"id":57,"lesson":1,"lessonTitle":"Bài 1","lessonQ":57,"question":"Ngày lao động vẫn 8 giờ; nhờ tăng năng suất trong các ngành sản xuất tư liệu sinh hoạt, thời gian cần thiết giảm từ 4 xuống 3 giờ. Đây là phương pháp nào?","options":{"A":"Sản xuất giá trị thặng dư tuyệt đối.","B":"Sản xuất giá trị thặng dư tương đối.","C":"Tăng giá trị sức lao động do tăng giá sinh hoạt.","D":"Kéo dài ngày lao động thông qua tăng giờ làm."},"answer":"B"},{"id":58,"lesson":1,"lessonTitle":"Bài 1","lessonQ":58,"question":"Theo chủ nghĩa xã hội khoa học, cơ sở khách quan của sứ mệnh lịch sử giai cấp công nhân chủ yếu xuất phát từ đâu?","options":{"A":"Tỷ lệ công nhân trong dân số ở mọi giai đoạn.","B":"Địa vị kinh tế xã hội gắn nền sản xuất công nghiệp hiện đại.","C":"Mức thu nhập cao hơn các nhóm lao động khác.","D":"Sự thống nhất về nguồn gốc gia đình của công nhân."},"answer":"B"},{"id":59,"lesson":1,"lessonTitle":"Bài 1","lessonQ":59,"question":"Giai cấp công nhân thực hiện sứ mệnh lịch sử thông qua sự lãnh đạo của tổ chức nào?","options":{"A":"Hiệp hội người tiêu dùng.","B":"Đảng Cộng sản.","C":"Tổ chức giới chủ.","D":"Hiệp hội thương mại."},"answer":"B"},{"id":60,"lesson":1,"lessonTitle":"Bài 1","lessonQ":60,"question":"Khi học tập và vận dụng chủ nghĩa Mác–Lênin, cần tránh cách làm nào?","options":{"A":"Đối chiếu lý luận với kết quả thực tiễn.","B":"Vận dụng nguyên lý phù hợp tình hình.","C":"Áp dụng máy móc mà không xét hoàn cảnh cụ thể.","D":"Tìm hiểu điều kiện của từng vấn đề."},"answer":"C"},{"id":61,"lesson":2,"lessonTitle":"Bài 2","lessonQ":1,"question":"Khái niệm tư tưởng Hồ Chí Minh, lần đầu được sử dụng trong Văn kiện Đại hội nào của Đảng?","options":{"A":"Đại hội V.","B":"Đại hội VI.","C":"Đại hội VII.","D":"Đại hội VIII."},"answer":"C"},{"id":62,"lesson":2,"lessonTitle":"Bài 2","lessonQ":2,"question":"Tư tưởng Hồ Chí Minh được hình thành trên cơ sở vận dụng sáng tạo học thuyết nào?","options":{"A":"Chủ nghĩa tự do.","B":"Chủ nghĩa Mác – Lênin.","C":"Chủ nghĩa thực dụng.","D":"Chủ nghĩa dân tộc."},"answer":"B"},{"id":63,"lesson":2,"lessonTitle":"Bài 2","lessonQ":3,"question":"Hồ Chí Minh sinh ngày, tháng, năm nào?","options":{"A":"19/5/1890.","B":"19/5/1891.","C":"19/8/1890.","D":"19/8/1891."},"answer":"A"},{"id":64,"lesson":2,"lessonTitle":"Bài 2","lessonQ":4,"question":"Tác phẩm Đường Cách mệnh được xuất bản năm nào?","options":{"A":"1925.","B":"1926.","C":"1927.","D":"1930."},"answer":"C"},{"id":65,"lesson":2,"lessonTitle":"Bài 2","lessonQ":5,"question":"Theo tư tưởng Hồ Chí Minh, đạo đức giữ vai trò nào đối với người cách mạng?","options":{"A":"Nền tảng.","B":"Phương tiện.","C":"Kết quả.","D":"Điều kiện phụ."},"answer":"A"},{"id":66,"lesson":2,"lessonTitle":"Bài 2","lessonQ":6,"question":"Theo Hồ Chí Minh, nội dung nào thuộc chuẩn mực đạo đức cách mạng?","options":{"A":"Tự do tuyệt đối.","B":"Cạnh tranh tối đa.","C":"Lợi ích cá nhân.","D":"Chí công vô tư."},"answer":"D"},{"id":67,"lesson":2,"lessonTitle":"Bài 2","lessonQ":7,"question":"Yếu tố nào cho thấy sự bế tắc của con đường cứu nước ở Việt Nam cuối thế kỷ XIX, đầu thế kỷ XX?","options":{"A":"Thiếu tài nguyên.","B":"Thiếu thị trường.","C":"Các phong trào đều thất bại.","D":"Thiếu dân cư."},"answer":"C"},{"id":68,"lesson":2,"lessonTitle":"Bài 2","lessonQ":8,"question":"Vì sao chủ nghĩa Mác – Lênin được xem là nguồn gốc lý luận chủ yếu của tư tưởng Hồ Chí Minh?","options":{"A":"Phù hợp lợi ích cá nhân.","B":"Mở ra đường lối cứu nước đúng đắn.","C":"Thay thế truyền thống dân tộc.","D":"Phủ nhận mọi học thuyết khác."},"answer":"B"},{"id":69,"lesson":2,"lessonTitle":"Bài 2","lessonQ":9,"question":"Việc tiếp thu tinh hoa văn hóa nhân loại thể hiện điều gì trong quá trình hình thành tư tưởng Hồ Chí Minh?","options":{"A":"Tiếp thu nguyên vẹn.","B":"Chỉ tiếp thu phương Đông.","C":"Chỉ tiếp thu phương Tây.","D":"Chọn lọc giá trị tiến bộ."},"answer":"D"},{"id":70,"lesson":2,"lessonTitle":"Bài 2","lessonQ":10,"question":"Nội dung cốt lõi trong tư tưởng Hồ Chí Minh về độc lập dân tộc là gì?","options":{"A":"Độc lập gắn với chủ nghĩa xã hội.","B":"Độc lập tách khỏi nhân dân.","C":"Độc lập chỉ về lãnh thổ.","D":"Độc lập không cần phát triển."},"answer":"A"},{"id":71,"lesson":2,"lessonTitle":"Bài 2","lessonQ":11,"question":"Theo Hồ Chí Minh, “Nhà nước của dân” được hiểu là gì?","options":{"A":"Nhà nước do một nhóm lập ra.","B":"Nhà nước thuộc về nhân dân.","C":"Nhà nước chỉ phục vụ cán bộ.","D":"Nhà nước đứng ngoài nhân dân."},"answer":"B"},{"id":72,"lesson":2,"lessonTitle":"Bài 2","lessonQ":12,"question":"Theo Hồ Chí Minh, “Nhà nước vì dân” có nghĩa là gì?","options":{"A":"Ưu tiên lợi ích công chức.","B":"Ưu tiên lợi ích tổ chức.","C":"Lấy lợi ích nhân dân làm mục tiêu.","D":"Lấy lợi ích cá nhân làm trọng."},"answer":"C"},{"id":73,"lesson":2,"lessonTitle":"Bài 2","lessonQ":13,"question":"Vì sao Hồ Chí Minh coi phát triển kinh tế là tiền đề phát triển văn hóa?","options":{"A":"Kinh tế thay thế văn hóa.","B":"Văn hóa không cần đầu tư.","C":"Kinh tế chỉ phục vụ sản xuất.","D":"Kinh tế tạo cơ sở vật chấ
